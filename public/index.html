<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>제주 역사문화 탐방기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<style>
:root{--bg:#f6f3ee;--card:#fffdf9;--text:#26211c;--muted:#7a6f63;--line:#e6dfd4;--basalt:#2b2f33;--accent:#e8590c;--accent-bg:#fdebdd;--hero1:#16363d;--hero2:#2c5b57}
@media (prefers-color-scheme:dark){:root{--bg:#171512;--card:#211e1a;--text:#ece6dc;--muted:#a89d8f;--line:#38322b;--basalt:#0e0d0b;--accent:#ff8a3d;--accent-bg:#3a2415;--hero1:#0f2327;--hero2:#1d3d3a}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.7 "Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--text)}
h1,h2,h3,.serif{font-family:"Noto Serif KR","Batang","Times New Roman",serif;line-height:1.3}
a{color:inherit}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* nav */
nav{position:sticky;top:0;z-index:1000;background:var(--basalt);color:#f3ede3}
nav .wrap{display:flex;align-items:center;gap:6px;min-height:54px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
nav .logo{font-family:"Noto Serif KR",serif;font-weight:800;font-size:17px;text-decoration:none;margin-right:auto}
nav a.l{padding:6px 12px;border-radius:6px;text-decoration:none;font-size:14px;color:#d9d1c4}
nav a.l:hover,nav a.l.on{background:rgba(255,255,255,.12);color:#fff}
nav .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--accent);color:#fff;font-size:12px;text-align:center}
nav .badge[hidden]{display:none}
.ns{position:relative;flex:0 1 240px;margin-left:6px}
.ns input{width:100%;font:inherit;font-size:14px;padding:6px 12px;border:1px solid rgba(255,255,255,.28);border-radius:8px;background:rgba(255,255,255,.12);color:#fff}
.ns input::placeholder{color:#c9c0b2}
#gres{position:absolute;right:0;top:100%;margin-top:6px;width:min(440px,92vw);background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.3);max-height:62vh;overflow:auto;z-index:1500}
#gres[hidden]{display:none}
#gres .gi{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;width:100%;text-align:left;padding:9px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);font:inherit;font-size:14px;cursor:pointer}
#gres .gi:hover,#gres .gi:focus{background:var(--accent-bg)}
#gres .gi small{color:var(--muted);font-size:12px}
#gres .gnone,#gres .gmore{padding:10px 14px;font-size:13px;color:var(--muted)}
#gres .gmore a{color:var(--accent);font-weight:700}
#gres mark{background:var(--accent-bg);color:var(--accent);font-weight:700;border-radius:2px}
@media (max-width:760px){nav .logo{flex:1 1 100%;margin-bottom:2px}nav a.l{padding:5px 9px;font-size:13px}.ns{order:9;flex:1 1 100%;margin-left:0}#gres{left:0;right:auto}}
/* hero */
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#f6efe4;padding:72px 0 56px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;bottom:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,146,43,.35),transparent 70%)}
.hero .eyebrow{letter-spacing:.2em;font-size:13px;color:#ffc58f}
.hero h1{font-size:clamp(34px,6vw,60px);margin:8px 0 14px;font-weight:800}
.hero p{max-width:560px;font-size:17px;color:#d8e3df;margin:0 0 26px}
.stats{display:flex;flex-wrap:wrap;gap:12px 36px;margin-bottom:28px}
.stats div b{display:block;font:800 30px/1.1 "Noto Serif KR",serif;color:#fff}
.stats div span{font-size:13px;color:#b9cbc6}
.btn{display:inline-block;padding:11px 20px;border-radius:8px;border:0;background:var(--accent);color:#fff;font-weight:700;text-decoration:none}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.5);margin-left:8px}
section.blk{padding:48px 0 8px}
h2.sec{font-size:26px;margin:0 0 6px}
.sec-sub{color:var(--muted);margin:0 0 22px}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.ccard{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;transition:transform .15s,box-shadow .15s}
.ccard:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.ccard .top{height:8px}
.ccard .in{padding:16px 18px 18px}
.ccard h3{margin:0 0 4px;font-size:19px}
.ccard .m{font-size:13px;color:var(--muted);margin-bottom:8px}
.ccard p{margin:0;font-size:14px;color:var(--muted)}
.ccard .via{margin-top:10px;font-size:13px}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;color:#fff}
.today{display:grid;grid-template-columns:1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.today h3{font-size:24px;margin:6px 0}
.today p{color:var(--muted);margin:8px 0 14px}
.bar{display:flex;height:34px;border-radius:8px;overflow:hidden;font-size:13px;color:#fff;font-weight:700}
.bar div{display:flex;align-items:center;justify-content:center}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.legend button{border:2px solid var(--c);background:var(--c);color:#fff;padding:3px 12px;border-radius:99px;font-size:13px}
.legend button.off{background:transparent;color:var(--muted);border-color:var(--line)}
.map{height:520px;border-radius:12px;border:1px solid var(--line);z-index:0}
.nomap{padding:60px 20px;text-align:center;color:var(--muted)}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;border:2px solid #fff;transform:rotate(-45deg);box-shadow:0 1px 4px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg);color:#fff;font:700 12px/1 sans-serif}
.pin.dot::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.pop{font:13px/1.5 "Malgun Gothic",sans-serif;max-width:250px;color:#26211c}
.pop b{font-size:15px}.pop .m{color:#777;margin-bottom:4px}.pop p{margin:4px 0 8px}
.pop button{margin-right:5px}
.sbtn,.favbtn{padding:5px 12px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13px}
.sbtn:hover{border-color:var(--accent)}
.favbtn{border-color:#f08c00;color:#c26e00;font-weight:600}
.favbtn.on{background:#f08c00;color:#fff}
.sbtn:disabled{opacity:.35;cursor:default}
/* course page */
.chead{color:#fff;padding:44px 0 34px}
.chead a{color:rgba(255,255,255,.8);font-size:14px;text-decoration:none}
.chead h1{font-size:clamp(28px,5vw,44px);margin:8px 0 10px}
.chead p{max-width:680px;margin:0 0 14px;color:rgba(255,255,255,.92)}
.chead .facts{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:14px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;padding:28px 0 20px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}.cols .mapcol{order:-1;position:static!important}}
.mapcol{position:sticky;top:calc(var(--nav-h,54px) + 14px)}
.mapcol .map{height:calc(100vh - var(--nav-h,54px) - 46px);min-height:380px;max-height:640px}
.stop{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;scroll-margin-top:calc(var(--nav-h,54px) + 16px)}
.stop.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.stop .num{flex:none;width:34px;height:34px;border-radius:50%;color:#fff;font:700 15px/34px sans-serif;text-align:center}
.stop h3{margin:0;font-size:19px}
.stop .meta{font-size:13px;color:var(--muted);margin:2px 0 6px}
.stop p{margin:0 0 10px;font-size:14.5px}
.stop .btns{display:flex;flex-wrap:wrap;gap:6px}
.pager{display:flex;justify-content:space-between;gap:12px;padding:24px 0 48px}
.pager a{flex:1;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:10px;text-decoration:none}
.pager a small{display:block;color:var(--muted)}
.pager a.r{text-align:right}
.empty{padding:50px 20px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
/* modal */
#modal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 14px}
#modal.on{display:flex}
.sheet{background:var(--card);max-width:720px;width:100%;border-radius:14px;padding:26px 28px 28px;position:relative}
.sheet h2{margin:0 0 4px;font-size:26px}
.sheet .x{position:absolute;right:14px;top:12px;border:0;background:none;font-size:26px;color:var(--muted)}
.sheet dl{display:grid;grid-template-columns:72px 1fr;gap:3px 12px;font-size:14px;margin:14px 0}
.sheet dt{color:var(--muted)}.sheet dd{margin:0;word-break:break-word}
.sheet h4{margin:18px 0 4px;font-size:14px;color:var(--muted)}
.sheet .txt{white-space:pre-wrap;font-size:15px}
footer{margin-top:40px;background:var(--basalt);color:#b9b0a2;padding:28px 0;font-size:13px}
footer a{color:#ffc58f}
.practice{position:sticky;top:var(--nav-h,54px);z-index:999;background:#ffe066;color:#4a3800;padding:8px 0;font-size:14px;border-bottom:1px solid #e0b800}
.practice[hidden]{display:none}
.practice b{background:#4a3800;color:#ffe066;border-radius:4px;padding:1px 8px;margin-right:6px}
.practice small{opacity:.8}
.practice button{font:inherit;font-size:13px;margin-left:6px;padding:2px 10px;border:1px solid #4a3800;border-radius:6px;background:transparent;color:inherit;cursor:pointer}
.spinner{width:34px;height:34px;margin:0 auto 12px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 18px;border-radius:99px;font-size:14px;z-index:3000;max-width:92vw;display:flex;align-items:center;gap:10px}
.toast button{border:0;border-radius:99px;background:#ff922b;color:#222;font-weight:700;padding:2px 12px;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.steps li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.steps b{display:block;font-family:"Noto Serif KR",serif;margin-bottom:2px}
.steps span{font-size:14px;color:var(--muted)}
.steps a{color:var(--accent);font-weight:700}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.skel{background:linear-gradient(90deg,var(--line) 25%,var(--card) 50%,var(--line) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:10px}
@keyframes shimmer{to{background-position:-200% 0}}
.segchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 16px}
.segchips a{padding:4px 11px;border-radius:99px;border:1px solid var(--c);color:var(--c);font-size:13px;text-decoration:none;background:var(--card)}
.segchips a:hover{background:var(--c);color:#fff}
.segchips a:hover small{color:#fff}
.segchips small{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px}
.tags span{padding:0 8px;border-radius:99px;background:var(--accent-bg);color:var(--accent);font-size:12px;line-height:20px}
.mc{width:38px;height:38px;border-radius:50%;background:#16363d;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.mc span{color:#fff;font:700 13px/1 sans-serif}
.pin.done{background:#2f9e44!important}
.pin.done::after{display:none}
.stop.done h3::after{content:"✓ 다녀옴";margin-left:8px;font:700 12px "Malgun Gothic",sans-serif;color:#2f9e44;vertical-align:2px}
.donebtn{padding:5px 12px;border-radius:7px;border:1px solid #2f9e44;background:var(--card);color:#2b8a3e;font-size:13px;font-weight:600}
.donebtn.on{background:#2f9e44;color:#fff}
.memo{display:block;width:100%;margin-top:8px;padding:8px 10px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);resize:vertical}
.memo-note{font-size:12px;color:var(--muted);margin:2px 0 0}
.nearby{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 12px}
.nearby .btn{border:0}
.nearby .hint{font-size:13px;color:var(--muted)}
.nearbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.nearbox ol{list-style:none;margin:0;padding:0}
.nearbox li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.nearbox li:last-child{border-bottom:0}
.nearbox .d{flex:none;min-width:62px;font-weight:700;color:var(--accent)}
.nearbox small{color:var(--muted)}
.nearbox .warn{margin:0 0 6px;color:#c26e00;font-size:14px}
.segtabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px}
.segtabs a{flex:none;color:var(--text);padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);text-decoration:none;font-size:14px;white-space:nowrap}
.segtabs a small{color:var(--muted)}
.segtabs a.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.segtabs a.on small{color:inherit;opacity:.75}
.segnote{font-size:12px;color:var(--muted);margin:0 0 10px}
h2.segh{font-size:18px;margin:18px 0 8px}
h2.segh small{font:400 13px "Malgun Gothic",sans-serif;color:var(--muted);margin-left:6px}
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="logo" href="#/">제주 역사문화 탐방기</a>
  <a class="l" href="#/" data-nav="home">홈</a>
  <a class="l" href="#/courses" data-nav="course">테마 코스</a>
  <a class="l" href="#/mine" data-nav="mine">내 답사수첩<span class="badge" id="badge" hidden></span></a>
  <a class="l" href="search.html">자료 조회</a>
  <div class="ns"><input id="gq" type="search" placeholder="장소 검색 (예: 포구, 본향당)" aria-label="장소 검색" autocomplete="off"><div id="gres" hidden></div></div>
</div></nav>
<div class="practice" id="practice" hidden></div>
<main id="app"></main>
<footer><div class="wrap">
  자료: 제주특별자치도 「제주역사문화 위치정보」·「제주역사문화 일반정보」 (데이터 기준일 2022-12-09). 각 장소의 원문은
  <a href="https://www.jeju.go.kr/culture/digitalContents/directory.htm" target="_blank" rel="noopener">제주 문화 디렉토리</a>에서 볼 수 있습니다. 지도 © OpenStreetMap contributors.<br>
  코스는 장소 성격에 따라 묶고 가장 서쪽 지점부터 가까운 곳 순으로 이은 직선 경로이며, 실제 도로 거리와 다릅니다.
</div></footer>
<div id="modal"></div>
<script>
let DATA=[];
const THEMES={
 sea:{name:"바다와 포구",color:"#1f7ea1",lede:"해녀와 어부가 드나들던 포구, 길을 밝힌 등대와 도대불, 소금을 굽던 돌염전까지. 섬 사람의 삶이 바다와 맞닿은 자리를 따라갑니다."},
 oreum:{name:"오름과 봉우리",color:"#5f9a2a",lede:"오름은 제주의 마을과 들판을 내려다보는 자리입니다. 데이터에 실린 오름과 봉우리를 차례로 오릅니다."},
 eco:{name:"숲·습지·철새",color:"#0f9d8a",lede:"고산습지와 비자림, 철새 도래지와 반딧불이 보호구역. 사람보다 오래 이 땅을 지켜온 생태 공간을 모았습니다."},
 water:{name:"물과 하천",color:"#4b6fd6",lede:"물이 귀한 섬에서 샘과 하천은 마을이 생기는 이유였습니다. 물터와 하천, 폭포와 계곡을 따라갑니다."},
 faith:{name:"신당과 절터",color:"#8e5bb5",lede:"마을을 지키는 본향당과 신당, 오래된 절터와 석탑. 제주 사람들이 기대어 온 믿음의 자리를 찾아갑니다."},
 fort:{name:"성곽과 근대의 흔적",color:"#b5543a",lede:"읍성과 진성, 일제강점기의 진지동굴, 근대의 관청과 서원까지. 섬을 지키고 다스리던 기록을 따라갑니다."},
 life:{name:"고분과 삶의 터",color:"#c78a1b",lede:"고인돌과 옹관묘, 패총과 동굴 유적에서 시장과 음식 문화까지. 제주 사람들이 살아온 오랜 시간을 짚어봅니다."}
};
const KEYS=Object.keys(THEMES);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byId=id=>DATA.find(r=>r.id===id);
/* 요약: 세미나 안내 같은 메타 문구는 건너뛰고, 짧은 한 줄 소개는 살리고, "(중략)"과 어색한 공백을 정리한다 */
const META=/(일\s*시|장\s*소|주\s*관|주\s*최|발\s*표)\s*[:：]/;
const clean=t=>String(t||"").replace(/\(중략\)/g," ").replace(/\s+([.,!?])/g,"$1").replace(/\s+/g," ").trim();
const usable=t=>t&&t!=="해당없음"&&!META.test(t);
function lead(r){
  const a=clean(r.abs),b=clean(r.body);
  if(usable(a)&&a.length>=40)return a;
  if(usable(a)){ // 짧은 한 줄 소개 + 이어지는 본문 (같은 문장이면 중복 없이)
    if(!usable(b)||b.startsWith(a.slice(0,15)))return usable(b)&&b.length>a.length?b:a;
    return a+" "+b;
  }
  return usable(b)?b:"";
}
function snip(r,n){const t=lead(r);if(t.length<=n)return t;const c=t.slice(0,n),i=c.lastIndexOf(" ");return (i>n*.6?c.slice(0,i):c)+"…"}
/* 한 줄 소개 칩: 분류(디렉토리) + 주제 키워드 */
function tags(r){
  const out=[];const add=v=>{v=String(v||"").trim();if(v&&v!=="해당없음"&&v!=="기타"&&v.length>=2&&v.length<=10&&!out.includes(v)&&!r.name.includes(v))out.push(v)};
  add(r.d1);add(r.d2);String(r.topic||"").split(/[.,]/).forEach(add);
  return out.slice(0,4);
}

    const me={lat:pos.coords.latitude,lng:pos.coords.longitude},list=DATA.map(r=>({r,d:hav(me,r)})).sort((a,b)=>a.d-b.d).slice(0,5),far=list[0].d>60;
    out.innerHTML=`<div class="nearbox">${far?`<p class="warn">제주에서 멀리 떨어져 계신 것 같아요. 가장 가까운 곳도 약 ${list[0].d.toFixed(0)}km 거리예요.</p>`:""}<ol>`+
      list.map(({r,d})=>`<li><span class="d">${fmtKm(d)}</span><b>${esc(r.name)}</b><small>${esc(r.area)} · ${esc(THEMES[r.theme].name)}</small><button class="sbtn" onclick="showOnHome(${r.id})">지도에서 보기</button><button class="sbtn" onclick="openPlace(${r.id})">이야기 읽기</button>${favBtn(r.id)}</li>`).join("")+`</ol></div>`;
    const mm=curMM;if(mm){
      if(userMarker)userMarker.remove();
      userMarker=L.circleMarker([me.lat,me.lng],{radius:8,color:"#fff",weight:3,fillColor:"#1971c2",fillOpacity:1}).addTo(mm.map).bindTooltip("내 위치",{permanent:false});
      const pts=list.map(x=>[x.r.lat,x.r.lng]);if(!far)pts.push([me.lat,me.lng]);
      mm.map.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:14});
    }
  },err=>{
    btn.disabled=false;btn.textContent="📍 내 위치에서 가까운 곳 찾기";
    say(err.code===1?"위치 사용이 허용되지 않았어요. 주소창의 위치 권한을 허용한 뒤 다시 눌러 주세요.":"위치를 확인하지 못했어요. 잠시 후 다시 시도해 주세요.");
  },{timeout:10000,maximumAge:60000});
}
function showOnHome(id){
  const mm=curMM;if(!mm)return;const m=mm.markers[id],r=byId(id);
  $("#map").scrollIntoView({block:"center",behavior:"smooth"});
  mm.map.setView([r.lat,r.lng],Math.max(mm.map.getZoom(),13));
  if(mm.group&&mm.group.hasLayer(m))mm.group.zoomToShowLayer(m,()=>m.openPopup());else m.openPopup();
}
/* 화면: 카드 */
function stopCard(r,i,leg,mine){
  const col=mine?"#e8590c":THEMES[r.theme].color;
  return `<article class="stop${isDone(r.id)?" done":""}" id="s${r.id}" data-id="${r.id}"><div class="num" style="background:${col}">${i+1}</div><div style="min-width:0;flex:1"><h3>${esc(r.name)}</h3>
   <div class="meta">${esc(r.area)} · ${mine?esc(THEMES[r.theme].name)+" · ":""}${leg}</div>${tagHtml(r)}<p>${esc(snip(r,mine?110:170))}</p>
   <div class="btns"><button class="sbtn" onclick="openPlace(${r.id})">이야기 읽기</button><button class="sbtn" onclick="focusPin(${r.id})">지도에서 보기</button>
   ${mine?`${doneBtn(r.id)}<button class="sbtn" onclick="moveFav(${r.id},-1)" ${i?"":"disabled"}>▲</button><button class="sbtn" onclick="moveFav(${r.id},1)" ${i<favs.length-1?"":"disabled"}>▼</button><button class="sbtn" onclick="toggleFav(${r.id})">✕ 빼기</button>`:favBtn(r.id)}</div>
   ${mine?memoBox(r.id):""}</div></article>`;
}
function focusPin(id){
  const mm=curMM;if(!mm)return;const m=mm.markers[id],r=byId(id);
  mm.map.setView([r.lat,r.lng],Math.max(mm.map.getZoom(),13));
  if(mm.group&&mm.group.hasLayer(m))mm.group.zoomToShowLayer(m,()=>m.openPopup());else m.openPopup();
  if(innerWidth<=900)$("#map").scrollIntoView({block:"center"});
  setActive(id);
}
function setActive(id,scroll){document.querySelectorAll(".stop").forEach(e=>e.classList.toggle("active",+e.dataset.id===id));if(scroll){const e=$("#s"+id);if(e)e.scrollIntoView({block:"center",behavior:"smooth"})}}
/* 화면: 코스 */
function viewCourse(k,segNo){
  const t=THEMES[k],S=SEGS[k],seg=S[segNo-1]||null,l=seg?seg.list:ROUTES[k],c1=l.filter(r=>r.city==="제주시").length,i=KEYS.indexOf(k),p=THEMES[KEYS[(i+KEYS.length-1)%KEYS.length]],n=THEMES[KEYS[(i+1)%KEYS.length]];
  const facts=seg
    ?`<span>📍 ${l.length}곳</span><span>구간 ${seg.no}/${S.length} · ${esc(seg.name)}</span><span>직선거리 약 ${segKm(seg).toFixed(1)}km</span><span>차로 이동 약 ${fmtMin(segKm(seg))}</span>`
    :`<span>📍 ${l.length}곳</span>${S.length>1?`<span>${S.length}개 구간</span>`:""}<span>구간 내 직선거리 합계 약 ${courseKm(k).toFixed(1)}km</span><span>제주시 ${c1} · 서귀포시 ${l.length-c1}</span>`;
  const tabs=S.length>1?`<div class="segtabs" role="navigation" aria-label="구간 선택"><a href="#/course/${k}" ${seg?"":'class="on" aria-current="page"'}>전체 <small>${ROUTES[k].length}곳</small></a>${S.map(s=>`<a href="#/course/${k}/${s.no}" ${s===seg?'class="on" aria-current="page"':""}>${s.no}. ${esc(s.name)} <small>${s.list.length}곳 · ${fmtMin(segKm(s))}</small></a>`).join("")}</div>
    <p class="segnote">한 번에 걷기엔 먼 코스라 행정시와 서·동으로 구간을 나눴어요. 이동 시간은 직선거리 기준 차량 이동의 대략값입니다.</p>`:"";
  let idx=0;
  const cards=seg
    ?l.map((r,j)=>stopCard(r,j,legTxt(legs(l),j))).join("")
    :S.map(s=>{const lg=legs(s.list);return (S.length>1?`<h2 class="segh serif">${s.no}. ${esc(s.name)}<small>${s.list.length}곳 · 직선 약 ${segKm(s).toFixed(0)}km · 차로 약 ${fmtMin(segKm(s))}</small></h2>`:"")+s.list.map((r,j)=>stopCard(r,idx++,legTxt(lg,j))).join("")}).join("");
  $("#app").innerHTML=`<header class="chead" style="background:${t.color}"><div class="wrap"><a href="#/courses">← 테마 코스 목록</a><h1>${t.name}</h1><p>${esc(t.lede)}</p>
   <div class="facts">${facts}</div></div></header>
  <div class="wrap">${tabs}<div class="cols"><div>${cards}</div><div class="mapcol"><div class="map" id="map"></div></div></div>
  <div class="pager"><a href="#/course/${KEYS[(i+KEYS.length-1)%KEYS.length]}"><small>← 이전 코스</small>${p.name}</a><a class="r" href="#/course/${KEYS[(i+1)%KEYS.length]}"><small>다음 코스 →</small>${n.name}</a></div></div>`;
  mkMap($("#map"),l,{numbered:true,color:()=>t.color,line:t.color,segs:seg?[l]:S.map(s=>s.list),onPick:id=>setActive(id,true)});
}
/* 화면: 내 답사수첩 */
function moveFav(id,d){const i=favs.indexOf(id),j=i+d;if(j<0||j>=favs.length)return;[favs[i],favs[j]]=[favs[j],favs[i]];saveFavs();viewMine()}
function copyCourse(){
  const l=favs.map(byId),lg=legs(l);
  const txt="나만의 제주 역사문화 답사 코스\n"+l.map((r,i)=>`${i+1}. ${isDone(r.id)?"[다녀옴] ":""}${r.name} (${r.addr})${i?` - 이전에서 약 ${lg[i-1].toFixed(1)}km`:""}${memoOf(r.id)?`\n   메모: ${memoOf(r.id).replace(/\s+/g," ")}`:""}`).join("\n")+`\n직선거리 합계 약 ${sum(lg).toFixed(1)}km`;
  const done=()=>toast("코스를 클립보드에 복사했습니다");
  const fb=()=>{const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){toast("복사에 실패했습니다")}a.remove()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(done,fb);else fb();
}
function viewMine(){
  destroyMap();const l=favs.map(byId),lg=legs(l);
  $("#app").innerHTML=`<header class="chead" style="background:#e8590c"><div class="wrap"><a href="#/">← 홈</a><h1>내 답사수첩</h1><p>담은 순서대로 이어진 나만의 답사 코스입니다. 순서를 바꾸면 지도의 선도 함께 바뀝니다.</p>
   <div class="facts"><span>📍 ${l.length}곳</span><span>직선거리 합계 약 ${sum(lg).toFixed(1)}km</span><span id="progress"></span></div></div></header>
  <div class="wrap">`+(l.length?`<div class="cols" style="padding-bottom:20px"><div><div class="acts"><button class="sbtn" onclick="copyCourse()">코스를 글로 복사</button><button class="sbtn" onclick="if(confirm('수첩을 모두 비울까요?')){favs=[];saveFavs();updateFavUI();viewMine()}">전체 비우기</button></div>${l.map((r,j)=>stopCard(r,j,legTxt(lg,j),true)).join("")}</div>
   <div class="mapcol"><div class="map" id="map"></div></div></div>`:
   `<div class="empty" style="margin:30px 0"><p style="font-size:18px;margin:0 0 6px">아직 담은 장소가 없습니다.</p>코스의 ☆ 수첩에 담기 버튼을 누르면 담은 순서대로 이곳에 코스가 만들어집니다.<br><br><a class="btn" href="#/">코스 둘러보기</a></div>`)+`</div>`;
  if(l.length)mkMap($("#map"),l,{numbered:true,color:()=>"#e8590c",line:"#e8590c",onPick:id=>setActive(id,true)});
  updateFavUI();updateNotesUI();
}
/* 장소 검색 (메뉴의 검색창): 장소명·주소·제목·주제·요약·본문에서 찾는다 */
function closeG(){const b=$("#gres");if(b)b.hidden=true}
function gsearch(){
  const raw=$("#gq").value.trim(),q=raw.toLowerCase(),box=$("#gres");
  if(!q){closeG();return}
  if(!DATA.length){box.hidden=false;box.innerHTML='<div class="gnone">데이터를 불러오는 중이에요…</div>';return}
  const hits=DATA.map(r=>({r,s:r.name.toLowerCase().includes(q)?2:r._s.includes(q)?1:0})).filter(x=>x.s).sort((a,b)=>b.s-a.s||a.r.id-b.r.id);
  const mark=t=>{const i=t.toLowerCase().indexOf(q);return i<0?esc(t):esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length))};
  box.hidden=false;
  box.innerHTML=hits.length
    ?hits.slice(0,8).map(({r})=>`<button class="gi" data-id="${r.id}"><b>${mark(r.name)}</b><span class="chip" style="background:${THEMES[r.theme].color};font-size:11px">${esc(THEMES[r.theme].name)}</span><small>${esc(r.area)}</small></button>`).join("")+
      `<div class="gmore">${hits.length}곳 찾았어요${hits.length>8?" (위 8곳 표시)":""} · <a href="search.html?q=${encodeURIComponent(raw)}">자료 조회에서 표로 보기 →</a></div>`
    :`<div class="gnone">'${esc(raw)}'와 맞는 장소가 없어요. 장소명이나 지역, 주제어로 찾아 보세요.</div>`;
}
$("#gq").addEventListener("input",()=>{clearTimeout(gsearch.t);gsearch.t=setTimeout(gsearch,120)});
$("#gq").addEventListener("focus",()=>{if($("#gq").value.trim())gsearch()});
$("#gq").addEventListener("keydown",e=>{
  if(e.key==="Escape")closeG();
  else if(e.key==="ArrowDown"){const b=$("#gres .gi");if(b){e.preventDefault();b.focus()}}
  else if(e.key==="Enter"){const b=$("#gres .gi");if(b)b.click()}
});
$("#gres").addEventListener("click",e=>{const b=e.target.closest(".gi");if(b){closeG();openPlace(+b.dataset.id)}});
$("#gres").addEventListener("keydown",e=>{
  const items=[...$("#gres").querySelectorAll(".gi")],i=items.indexOf(document.activeElement);
  if(e.key==="ArrowDown"&&i>=0){e.preventDefault();(items[i+1]||items[i]).focus()}
  else if(e.key==="ArrowUp"&&i>=0){e.preventDefault();(i?items[i-1]:$("#gq")).focus()}
  else if(e.key==="Escape"){closeG();$("#gq").focus()}
});
document.addEventListener("click",e=>{if(!e.target.closest(".ns"))closeG()});
/* 메뉴 높이가 바뀔 때마다(모바일에서 두 줄이 되는 경우 등) CSS 변수를 갱신 */
{const nav=document.querySelector("nav"),set=()=>document.documentElement.style.setProperty("--nav-h",nav.offsetHeight+"px");set();if(window.ResizeObserver)new ResizeObserver(set).observe(nav);else addEventListener("resize",set)}
/* 라우터 */
function go(){
  closePlace();destroyMap();const h=location.hash.replace(/^#\/?/,"").split("/");
  if(h[0]==="course"&&THEMES[h[1]])viewCourse(h[1],parseInt(h[2])||0);else if(h[0]==="courses")viewCourses();else if(h[0]==="mine")viewMine();else viewHome();
  const cur2=h[0]==="course"||h[0]==="courses"?"course":h[0]==="mine"?"mine":"home";
  document.querySelectorAll("nav a[data-nav]").forEach(a=>a.classList.toggle("on",a.dataset.nav===cur2));
  closeG();
  updateFavUI();scrollTo(0,0);
}
/* 데이터: 서버의 /api/places (일반정보 + 위치정보 API를 합친 결과)
   API가 실패하면 /api/practice (1단계 파일 데이터)로 '연습 모드'로 보여 준다 */
let bound=false;
function boot(rows){
  DATA=rows;
  DATA.forEach(r=>{r.city=r.addr.split(" ")[1]||"";r.area=r.addr.split(" ").slice(1,3).join(" ");r._s=[r.name,r.addr,r.title,r.topic,r.d1,r.d2,r.abs,r.body].join("\n").toLowerCase()});
  KEYS.forEach(k=>{SEGS[k]=segment(DATA.filter(r=>r.theme===k));ROUTES[k]=SEGS[k].flatMap(s=>s.list)});
  favs=favs.filter(i=>byId(i));
  if(!bound){addEventListener("hashchange",go);bound=true}
  go();
}
async function getJSON(url){
  let r;try{r=await fetch(url)}catch{throw new Error("서버에 연결하지 못했습니다.")}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||"서버 오류 (HTTP "+r.status+")");
  return j;
}
async function fetchPlaces(){
  try{
    const j=await getJSON("/api/places");
    if(!j.length)throw new Error("API에서 받은 장소가 없습니다.");
    return {rows:j,reason:null};
  }catch(e){
    try{return {rows:await getJSON("/api/practice"),reason:e.message}}catch{throw e}
  }
}
function showPractice(reason){
  const b=$("#practice");b.hidden=!reason;
  if(reason){
    console.warn("[연습 모드] 데이터 API 실패:",reason);
    b.setAttribute("role","status");
    b.innerHTML=`<div class="wrap"><b>연습 모드</b> 최신 데이터를 가져오지 못해 저장된 자료(2022-12-09 기준)로 보여 드리고 있어요. <button onclick="load(true)">다시 연결</button></div>`;
  }
}
function failed(msg){
  console.warn("[데이터 불러오기 실패]",msg);
  $("#app").innerHTML=`<div class="wrap"><div class="empty" style="margin:60px 0" role="alert"><p style="font-size:18px;margin:0 0 6px">데이터를 불러오지 못했어요.</p>잠시 후 다시 시도해 주세요.<br><br><button class="btn" onclick="load()">다시 시도</button></div></div>`;
}
const skeleton=()=>`<div role="status" aria-live="polite" aria-label="데이터를 불러오는 중"><div class="skel" style="height:300px;border-radius:0"></div><div class="wrap" style="padding-top:28px"><div style="text-align:center;color:var(--muted);margin-bottom:20px"><div class="spinner"></div>데이터를 불러오는 중…</div><div class="grid">${"<div class='skel' style='height:150px'></div>".repeat(6)}</div></div></div>`;
/* quiet=true: 연습 모드에서 화면을 유지한 채 API 재연결만 시도 */
async function load(quiet){
  if(!quiet){destroyMap();showPractice(null);$("#app").innerHTML=skeleton()}
  else $("#practice button").textContent="연결 중…";
  try{
    const {rows,reason}=await fetchPlaces();
    if(quiet&&reason){showPractice(reason);toast("아직 API에 연결되지 않았어요");return}
    boot(rows);showPractice(reason);
    if(quiet)toast("API 데이터로 전환했어요");
  }catch(e){
    if(quiet){showPractice(e.message);return}
    failed(e.message);
  }
}
load();
</script>
</body>
</html>
