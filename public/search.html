<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>제주 역사문화 정보 조회</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
#lmap{height:440px;border-radius:6px;z-index:0}
.pin{width:24px;height:24px;border-radius:50% 50% 50% 0;background:var(--accent);border:2px solid #fff;transform:rotate(-45deg);box-shadow:0 1px 4px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;position:relative}
.pin.fav{background:#f08c00}
.pin.sel{background:#e5484d;width:30px;height:30px}
.pin::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff}
.pin.fav::after{display:none}
.pin span{transform:rotate(45deg);color:#fff;font:700 12px/1 sans-serif}
.favbtn{font:inherit;padding:6px 14px;margin:4px 0 8px;border:1px solid #f08c00;border-radius:6px;background:var(--card);color:#c26e00;cursor:pointer;font-weight:600}
.favbtn.on{background:#f08c00;color:#fff}
.course{padding:12px}
.course h3{margin:0 0 4px;font-size:15px}
.course .sum{font-size:13px;color:var(--muted);margin-bottom:6px}
.course ol{margin:0;padding:0;list-style:none;max-height:200px;overflow:auto}
.course li{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.course li .n{flex:none;width:22px;height:22px;border-radius:50%;background:#f08c00;color:#fff;font:700 12px/22px sans-serif;text-align:center}
.course li .t{flex:1;min-width:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.course li .d{color:var(--muted);font-size:12px}
.course li button,.course .acts button{font:inherit;font-size:12px;padding:2px 7px;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--text);cursor:pointer}
.course .acts{margin-top:8px;display:flex;gap:6px}
.pop{font:13px/1.5 "Malgun Gothic",system-ui,sans-serif;max-width:260px}
.pop b{font-size:15px}.pop .m{color:#666}.pop p{margin:6px 0;max-height:110px;overflow:auto}
.pop button{font:inherit;padding:3px 10px;border:0;border-radius:5px;background:#0b7a75;color:#fff;cursor:pointer;margin-right:6px}
.mapnote{padding:0 2px;font-size:12px;color:var(--muted)}
:root{--bg:#f5f7fa;--card:#fff;--text:#1d2733;--muted:#6b7785;--line:#e1e6ec;--accent:#0b7a75;--accent-bg:#e3f4f3;--hl:#fff3b0}
@media (prefers-color-scheme:dark){:root{--bg:#14181d;--card:#1d232a;--text:#e6ebf0;--muted:#93a0ad;--line:#2e3740;--accent:#4fd1c5;--accent-bg:#183533;--hl:#5a4d00}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 "Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{padding:20px 24px 8px}
h1{margin:0;font-size:22px}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;padding:12px 24px 24px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr;padding:12px 16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.filters input,.filters select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text)}
.filters input{flex:1 1 220px}
.filters button{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text);cursor:pointer}
.count{padding:0 12px 8px;color:var(--muted);font-size:13px}
.practice{position:sticky;top:0;z-index:1000;background:#ffe066;color:#4a3800;padding:8px 24px;font-size:14px;border-bottom:1px solid #e0b800}
.practice[hidden]{display:none}
.practice b{background:#4a3800;color:#ffe066;border-radius:4px;padding:1px 8px;margin-right:6px}
.practice small{opacity:.8}
.practice button{font:inherit;font-size:13px;margin-left:6px;padding:2px 10px;border:1px solid #4a3800;border-radius:6px;background:transparent;color:inherit;cursor:pointer}
.spinner{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-2px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tbl{max-height:62vh;overflow:auto;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none;font-size:13px;color:var(--muted)}
th.s::after{content:" ▲"}th.s.d::after{content:" ▼"}
td.w{white-space:normal;min-width:180px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--accent-bg)}
tbody tr.sel{background:var(--accent-bg);outline:2px solid var(--accent);outline-offset:-2px}
mark{background:var(--hl);color:inherit;border-radius:2px}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--accent-bg);color:var(--accent);font-size:12px}
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:16px}
@media (max-width:900px){.side{position:static}}
.detail{padding:16px;max-height:60vh;overflow:auto}
.detail h2{margin:0 0 2px;font-size:19px}
.detail .sub{color:var(--muted);font-size:13px;margin-bottom:10px}
dl{margin:10px 0;display:grid;grid-template-columns:76px 1fr;gap:4px 10px;font-size:14px}
dt{color:var(--muted)}dd{margin:0;word-break:break-word}
.body{white-space:pre-wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:10px;font-size:14px}
.detail a{color:var(--accent)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.map{padding:10px}
.map h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
svg{width:100%;height:auto;display:block;background:var(--bg);border-radius:6px}
</style>
</head>
<body>
<div class="practice" id="practice" hidden></div>
<header>
  <h1>제주 역사문화 정보 조회</h1>
  <p>제주특별자치도 제주역사문화 위치정보 + 일반정보 (데이터 기준일 2022-12-09)</p>
</header>
<div class="wrap">
  <section class="card">
    <div class="filters">
      <input id="q" type="search" placeholder="장소명·제목·주소·내용 검색">
      <select id="fCat"><option value="">분류 전체</option></select>
      <select id="fD1"><option value="">디렉토리 전체</option></select>
      <select id="fCity"><option value="">지역 전체</option><option>제주시</option><option>서귀포시</option></select>
      <button id="reset">초기화</button>
    </div>
    <div class="count" id="count"></div>
    <div class="tbl"><table>
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
  <aside class="side">
    <div class="card map"><h3>지도 (핀을 누르면 설명이 표시됩니다)</h3><div id="lmap"></div><div class="mapnote" id="mapnote"></div></div>
    <div class="card course" id="course"></div>
    <div class="card detail" id="detail"><div class="empty">목록에서 항목을 선택하면 상세 정보가 표시됩니다.</div></div>
  </aside>
</div>
<script>
let DATA=[];
const COLS=[["id","번호"],["name","장소명",1],["cat","분류"],["d1","디렉토리"],["city","지역"],["addr","주소",1]];
const prep=()=>DATA.forEach(r=>{r.city=(r.addr.split(" ")[1]||"");r.id=+r.id;r._s=[r.name,r.title,r.addr,r.topic,r.body,r.d1,r.d2].join("\n").toLowerCase()});
const $=s=>document.querySelector(s);
let sort={k:"id",d:1},sel=null,view=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uniq=k=>[...new Set(DATA.map(r=>r[k]))].sort((a,b)=>a.localeCompare(b,"ko"));
const fillSel=()=>{uniq("cat").forEach(v=>$("#fCat").add(new Option(v,v)));uniq("d1").forEach(v=>$("#fD1").add(new Option(v,v)))};
$("#head").innerHTML=COLS.map(c=>`<th data-k="${c[0]}">${c[1]}</th>`).join("");
function hl(t,q){t=esc(t);if(!q)return t;const e=esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return t.replace(new RegExp(e,"gi"),m=>`<mark>${m}</mark>`)}
function render(fit){
  const q=$("#q").value.trim(),ql=q.toLowerCase(),c=$("#fCat").value,d=$("#fD1").value,ci=$("#fCity").value;
  view=DATA.filter(r=>(!c||r.cat===c)&&(!d||r.d1===d)&&(!ci||r.city===ci)&&(!ql||r._s.includes(ql)));
  view.sort((a,b)=>{const x=a[sort.k],y=b[sort.k];return (typeof x==="number"?x-y:String(x).localeCompare(String(y),"ko"))*sort.d});
  $("#count").textContent=`총 ${DATA.length}건 중 ${view.length}건`;
  document.querySelectorAll("th").forEach(th=>{th.className=th.dataset.k===sort.k?"s"+(sort.d<0?" d":""):""});
  $("#rows").innerHTML=view.map(r=>`<tr data-id="${r.id}" class="${sel===r.id?"sel":""}">`+COLS.map(([k,,w])=>`<td${w?' class="w"':""}>${k==="cat"?`<span class="tag">${esc(r[k])}</span>`:(k==="name"&&favs.includes(r.id)?"<b style='color:#f08c00'>★ </b>":"")+hl(r[k],k==="name"||k==="addr"?q:"")}</td>`).join("")+"</tr>").join("")||`<tr><td colspan="6" class="empty">조건에 맞는 결과가 없습니다.</td></tr>`;
  renderCourse();
  drawMap(fit===true);
}
let map=null,markers={},route=null;
const icon=id=>{const s=id===sel,n=favs.indexOf(id)+1;return L.divIcon({className:"",html:`<div class="pin${n?" fav":""}${s?" sel":""}"><span>${n||""}</span></div>`,iconSize:s?[30,30]:[24,24],iconAnchor:s?[8,30]:[6,24],popupAnchor:[0,-26]})};
let favs=[];try{favs=JSON.parse(localStorage.getItem("jejuFavs")||"[]")}catch(e){}
const saveFavs=()=>{try{localStorage.setItem("jejuFavs",JSON.stringify(favs))}catch(e){}};
const byId=id=>DATA.find(r=>r.id===id);
const favBtn=r=>{const i=favs.indexOf(r.id);return `<button class="favbtn${i>=0?" on":""}" onclick="toggleFav(${r.id})">${i>=0?`★ 찜 해제 (코스 ${i+1}번)`:"☆ 찜하기"}</button>`};
function toggleFav(id){
  const i=favs.indexOf(id);if(i>=0)favs.splice(i,1);else favs.push(id);
  saveFavs();if(sel===id)show(id,true);else render();
  const m=markers[id];if(m&&m.isPopupOpen())m.setPopupContent(popHtml(byId(id)));
}
function moveFav(id,d){const i=favs.indexOf(id),j=i+d;if(j<0||j>=favs.length)return;[favs[i],favs[j]]=[favs[j],favs[i]];saveFavs();render()}
function dist(a,b){const R=6371,t=x=>x*Math.PI/180,h=Math.sin(t(b.lat-a.lat)/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(t(b.lng-a.lng)/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function renderCourse(){
  const L2=favs.map(byId),legs=L2.slice(1).map((r,i)=>dist(L2[i],r)),tot=legs.reduce((a,b)=>a+b,0);
  $("#course").innerHTML=`<h3>나만의 답사 코스</h3>`+(favs.length?
   `<div class="sum">${favs.length}곳 · 직선거리 합계 약 ${tot.toFixed(1)}km</div><ol>`+L2.map((r,i)=>`<li><span class="n">${i+1}</span><span class="t" onclick="show(${r.id})" title="${esc(r.name)}">${esc(r.name)}</span><span class="d">${i?`+${legs[i-1].toFixed(1)}km`:"출발"}</span><button onclick="moveFav(${r.id},-1)" ${i?"":"disabled"}>▲</button><button onclick="moveFav(${r.id},1)" ${i<L2.length-1?"":"disabled"}>▼</button><button onclick="toggleFav(${r.id})">✕</button></li>`).join("")+`</ol><div class="acts"><button onclick="fitCourse()">코스 전체 보기</button><button onclick="if(confirm('찜 목록을 모두 지울까요?')){favs=[];saveFavs();render()}">전체 삭제</button></div>`
   :`<div class="sum">상세 카드나 지도 팝업의 ☆ 찜하기를 누르면 찜한 순서대로 코스가 만들어집니다.</div>`);
}
function fitCourse(){if(map&&favs.length)map.fitBounds(L.latLngBounds(favs.map(i=>{const r=byId(i);return[r.lat,r.lng]})),{padding:[40,40],maxZoom:14})}
function popHtml(r){
  const a=r.abs&&r.abs!=="해당없음"?r.abs:(r.body||"");
  return `<div class="pop"><b>${esc(r.name)}</b><div class="m">${esc(r.cat)} · ${esc(r.d1)}</div><div>${esc(r.addr)}</div>`+
   (r.title?`<div class="m">${esc(r.title)}</div>`:"")+(a?`<p>${esc(a.length>220?a.slice(0,220)+"…":a)}</p>`:"")+
   `<div>${favBtn(r)}</div><button onclick="show(${r.id})">상세 보기</button>`+(r.link?`<a href="${esc(r.link)}" target="_blank" rel="noopener">원문</a>`:"")+`</div>`;
}
function drawMap(fit){
  if(typeof L==="undefined"){$("#lmap").innerHTML='<div class="empty">지도를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.</div>';return}
  if(!map){
    map=L.map("lmap").setView([33.38,126.55],9);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{maxZoom:19,subdomains:"abcd",attribution:'&copy; OpenStreetMap contributors &copy; CARTO'}).addTo(map);
    DATA.forEach(r=>{const m=L.marker([r.lat,r.lng],{icon:icon(r.id),title:r.name}).bindPopup(()=>popHtml(r));m.on("click",()=>{if(sel!==r.id)show(r.id,true)});markers[r.id]=m});
  }
  const ids=new Set(view.map(r=>r.id));
  DATA.forEach(r=>{const m=markers[r.id],on=ids.has(r.id)||favs.includes(r.id);
    if(on&&!map.hasLayer(m))m.addTo(map);else if(!on&&map.hasLayer(m))m.remove();
    m.setIcon(icon(r.id));m.setZIndexOffset(r.id===sel?1000:favs.includes(r.id)?500:0)});
  if(route){route.remove();route=null}
  if(favs.length>1)route=L.polyline(favs.map(i=>{const r=byId(i);return[r.lat,r.lng]}),{color:"#f08c00",weight:4,opacity:.9,dashArray:"9 8"}).addTo(map);
  const extra=favs.filter(i=>!ids.has(i)).length;
  $("#mapnote").textContent=`지도에 핀 ${view.length}개 표시 중`+(extra?` (+ 검색 밖 찜 ${extra}곳)`:"");
  if(fit&&view.length)map.fitBounds(L.latLngBounds(view.map(r=>[r.lat,r.lng])),{padding:[30,30],maxZoom:14});
}
function show(id,fromMap){
  sel=id;const r=DATA.find(x=>x.id===id);if(!r)return;
  const row=(k,v)=>v&&v!=="해당없음"?`<dt>${k}</dt><dd>${v}</dd>`:"";
  $("#detail").innerHTML=`<h2>${esc(r.name)}</h2><div class="sub">${esc(r.cat)} · ${esc(r.d1)}${r.d2&&r.d2!==r.d1?" › "+esc(r.d2):""}</div><dl>`+
   row("주소",esc(r.addr))+row("우편번호",esc(r.zip))+row("좌표",`${r.lat}, ${r.lng}`)+row("제목",esc(r.title))+row("부제목",esc(r.sub))+row("저작자",esc(r.author))+row("주제",esc(r.topic))+row("발행자",esc(r.pub))+row("발행일",esc(r.date))+
   row("원문",r.link?`<a href="${esc(r.link)}" target="_blank" rel="noopener">제주 문화 디렉토리에서 보기</a>`:"")+`</dl>`+favBtn(r)+
   (r.abs&&r.abs!=="해당없음"?`<div class="body"><b>초록</b>\n${esc(r.abs)}</div>`:"")+
   (r.body?`<div class="body"><b>내용</b>\n${esc(r.body)}</div>`:"")+
   (r.ref&&r.ref!=="해당없음"?`<div class="body"><b>참고문헌</b>\n${esc(r.ref)}</div>`:"");
  render();
  const m=markers[id];
  if(m&&!fromMap){map.setView([r.lat,r.lng],Math.max(map.getZoom(),13));m.openPopup()}
  const tr=document.querySelector(`#rows tr[data-id="${id}"]`);if(tr)tr.scrollIntoView({block:"nearest"});
}
$("#rows").onclick=e=>{const t=e.target.closest("tr[data-id]");if(t)show(+t.dataset.id)};
$("#head").onclick=e=>{const k=e.target.dataset.k;if(!k)return;sort={k,d:sort.k===k?-sort.d:1};render()};
["#q","#fCat","#fD1","#fCity"].forEach(s=>$(s).addEventListener("input",()=>render(true)));
$("#reset").onclick=()=>{["#q","#fCat","#fD1","#fCity"].forEach(s=>$(s).value="");render(true)};
/* 데이터: 서버의 /api/places (일반정보 + 위치정보 API를 합친 결과) */
/* API가 실패하면 /api/practice (1단계 파일 데이터)로 '연습 모드'로 보여 준다 */
async function getJSON(url){
  let r;try{r=await fetch(url)}catch{throw new Error("서버에 연결하지 못했습니다.")}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||"서버 오류 (HTTP "+r.status+")");
  return j;
}
async function fetchPlaces(){
  try{
    const j=await getJSON("/api/places");
    if(!j.length)throw new Error("API에서 받은 장소가 없습니다.");
    return {rows:j,reason:null};
  }catch(e){
    try{return {rows:await getJSON("/api/practice"),reason:e.message}}catch{throw e}
  }
}
function showPractice(reason){
  const b=$("#practice");b.hidden=!reason;
  if(reason)b.innerHTML=`<b>연습 모드</b> 데이터 API에 연결하지 못해 1단계 파일 데이터(2022-12-09 기준)로 보여 주고 있어요. <small>사유: ${esc(reason)}</small> <button onclick="load(true)">API 다시 연결</button>`;
}
function apply(rows){
  DATA=rows;prep();favs=favs.filter(i=>byId(i));
  if(map){map.remove();map=null;markers={};route=null}
  $("#fCat").length=1;$("#fD1").length=1;fillSel();render(true);
}
/* quiet=true: 연습 모드에서 화면을 유지한 채 API 재연결만 시도 */
async function load(quiet){
  if(!quiet){showPractice(null);$("#count").innerHTML='<span class="spinner"></span>데이터를 불러오는 중…'}
  else $("#practice button").textContent="연결 중…";
  try{
    const {rows,reason}=await fetchPlaces();
    if(quiet&&reason){showPractice(reason);return}
    apply(rows);showPractice(reason);
  }catch(e){
    if(quiet){showPractice(e.message);return}
    $("#count").innerHTML=`데이터를 불러오지 못했습니다: ${esc(e.message)} <button onclick="load()">다시 시도</button>`;
  }
}
load();
</script>
</body>
</html>
