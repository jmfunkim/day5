<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>제주 역사문화 탐방기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f6f3ee;--card:#fffdf9;--text:#26211c;--muted:#7a6f63;--line:#e6dfd4;--basalt:#2b2f33;--accent:#e8590c;--accent-bg:#fdebdd;--hero1:#16363d;--hero2:#2c5b57}
@media (prefers-color-scheme:dark){:root{--bg:#171512;--card:#211e1a;--text:#ece6dc;--muted:#a89d8f;--line:#38322b;--basalt:#0e0d0b;--accent:#ff8a3d;--accent-bg:#3a2415;--hero1:#0f2327;--hero2:#1d3d3a}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.7 "Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--text)}
h1,h2,h3,.serif{font-family:"Noto Serif KR","Batang","Times New Roman",serif;line-height:1.3}
a{color:inherit}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* nav */
nav{position:sticky;top:0;z-index:1000;background:var(--basalt);color:#f3ede3}
nav .wrap{display:flex;align-items:center;gap:6px;height:54px}
nav .logo{font-family:"Noto Serif KR",serif;font-weight:800;font-size:17px;text-decoration:none;margin-right:auto}
nav a.l{padding:6px 12px;border-radius:6px;text-decoration:none;font-size:14px;color:#d9d1c4}
nav a.l:hover,nav a.l.on{background:rgba(255,255,255,.12);color:#fff}
nav .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--accent);color:#fff;font-size:12px;text-align:center}
@media (max-width:640px){nav a.l.hide{display:none}}
/* hero */
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#f6efe4;padding:72px 0 56px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;bottom:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,146,43,.35),transparent 70%)}
.hero .eyebrow{letter-spacing:.2em;font-size:13px;color:#ffc58f}
.hero h1{font-size:clamp(34px,6vw,60px);margin:8px 0 14px;font-weight:800}
.hero p{max-width:560px;font-size:17px;color:#d8e3df;margin:0 0 26px}
.stats{display:flex;flex-wrap:wrap;gap:12px 36px;margin-bottom:28px}
.stats div b{display:block;font:800 30px/1.1 "Noto Serif KR",serif;color:#fff}
.stats div span{font-size:13px;color:#b9cbc6}
.btn{display:inline-block;padding:11px 20px;border-radius:8px;border:0;background:var(--accent);color:#fff;font-weight:700;text-decoration:none}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.5);margin-left:8px}
section.blk{padding:48px 0 8px}
h2.sec{font-size:26px;margin:0 0 6px}
.sec-sub{color:var(--muted);margin:0 0 22px}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.ccard{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;transition:transform .15s,box-shadow .15s}
.ccard:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.ccard .top{height:8px}
.ccard .in{padding:16px 18px 18px}
.ccard h3{margin:0 0 4px;font-size:19px}
.ccard .m{font-size:13px;color:var(--muted);margin-bottom:8px}
.ccard p{margin:0;font-size:14px;color:var(--muted)}
.ccard .via{margin-top:10px;font-size:13px}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;color:#fff}
.today{display:grid;grid-template-columns:1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.today h3{font-size:24px;margin:6px 0}
.today p{color:var(--muted);margin:8px 0 14px}
.bar{display:flex;height:34px;border-radius:8px;overflow:hidden;font-size:13px;color:#fff;font-weight:700}
.bar div{display:flex;align-items:center;justify-content:center}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.legend button{border:2px solid var(--c);background:var(--c);color:#fff;padding:3px 12px;border-radius:99px;font-size:13px}
.legend button.off{background:transparent;color:var(--muted);border-color:var(--line)}
.map{height:520px;border-radius:12px;border:1px solid var(--line);z-index:0}
.nomap{padding:60px 20px;text-align:center;color:var(--muted)}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;border:2px solid #fff;transform:rotate(-45deg);box-shadow:0 1px 4px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg);color:#fff;font:700 12px/1 sans-serif}
.pin.dot::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.pop{font:13px/1.5 "Malgun Gothic",sans-serif;max-width:250px;color:#26211c}
.pop b{font-size:15px}.pop .m{color:#777;margin-bottom:4px}.pop p{margin:4px 0 8px}
.pop button{margin-right:5px}
.sbtn,.favbtn{padding:5px 12px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13px}
.sbtn:hover{border-color:var(--accent)}
.favbtn{border-color:#f08c00;color:#c26e00;font-weight:600}
.favbtn.on{background:#f08c00;color:#fff}
.sbtn:disabled{opacity:.35;cursor:default}
/* course page */
.chead{color:#fff;padding:44px 0 34px}
.chead a{color:rgba(255,255,255,.8);font-size:14px;text-decoration:none}
.chead h1{font-size:clamp(28px,5vw,44px);margin:8px 0 10px}
.chead p{max-width:680px;margin:0 0 14px;color:rgba(255,255,255,.92)}
.chead .facts{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:14px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;padding:28px 0 20px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}.cols .mapcol{order:-1;position:static!important}}
.mapcol{position:sticky;top:68px}
.mapcol .map{height:calc(100vh - 100px);min-height:380px;max-height:640px}
.stop{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;scroll-margin-top:70px}
.stop.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.stop .num{flex:none;width:34px;height:34px;border-radius:50%;color:#fff;font:700 15px/34px sans-serif;text-align:center}
.stop h3{margin:0;font-size:19px}
.stop .meta{font-size:13px;color:var(--muted);margin:2px 0 6px}
.stop p{margin:0 0 10px;font-size:14.5px}
.stop .btns{display:flex;flex-wrap:wrap;gap:6px}
.pager{display:flex;justify-content:space-between;gap:12px;padding:24px 0 48px}
.pager a{flex:1;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:10px;text-decoration:none}
.pager a small{display:block;color:var(--muted)}
.pager a.r{text-align:right}
.empty{padding:50px 20px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
/* modal */
#modal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 14px}
#modal.on{display:flex}
.sheet{background:var(--card);max-width:720px;width:100%;border-radius:14px;padding:26px 28px 28px;position:relative}
.sheet h2{margin:0 0 4px;font-size:26px}
.sheet .x{position:absolute;right:14px;top:12px;border:0;background:none;font-size:26px;color:var(--muted)}
.sheet dl{display:grid;grid-template-columns:72px 1fr;gap:3px 12px;font-size:14px;margin:14px 0}
.sheet dt{color:var(--muted)}.sheet dd{margin:0;word-break:break-word}
.sheet h4{margin:18px 0 4px;font-size:14px;color:var(--muted)}
.sheet .txt{white-space:pre-wrap;font-size:15px}
footer{margin-top:40px;background:var(--basalt);color:#b9b0a2;padding:28px 0;font-size:13px}
footer a{color:#ffc58f}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 18px;border-radius:99px;font-size:14px;z-index:3000}
</style>
</head>

<script>
const DATA=[{"id":367,"name":"세심재","lat":33.501626,"lng":126.514125,"theme":"life","cat":"민속","d1":"의식주","d2":"식생활","title":"제주의 전통음식문화를 찾아서","sub":"해당없음","author":"제주대학교 탐라문화연구소","abs":"제주의 전통음식문화를 찾아서(세미나) 일 시 : 2004. 10. 8(금) 10:00~15:00 장 소 : 세심재 주 관 : 제주대학교 탐라문화연구소","body":"제주도는 농사짓는 땅이 적어 가정의 식량은 겨우 대는 정도이고 . 밭곡식은 조. 피. 보리. 메밀. 콩. 팥. 녹두. 깨 등 잡곡이 주가 되고. 감자·고구마의 생산이 많다. 채소와 된장 해조류가 찬의 재료가 되고 바닷고기도 말려서 두고 쓰고 수육은 주로 돼지고기이고 닭을 쓰는 음식 대부분이다.(중략)쌀이 귀하므로 평소에는 보리. 조. 팥등의 잡곡밥을 많이 짓고 제삿날이나 비념에 고은밥(쌀밥)을 지어 먹는데. 쌀의 80%를 육지에서 들어와야 하는 형편에 있었다. 물론 근 30년간 외지사람의 이주로 양상이 달라지고 있다. 옛날의 식사는 잡곡밥에 된장을 푼 배추국. 콩잎국. 무국. 파국. 호박국. 미역국. 생선국을 반드시 끓이고 반찬은 자리젓. 갈치자반. 정갱이자반. 고등어자반. 건어를 쓰고 회는 생것이 손에 들어오면 먹게 되고 자리회를 먹는 것이 큰 즐거움이라 하였다.(중략) 또 점심에 먼 곳에 나가서 일하는 사람은 대로 엮은 도시락이 있어 잡곡밥을 담고 찬은 된장과 자리젓을 옆에 담고 밭에서 연한 콩잎을 따서 쌈을 싸면 일품이라고 한다. 부지런하고 소박한 성품이 음식에서도 소박하고 꾸밈이 없고 질박한 식생활이었으나 건강하고 일을 잘하기로 칭송을 받는 주민들이었다. 곡식음식은 바다 것을 넣은 죽이 사치스럽게도 맛이 있고. 메밀로 만든 만두나 수제비를 잘 만들고 미역죽. 닭죽도 잘 만든다.","ref":"김호.「오주 이규경의 신 체관 및 의학론」.한국정신문화연구원2003년원내과제연구결과보고서. 2003.이어령.「한국 음식문화의 특징」.『환경을 생각하는 음식이야기』. 과천:환경부. 2002.정구복·주영하.「고려시대 세시풍속 연구」.『한국세시풍속자료집성』외 다수","pub":"제주대학교 탐라문화연구소","date":"2004-10-08","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=367","zip":"63184","addr":"제주특별자치도 제주시 용담일동 2822-18"},{"id":427,"name":"고봉례묘","lat":33.506644,"lng":126.563633,"theme":"life","cat":"민속","d1":"통과의례","d2":"장례","title":"탐라성주 고봉례묘 추정지","sub":"화북동 분묘유적 발굴조사 보고서(제주대학교박물관 조사보고 제17집)","author":"제주시","abs":"이 분묘는 일찍부터 알려진 방형의 쌍묘이다. 쌍묘가 있는 지경을 \u0027능동산\u0027이라고 하고. 제주의 고위 계층의 무덤으로 인식되어져 왔다. 고씨세보(高氏世饍)에 기록된 내용에 보면. 좌도지관(左都知管) 고봉례의 묘가 화북·거로 지경에 부부 합장묘로 안치했다는 내용이 있어. 이 능동산에 위치한 묘가 고봉례 부부의 묘역이 아닌가 하는 의문을 가지게 되었다. 《조선왕조실록》 등 문헌기록에 의하면. 탐라의 마지막 성주인 고봉례(高鳳禮)의 서거연도가 조선 태종 11년(1411)으로 나타나 있다. 30여년 전. 현장을 답사한 고봉만씨에 의하면 이 방형의 쌍묘는 일인들에 의해 처음 도굴되었고. 그 후에도 전문적인 도굴꾼에 의해 두세 번 더 도굴된 사실을 주변 사람들의 이야기를 통해 알았다고 한다. 이처럼 수차례의 도굴 흔적은 조사과정에서 확인할 수 있었으며. 그것도 곽의 내부는 마치 벌집을 연상케하는 도굴침 흔적이 남아 있었다. 중앙에 곽이 있었던 자리는 이미 완전하게 파헤쳐져 직경 1.5m. 깊이 1.5m 이상 되는 구덩이가 만들어져 있고 이 구덩이에서 퍼올린 흙이 봉토 상면을 덮고 있는 실정이었다. 이 묘는 제주도에서는 흔치 않은 방형의 묘이고. 구전과 문헌에 전하는 마지막 성주묘에 대한 사적 내용을 확인하기 위해서라도 반드시 조사되어야 한다는 의견이 제기되었다. 이러한 분위기 속에서 중앙의 문화재위원들이 현장을 답사하게 되었고. 제주대학교박물관에 의해 조사가 이루어지게 되었다. 발굴 조사를 하게 된 목적은 해당 봉분에 대한 조사를 통해 분묘의 주인공과 그 성격을 밝혀. 그에 따른 해당 분묘의 보존 여부를 거론하고자 하는데 있었다. 발굴은 원래 9월경에 실시할 예정이었으나. 여러 가지 사정으로 인해 겨울에 시작되었다.","body":"영산 한라의 맥이 흘러든 자락에 자리한 우리들의 삶터 제주시는 오늘날 제주도의 행정 중심지일 뿐만 아니라. 탐라국 시대에도 으뜸 도시였습니다. 그러나 아쉽게도 탐라국의 실체를 뚜렷하게 찾아내지 못하고 있음은 실로 안타까운 일입니다. 그만큼 \u0027탐라사\u0027는 굴곡이 깊었다는 반증이기도 합니다. 지금 우리가 살고 있는 지방화 시대는 우리들의 일을 우리들 스스로 해야 하는 시대입니다. 이는 우리들 역사에서도 마찬가지입니다. 탐라사는 곧 하나의 \u0027지방사\u0027라는 수동적인 \u0027사관\u0027에서 벗어나. 주체적으로 \u0027탐라사\u0027를 세워나가야 함은 우리들 앞에 놓인 엄숙한 과제이기도 합니다. 주체적으로 \u0027탐라사\u0027를 세우는 일은 여러 가지가 있겠습니다만. 탐라국사의 상징적 존재인 \u0027성주\u0027의 실체를 우선 실증적으로 찾아내야 할 것입니다. 성주의 실체가 상실된 것은 1404년(조선 태종 4) 성주 . 왕자직이 없어지면서부터이며. 이와 동시에 탐라국도 소멸되었습니다. 따라서 주체적인 탐라사 정립을 위해서는 우선 구전으로 전해 내려오던 거로 마을의 \u0027능동산\u0027에 있는 탐라 마지막 성주인 고봉례의 묘를 발굴. 조사하는 일입니다. 이는 다름 아닌 \u0027탐라사\u0027의 기둥을 세우는 일이기 때문입니다. 우리 시에서는 제주대학교 박물관에 발굴 조사를 의뢰하여. 그 결과 분묘의 성격. 축조 방법. 축조 시기. 출토 유물 등을 들춰내 「탐라성주 고봉례묘추정지」라는 이름으로 학계에 내놓을 수가 있었습니다. 부디 이 조사보고서가 굽어진 탐라사를 올곧게 세우는데 자그마한 보탬이 된다면 더 이상의 바람이 없겠습니다.","ref":"해당없음","pub":"제주시","date":"1997-04-30","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=427","zip":"63304","addr":"제주특별자치도 제주시 화북 2동 4301번지"},{"id":428,"name":"용담동 고분유적","lat":33.501738,"lng":126.509924,"theme":"life","cat":"민속","d1":"통과의례","d2":"장례","title":"용담동 옹관묘 발굴보고","sub":"해당없음","author":"제주시/제주대학교박물관","abs":"이번에 발굴된 용담동 무덤의 유적은 기원 전후의 제주도 역사 여명기에 있었던 문화변천의 모습을 밝히는 데 있어서 매우 중요하다. 탐라 상고시대에 공렬토기를 사용하는 무문토기 문화집단으로부터 중국 한대 철기를 사용하는 곽지식 토기문화 집단으로의 이행이 이루어졌다는 것을 밝혀 주었음은 물론이거니와. 그 이행 혹은 변동의 원인과 과정을 밝히는 데. 더 없이 중요한 자료를 제공하여 주고 있다. 그뿐만 아니라 제주도에서의 초기 금속기문화의 실상을 밝혀주는 풍부한 철제 유물이 출토됨으로써. 제주도는 물론 우리나라 전체의 원사시대 철기문화의 전개과정을 밝혀주는데 큰 보탬이 되고 있다. 이처럼 제주도사 여명기를 밝혀주는 중요한 유적인데도 불구하고. 충분한 여건이 마련되지 않은 채 긴급 구제 발굴되고. 서둘러 마쳐질 수밖에 없었음에 아쉬움이 남는다.","body":"금번 보고서로 내는 제주시 용담동 고분 유적은 기원 전후한 제주 역사 여명기를 밝혀주는 중요한 유적입니다. 이 유적의 조사를 통해서 고대 탐라국의 형성기에 어떠한 문화적 변동이 있었는가에 대해서 완전히 새로운 사실들을 알 수가 있었습니다. 비록 장기적인 조사 계획에 바탕을 두고. 충분한 여건이 주어진 가운데 발굴조사가 이루 어진 것은 아닙니다만. 자칫 세상에 알려지지 않은 채. 영원히 파괴되었을지도 모를 이 중요한 유적이 지역주민의 투철한 문화재 의식으로 그나마 조사된 것은 정말 다행한 일입니다. 아무쪼록 이 유적과 같은 긴급구제발굴조사가. 근래에 들어 개발을 급하게 서두르고 있는 제주도에서 하나의 시금석이 되기를 바랍니다. 그리고. 이번의 발굴조사 보고서가 제주도 탐라 상고사의 연구뿐만 아니라. 한국 전체 상고사 연구에 잘 활용이 되기를 바랍니다.","ref":"보존사학연구외 다수","pub":"제주시","date":"1989-12-13","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=428","zip":"63162","addr":"제주특별자치도 제주시 용담이동 2696-2외 20필지"},{"id":433,"name":"하원리 분묘군","lat":33.277524,"lng":126.470685,"theme":"life","cat":"민속","d1":"통과의례","d2":"장례","title":"제주 하원동 분묘군","sub":"해당없음","author":"고창석/강창화/김동전","abs":"동 하원리 소재 분묘군은 해발 225m의 능선상에 3단 구성으로 이루어진 묘역 안에 판석형 혹은 할석형 석곽을 둔 계단식 방대형 석곽분이다. 직경 84m 안에 동일한 형태의 석곽묘가 나란히 배치되어 있다. 분명 누대에 걸쳐 조영된 분묘군이다. 더불어 석곽 주변으로 둘린 돌담 형태의 곡장은 지금까지는 확인된 묘역 중 분명 제주도 최고의 묘역이다. 이러한 할석형 · 판석형 방형석곽묘는 고려 후기에서 조선 초기에 이르기까지 일반적인 무덤양식으로 쓰였던 것으로 추정되는 바. 원묘 이전의 제주도 분묘 양식을 파악할 수 있는 매우 귀중한 자료라고 할 수 있다. 현재 제주도 내에 있는 방형석곽묘는 동 하원동분묘군 외에 화북동 거로마을의 탐라의 마지막 성주 고봉례의 무덤으로 추정되는 분묘. 청주한씨 입도주 분묘. 김해김씨 선흘리 소재 분묘 등 그렇게 많지는 않은 실정이다. 특히 화북동 분묘는 부부묘역으로 쌍분으로 구성되어 있었고 그 축조방법과 장법이 하원동 분묘군과 동일하였으며 우물도 조선초기의 백자가 출토된 바 있다. 이러한 조사 자료는 하원동 분묘군과 상호 비교연구가 가능하다. 따라서 이들 분묘는 고려말-조선초의 방묘의 축조양식. 묘제형태. 이장방법 등의 해명을 위해서 매우 중요한 자료라 할 것이다. 결국 이들 분묘는 제주도의 묘제변천사에 중요한 단서가 된다 할 것이다. 어쩌면 이들 분묘들은 얼마 없어 모두 사라져 버릴지도 모른다. 그러므로 이들 분묘를 일괄적으로 \u0027제주도의 방형분\u0027 이라는 명칭으로라도 제주도 문화재로 지정하여. 한 가문만의 무덤이 아니라. 제주도 문화유산의 하나라는 인식을 확산시킬 필요가 있다. 더구나 제주도 문화유산의 하나인 무덤은 매우 독특한 것으로 이해되고 있다. 미래를 예단할 수는 없지만. 매장 방법 및 풍속은 급속도로 변화할 처지에 놓여 있는 것이 현실이다. 이런 의미에서 제주 내에 산재해 있는 방묘를 제주도 지정문화재로 지정하는 문제를 적극적으로 검토해 줄 것을 제의한다.","body":"　하원동 분묘군은 일찍부터 \u0027왕자묘(王子基)\u0027 라는 이름으로 세간에 알려져 있었다. 이 묘는 1914년(대정3)에 일본인들에 의해 묘가 도굴된 바 있어 더더욱 주목되어왔다. 이 묘는 탐라국의 왕자(王子)와 관련된 왕자묘라는 주장과 원나라 백백태자(伯伯太子)의 묘일 가능성이 있다는 두 설이 있다. 이원조 제주목사(1842~45)가 지은 『탐라지초본』 대정현 \u0027고적\u0027 에 따르면 \"왕자묘는 대정현 동쪽 45리에 있다. 궁산 옆 두 하천 사이에 3기묘의 계천이 아직도 남아있다. 두 모퉁이에는 백작약들이 자라고 있다. 가래촌에는 또한 궁궐 유적으로 보이는 초석들이 남아 있는데 이곳이 탐라의 도읍처가 아닌가 의심된다. 전해 오는 바에 의하면 산방을 이도라고도 하였다.(王子墓在縣東四十五里弓山兩川之間 三墓階喘尙在兩隅有白灼藥 加來村裏 又有宮闕遺礎 疑是旱羅都處 俗傅山房爲第二徒云)\" 이 묘가 두 하천 사이에 자리하고 있고. 3기묘의 묘역이 남아있다는 기록은 현재에 현황과 일치한다. 본 조사는 이러한 여러 가지 설을 입증하고 일제시대 도굴된 묘의 성격을 재 규명하기 위해 조사에 착수하였다. 조사 목적은 문헌과 구전을 통해 알려진 동 묘제를 발굴하여 탐라말기 지배층 묘제양식과 그 성격을 규명하고. 나아가 밝혀 질 이들 묘제의 양식과 성격 파악을 통해 탐라국 말기의 사회상을 복원하여 인문·관광자원으로 활용하고자 하는데 있었다.","ref":"문경현.「탐라국 성주·왕자고」.『용암거문섭교수 화갑기념 사학론총』.신서원.1989.p.261./김석익『심재집』(영인.도서출판제주문화.1990)/문경현.『탐라기년』.권2.태종2년.외 다수","pub":"제주사정립사업추진위원회","date":"2000-03-10","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=433","zip":"63553","addr":"제주특별자치도 서귀포시 하원동 21"},{"id":447,"name":"예래동 고인돌군","lat":33.254677,"lng":126.390212,"theme":"life","cat":"민속","d1":"의식주","d2":"해당없음","title":"예래동 고인돌군 · 영천관지 · 법정사지","sub":"서귀포시 비지정 문화재 지정 · 보호를 위한 학술조사","author":"서귀포시/제주문화예술재단 문화재연구소","abs":"예래동 고인돌은 6기의 고인돌이 능선을 따라 해안으로 내려오면서 일직선상에 배치되어 있음이 확인되었다. 지금까지 제주도 고인돌은 단독으로 존재하는 것으로 파악되어 왔으나 이곳 예래동 고인돌은 직겨 10m 이내에 3기가 군집해 있음이 확인된다. 더불어 고인돌이 자리한 지형은 능선 정상부에 위치하고 있다. 특히 6호 고인돌인 경우 한라산 남쪽지역에서 발견된 바 없는 성혈(性穴. cup mark)이 20여 개 이상 확인된다. 수년전만 해도 상예동 일대에 11기의 고인돌군 보다 단위 면적당 높은 군집 양상을 보인다. 더구나 남아있는 6기의 고인돌이 각기 다른 형식을 취하고 있어 제주도 지방 고인돌 연구에 중요한 연구자료를 제시하고 있다. 게다가 주변 유물산포지를 끼고 고인돌이 분포하고 있어 생활공간과 무덤공간. 제의공간의 비교연구에도 기여도가 높을 것으로 판단된다. 따라서 이들 고인돌을 보존하기 위해서는 6기의 고인돌 전체를 시급히 문화재로 지정하는 작업이 선행되어져야 할 것이다.","body":"이 조사의 목적은 서귀포시 비지정 향토 유형 문화유산 중 제주도 지정문화재로 지정할 만한 가치가 있는 예래동 고인돌군. 영천관지. 법정사지에 대한 정밀조사를 실시하여 문화재 지정에 필요한 근거자료와 역사성을 파악하는데 있다. 유물산포지를 통해서 확인될 수 있는 것은 사람이 살던 생활터의 입지적 조건이다. 그리고 각 유물산포지 단위의 범위와 밀집도가 거주 양식과 기간과도 관계가 되겠지만. 인구 규모와도 정비례의 상관관계가 있다고도 생각이 되므로. 개략적으로 마을의 크고 작음을 구분하여 그 분포를 살필 수가 있다. 탐라시대 전기에는 앞선 단계보다 훨씬 많은 유물 산포지 유적이 확인된다. 무문토기 시기에는 불과 10개 지점 미만이 확인되었는데 비해 이 시기에 오면 수십여 개 지점에 이른다. 그리고 곽지리나 광령리 등 단위 유적 하나가 직경이 수백 미터 이상 되는 규모의 것도 있다. 따라서 많은 인력이 동원되어야 하는 고인돌 유적을 구태여 들지 않더라도 이 시기에 이러한 정도의 유적 상황만으로도 제주도 곳곳에 모양을 갖춘 마을이 들어섰음이 어렵지 않게 추정될 수 있다.","ref":"해당없음","pub":"서귀포시/제주문화예술재단 문화재연구소","date":"2002-05-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=447","zip":"63537","addr":"제주특별자치도 서귀포시 상예동 1514"},{"id":452,"name":"식산봉","lat":33.465678,"lng":126.919965,"theme":"oreum","cat":"민속","d1":"기타","d2":"해당없음","title":"식산봉 생태학술조사 보고서","sub":"해당없음","author":"남제주군/제주대학교","abs":"식산봉(食山峰)은 오름의 정상부에 큰 바위가 있다하여 바우오름. 바위오름 또는 바오름으로도 불려왓으며. 성산포항과 오조리 양식장 사이에 설치된 갑문 가까이에 있다. 오름은 화산암재. 화산사. 화산탄. 화산력 화산암 등으로 이루어진 원추형 화산체이며 봉우리 주변에는 장군석이라 부르는 커다란 바위가 있다. 오름의 서측은 농경지와 인접되어 있고. 동측은 오름과 양어장과의 사이에 인도가 개설되어 있으며. 오름 동측으로는 정상으로 이어지는 좁은 산책로가 개설되어 있다. 현존하는 식생은 해송이 우점하며. 일부 지역은 상록활엽수림으로 천이가 진행되고 있으나 과거에 식재한 것으로 추정되는 왕대가 넓은 면적으로 확산되고 있다. 오름의 동측 도로와의 경계면을 따라서는 법정보호식물인 황근이 산발적으로 분포하고 있다.","body":"제주도 기념물 제47호 식산보의 황근자생지 및 상록활엽수림으로 지정되어 보호되고 있는 식산봉 일원에 대하여 유관속식물상. 현존식생과 군락구조 및 현존식생의 분포 등을 조사하고. 자연환경보전법에 의하여 보호되고 있는 황근의 분포 및 생육상황을 조사하여 건전한 식생의 유지를 위한 장기적인 관리방안을 수립하는데 본 조사의 목적이 있다. 식물상의 조사는 조사지를 답사하면서 출현하는 유관속식물을 동정하여 식물상 목록을 이(1989)에 의하여 작성하였다. 식생조사는 식물사회학적인 방법(Braun-Blanquet. 1964)에 의하였으며. 조사지의 입지는 해발고. 미지형. 사면방위. 경사도 등을 기록하였다. 조사지내의 전 출현종에 대하여 계층별로 기록하고. 각 층에 출현하는 종의 우점도와 군도를 기록하였다.","ref":"강수헌. 1996. 제주의 오름. 대신사. 522 pp. / 김무열. 2004. 한국의 특산식물. 솔과학. 408 pp. / 남제주군. 2003. 남제주군의 희귀식물. 진애드. pp. 75~79. 외 9권","pub":"남제주군","date":"2004-12-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=452","zip":"63639","addr":"제주특별자치도 서귀포시 성산읍 오조리 318-4"},{"id":489,"name":"법환 잠녀 문화마을","lat":33.235212,"lng":126.514523,"theme":"sea","cat":"민속","d1":"의식주","d2":"해당없음","title":"법환동 「문화 · 역사마을 가꾸기」 마을 현황 조사 및 기본계획","sub":"해당없음","author":"문화 · 역사마을 가꾸기 서귀포시 추진위원회","abs":"· 법환 잠녀 문화마을은 최영장군 전적지. 해녀 생활문화. 신당 유적(신당 등) 등 마을만이 가지고 있는 자연 및 특성을 최대한 활용하여 방문객에게 찾아오고 싶은 테마형 어촌마을 조성 · 주민들의 삶의 질 향상을 위해 주거환경 및 마을 기반시설 정비 및 소득확대를 통해 마을 주민의 자립기반을 구축하고 생활의 질 향상 · 해녀 생활문화자원을 개발의 자원으로 활용하여 환경 친화적이고 저비용으로 여가를 즐길 수 있는 시설을 개발하여 아름다운 어촌 테마마을로 조성","body":"· 법환 잠녀 문화마을은 1.500년 전부터 사람이 살기 시작한 마을로서 이 마을앞에 자리잡고 있는 범섬은 고려시대 최영장군이 목호들을 토벌하던 전적지임 · 문화유적으로는 신앙유적인 신당. 생활유적인 물 · 멜통 · 바다밭 · 김치통 · 카름물 등을 가지고 있으며. 제주도의 가장 오래된 생활문화의 하나라고 할 수 있는 해녀작업이 오늘날까지도 왕성하게 행해지는 지역임 · 법환 잠녀 문화마울이 가지는 자원들의 장단점 분석을 통해 쾌적한 자연 및 생태공간·전통문화 등 어촌의 강점을 최대한 살린 법환 잠녀 문화마을 발전계획을 수립하여 도시민에게는 건전한 여가선용공간과 주민들에게는 소득증대와 삶의 질 향상. 전통과 문화가 보존되어 후세에게 귀중한 유산을 물려줄 수 있는 마을을 조성함","ref":"해당없음","pub":"서귀포문화원","date":"2006-01-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=489","zip":"63573","addr":"제주특별자치도 서귀포시 법환동 208-4 법환어촌체험마을"},{"id":491,"name":"종달리패총","lat":33.494381,"lng":126.893463,"theme":"life","cat":"민속","d1":"의식주","d2":"해당없음","title":"제주종달리패총","sub":"제주대학교박물관조사보고 제21집 종달리패총 1지구 발굴조사보고서","author":"북제주군/제주대학교박물관","abs":"종달리 일대의 지표조사를 통해 유물산포지를 중심으로 3개소의 패총구역을 확인할 수 있었다. 종달리 1707번지. 1131번지. 1125번지는 패총구역이고. 그 주변으로는 유물물산포지가 확인되어 제주 동북부 지방에서는 가장 넓은 초기절기시대·원삼국시대(탐라전기)의 생활공간으로 여겨진다. 이번에 발굴한 종달리 1707번지 내 패총은 이미 전복된 패총유구의 수습조사였다. 점토대토기. 삼각형철촉. 곽지패총에서 발견되는 탐라전기의 경질무문토기(곽지1식토기)와는 다른 기형의 토기. 마연토기 등 육지산 토기가 발견됨으로서 한반도 남부지방과의 교류일면을 제시하였다. 남아있는 패총유구에 대한 조사를 통해 두 번에 걸친 문화층을 확인할 수 있었다. 이 유적에서 출토된 토기들은 제주도 전체의 토기연구에 있어 앞으로 중요한 자료로 제시될 것으로 여겨지는 바. 곽지1식토기 보다 선행하는 단계의 제주도 경질무문토기의 한 유형으로 파악된다. 또한 이곳에서 출토되는 점토대토기는 한반도 삼각형점토대토기의 하한년대를 잡아줄 수 있는 유적으로 파악된다. 차후 이러한 자료가 더욱 모아지기 위해서는 이 유적에 대한 정확한 조사가 있어야 할 것이다.","body":"이 보고서는 제주 종달리패총 제1지구 발굴조사 결과를 요약 · 정리한 것이다. 행정구역상의 조사지 위치는 북제주군 구좌읍 종달리 1707번지이다. 1991년 9월. 북제주군은 종달리 지미봉 해안을 돌아가는 해안 일주도로를 건설하면서 패총부분을 파괴하게 되었다. 따라서 이 조사는 이미 뒤집어 진 패각층과 남아있는 패총을 조사하는 긴급한 수습발굴조사 차원에서 진행되었다. 비록 패총이 파괴되었다 하더라도 그동안 제주 동북부지역에서 선사유적이 확인된 바 없었던 터라. 그나마 다행스러운 일이었다. 우선 지표조사를 통해 유물 산포지를 중심으로 3개소의 패총구역을 확인할 수 있었다. 특히. 패총과 유물산포지에서 제주도에서는 그동안 출토가 거의 되지 않았던 점토대토기가 분포하고 있음을 확인할 수 있었다. 확인된 유적의 범위는 동서 700m. 남북 250m로. 지미봉을 축으로 길게 장타원형을 이루었다. 그후 이 유적에서 10km남짓 떨어진 김녕리 \u0027궤내기\u0027 동굴입구집자리에서 단면 원형 · 삼각형 점토대토기가 출토되었고. 유적 바로 인근에 자리한 종달1리 포구에서 말기형태의 주형동검이 수습되었다. 이러한 흐름은 공렬토기가 출토되는 다른 제주 지역과 구별되는. 제주 동북부지역의 선사문화의 성격을 규명하는데 좋은 자료를 제공해 주었다. 현장조사는 다음과 같이 팀을 구성하여 발굴을 하였다. 조사단장에는 당시 제주대학교박물관장이었던 강통원 교수. 조사책임자에 이청규(당시 제주대 교수. 현재 영남대 교수). 조사원에 고광민(제주대박물관 학예연구사) · 강창화(제주대박물관 학예연구원) · 강창언(제주대박물관 학예연구원). 조사보조원에 오연숙(현재 한양대 대학원생) · 강성호 · 박완종 · 이병계 · 강경의 · 김미성 · 강선희(당시 제주대 사학과 학생)가 수고하였다. 발굴 행정은 박경홍(제주대박물관)이 맡아 진행하였다. 보고서 작성은 다음과 같이 이루어졌다. 도면 실측과 유물 촬영은 김경주 · 오연숙이 하였고 현장사진 촬영과 패총 단면 실측은 강창화가 하였다. 도면 작성은 오연숙 · 박근태 · 김정선이 하였다. 본문의 모든 원고는 강창화가 작성하였고. 최종적으로 이청규 교수가 수정 · 보완하였다. 보고서 말미에 부록으로 제시한 \u0027종달리 유적에서 출토된 동물뼈의 분류\u0027 는 신태균 교수(제주대 수의학과)와 김성균 · 권성회 · 박호열(제주대 수의학과 학생)이 도움을 주었다.","ref":"강면희. 한국재래마에 관한 역사적 및 형태학적 연구. 한국축산학회지 1969.11:26~80. / 제주대학교박물관. 종달리 패총. 제주대학교 박물관조사보고 제21집. / 이기만. 제주도마 체형에 관한 생물측정학적 연구. 학축지 1961:63-73 외 21권","pub":"북제주군","date":"1997-12-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=491","zip":"63364","addr":"제주특별자치도 제주시 구좌읍 종달리 1838-3"},{"id":519,"name":"하논","lat":33.252969,"lng":126.545738,"theme":"eco","cat":"민속","d1":"의식주","d2":"해당없음","title":"우리고장 바로알기","sub":"해당없음","author":"서귀포문화원","abs":"도내 사찰중에서 규모가 가장 컷을 것으로 짐작되는 법화사지 서귀포시 하원동 1071번지에 있다. 1982년 명지대학교 박물관에 의해 1차 발굴을 시작으로 지금까지 6차에 걸쳐 발굴된 법화사지는 지금도 계속되고 있다. 이렇게 연중사업으로 계속되는 법화사지에는 무엇이 발굴되었고. 어떻게 보존되어 질것인가는 행정의 노력도 필요하지만. 삼보를 수호하겠다는 승도들의 결연한 의지가 필요하다고 본다. 명상대찰이라 하여 물이 있는 곳에는 마을이 이뤄지듯. 산이 깊고 아늑한 곳에는 반드시 범종소리가 울려 나온다. 법화사도 그 중 하나이다. 그러면 왜 많은 사찰 이름 중에서 하필이면 법화사라고 했을까 . 그리고 법화사는 처음에 건립되면서 부터도 사찰 명칭이 법화사였을까 여러 가지의 의문이 남는다. 그러나 여기에서 중요한 것은 법화(法華)라는 것이다. 법화라는 어원은 부처님의 최후 설법이라 일컬어지는 묘법연화경(妙法蓮華經)에서 비롯된다. 이 묘법연화경을 법화경(法華經)이라고도 하는데. 이로 인해 수나라 때는 천태대사(538년)에 의해 법화종 즉 천태종이 시작되었다. 고려시대에도 의천대각국사(1101년)에 이르러서는 법화경의 교리를 근본으로 천태종의 체계를 갖추게 된다. 이렇듯 법화경은 부처님이 처음 설법하셨다는 화엄경(華嚴經)과 더불어 불교의 대승사상을 대표하는 최상의 경전으로 평가되고 있다.","body":"서귀포 바다의 아름다움은 범섬에서 부터 시작된다. 범섬이 숲섬. 새섬. 문섬 다음으로 크면서도 가장 크고 웅대하게 느껴지는 이유는. 모습 그대로 범이 포효하는 듯 한 섬의 웅장함에 있기 때문일 것이다. 이는 지금 우리만의 느끼는 감정이 아니다. 여느 고지도에 보더라도 서귀포 바다의 다른 섬에 비해 범섬이 크게 표기된 것으로 보아. 옛 선인들께서도 같은 감흥으로 섬을 지켜본 듯하다. 전설 속에 범섬의 탄생은. 오랜 옛날 사냥꾼이 실수로부터 시작된다. 사냥 나갔던 사냥꾼이 잘못하여 옥황상제의 배를 건드리니. 상제가 크게 노하여 한라산 봉우리를 뽑아 던진 것이 제주의 섬들이 생겨나게 된 원인이 되었다고 전한다. 또한 제주섬의 수호신 설문대 할망 전설이 이 섬에도 남아 있다. 설문대 할망이 얼마나 크셨는지 잠을 잘 때는 백록담을 베개로 삼아 누우면 고근산이 허리가 되었고. 할머니가 뻗은 발은 범섬에 닿았다고 한다. 아울러 범섬은 그 모습이 호랑이처럼 생겼다 하여 범섬이라 불렸다 하며. 지난날 이곳에 사람이 살 때에도 범의 형세이기 때문에 고양이는 기르지 못했었다고 전한다. 범섬은 서귀포시 법환동 산 1.2.3번지로서 지목 임야. 대지. 면적 84298 평방미터이며. 사유지이다.","ref":"해당없음","pub":"서귀포문화원","date":"1999-12-28","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=519","zip":"63570","addr":"제주특별자치도 서귀포시 서홍동 1003"},{"id":521,"name":"가시오름","lat":33.24703,"lng":126.24332,"theme":"oreum","cat":"민속","d1":"신화/전설","d2":"제주신화.전설","title":"제주도전설지","sub":"해당없음","author":"제주도","abs":"수록된 전설은 1983년도에 수집된 것으로서 제보자의 언어 그대로 채집된 것이나. 독해의 편의를 위하여 표준어 문장으로 바꾸어 기술하였다. 전설의 수록순서는 한라산전설. 제주시전설. 서귀포시전설. 북제주군전설. 남제주군전설 순으로 지역별 배열을 하고 각 군의 전설은 다시 읍 · 면별로 나누었으며. 전설의 분류는 자연전설. 역사전설. 신앙전설 순으로 배열하였다. 같은 소재의 전설이 다른 제보자에게서 여러 편이 수집된 경우. 번호를 붙여 연속 수록하였고. 각 편마다 소재지. 제보자의 성명. 성별. 나이 등을 기록하였다.","body":"정기어린 한라산이 사면의 바다와 조화를 이루어. 풍광이 빼어나고 인심이 곱고 풍속이 보배로운 제주는. 바야흐로 온 겨레의 가슴속에 살아 숨쉬는 마음의 고향이 되어. 세계 속에 찬연히 빛나는 매혹의 섬으로 각광을 받고 있습니다. 일찍이. 이처럼 거룩한 터전에 삶의 보금자리를 마련하고 살아온 제주 사람들은. 돌 많고 거친 바람의 고난을 이겨내면서. 아름다운 삼무의 전통을 꽃 피우고 수많은 전설들을 빚어내며 신화 어린 긴 역사를 영위해 왔습니다. 지금도 제주도에서는. 한라산에서부터 마을에 이르기까지 어디를 가나 「전설의 섬」이라고 부를 만큼 풍부한 설화들이 살아 숨 쉬면서 신비로움을 더하고 있습니다. 그러기에. 이러한 전설 속에는 제주만이 지닌 풍토적 조건과 그 위에 흘러간 역사를 엮어온 제주인들의 꿈이 깃들어 있으며. 우리는 이를 통해 선인들의 이상과 세계관과 생활의 양식을 읽어낼 수 있는 것입니다. 따라서. 우리 도에서는 도내 곳곳에 숨겨진 전설들을 캐어 내고 구슬처럼 꿰매어 이 고장 기층문화의 원류를 보존하고 후대에까지 전승시킴과 아울러 신비로운 제주의 참모습을 내외에 널리 선양하기 위해 이번에 이 「제주도 전설지」를 펴내게 되었습니다. 아무쪼록. 이 책자가 제주인들이 향유했던 정신세계를 탐구하고 나아가서는 빛나는 내일을 엮어 가는 정신적 밑거름을 창출하는데 활용되기를 기대하면서. 이 책을 발간하는데 애써 주신 조사위원을 비롯한 관계자들에게 심심한 사의를 표합니다.","ref":"해당없음","pub":"제주도","date":"1985-06-28","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=521","zip":"63505","addr":"제주특별자치도 서귀포시 대정읍 동일리 1706"},{"id":525,"name":"자구내 도대불","lat":33.309483,"lng":126.164381,"theme":"sea","cat":"민속","d1":"생산기술","d2":"어로기술","title":"자구내 도대불","sub":"해당없음","author":"제주특별자치도","abs":"\u0027돛대불\u0027이라고도하며 근대식 등대가 세워지기전까지 사용되던것으로 돌이나 나무 혹은 쇠로 만들어진 등대이다.","body":"돛대불\u0027이라고도 하며 근대식 등대가 세워지기 전까지 사용되던 것으로 돌이나 나무 혹은 쇠로 만들어진 등대이다. 조업을 나간 배가 포구의 도대불을 보고 무사히 다시 돌아올 수 있게 하기 위함으로 마을의 어부들이 뱃일을 나가기 전에 불을 붙이고 귀항 시 불을 껐다고 한다. 횃불을 사용하거나 생선의 기름 또는 송진을 사용하였으나 근대에 들어서는 석유나 전기를 사용하였다. 자구내 포구의 도대불은 현무암을 벽돌모양으로 만들어 하나씩 쌓아가며 사다리꼴 형태로 만들었다. 오늘날은 사용하지 않고 있다.","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=525","zip":"63008","addr":"제주특별자치도 제주시 한경면 고산리 3616-18"},{"id":526,"name":"법환포구","lat":33.237225,"lng":126.515758,"theme":"sea","cat":"민속","d1":"생산기술","d2":"어로기술","title":"법환배염줄이포구","sub":"해당없음","author":"제주특별자치도","abs":"배를 엮어 범섬까지 연이어 다리를 만들었던 곳으로 엮여진 배의 모습을 본따 지명을 배염줄이라고 하였다.","body":"고려시대 묵호의 난이 일어나자 최영장군은 법환동 범섬으로 도망간 묵호들을 섬멸하기 위해 나무로 배를 엮어 범섬까지 연이어 다리를 만들었던 곳이다. 엮여진 배의 모습을 본따 지명을 배염줄이라고 하였다.","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=526","zip":"63573","addr":"제주특별자치도 서귀포시 막숙포로37번길 2"},{"id":538,"name":"베릿내 오름","lat":33.247143,"lng":126.421961,"theme":"oreum","cat":"민속","d1":"의식주","d2":"해당없음","title":"제주 중문 베릿내 유적","sub":"해당없음","author":"한국관광공사/제주국제컨벤션센터/제주도민속자연사박물관","abs":"이번 발굴조사에서 확인된 유물포함층은 빈약하고. 유구는 원형의 수혈유구와 구상유구가 확인 되었다. 확인된 유구는 대부분 자연적. 인위적인 훼손이 가해졌음을 알 수 있었다. 그러나 주변유적들을 살펴 볼 때 조사지역 주변. 즉 예래동에서 대포동에 이르는 해안 저지대에 바위그늘집자리. 고인돌. 유물 산포지 등 많은 유적이 산재하고 있고. 유적의 입지상 하천과 해안이 가까이 자리잡고 있어 식수 및 식량자원 획득에 매우 유리한 입지조건을 갖추고 있다. 따라서 이 일대가 과거 탐라시대에 생활 거점이 되었음은 분명한 것으로 보인다.","body":"조사지역은 서귀포시 중문동에 위치한 중문관광단지 동부(2단계)지역에 해당되는데. 관광단지 조성 이전에 1996년 제주대학교박물관에서 한국관광공사의 의뢰를 받아 지표조사를 실시한 바 있다. 이전에도 지표조사를 통해 조사지역 주변에 여러지점의 유물산포지 및 바위그늘집자리. 동굴입구집자리가 산재하고 있음이 알려져 있었다. 지표조사 결과 지표조사 기관인 제주대학교박물관에서는 유물이 산재해 있는 경작지 3필지에 대한 발굴조사의 필요성을 제기한 바. 관광단지 조성기관인 한국관광공사가 우리박물관으로 발굴조사를 의뢰하게 되었다. 발굴조사지역은 서귀포시 중문동 2673-1. 2675-1. 2675번지에 해당된다. 이 지역은 제주국제컨벤션센터가 자리 잡을 부지로 알려진 곳이기도 하다. 우리박물관에서는 사업의 타당성을 검토한바 학술적 기초자료를 확보하고. 매장문화재의 부존여부 및 보존에 대한 의견을 제시하기 위하여 조사를 계획하게 되었다. 학술용역계약은 우리박물관과 한국관광공사. (주)제주국제컨벤션센터와 체결하여 발굴조사를 실시하게 되었다. 조사결과. 수혈유구 3기. 구상유구 1기가 확인되었다. 그러나 자연적. 인위적 훼손이 심한 것으로 확인되었다.","ref":"제주대 박물관\u003c1985\u003e. 제주도유적. 제주대 박물관 조사보고2 외 다수","pub":"한국관광공사/제주국제컨벤션센터/제주도민속자연사박물관","date":"1999-12-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=538","zip":"63546","addr":"제주특별자치도 서귀포시 중문동 2314-2"},{"id":541,"name":"입산봉","lat":33.548239,"lng":126.753786,"theme":"oreum","cat":"민속","d1":"의식주","d2":"해당없음","title":"제주 김녕리 유적","sub":"해당없음","author":"제주도민속자연사박물관/건설교통부 제주개발건설사무소","abs":"이번 발굴조사에서 발견된 신석기시대 유물은 비교적 소량이지만 제주도 신석기시대 초기문화를 설명하는데 있어 고산리유적과 함께 귀중한 자료로 평가된다. 특히 석기는 석기제작수법에 있어 후기구석기 전통인 가압기법에 의한 2차가공의 소형타제석기가 주류를 이루고 석기구성면에서도 석촉을 중심으로 한 첨기형석기들이 다수를 차지한다. 토기는 토기제작시 가는 풀과 같은 유기물을 혼합하여 만든 소위 고산리식토기의 존재는 앞으로 신석기시대초기문화를 연구하는데 기초자료로 활용할 만 한 자료들이다. 이러한 유물의 구성은 한반도내의 신석기시대 유적에서는 찾아보기 힘들며. 반면 일본. 러시아의 연해주 지역의 유적들과 비교할 수 있는 것으로 보인다. 앞으로 이에 대한 기초자료들이 축적될 때 제주도뿐만 아니라 우리나라 신석기시대의 초기 문화를 이해하는데 도움이 될 것으로 평가된다. 아울러 유물의 분석. 화산재에 대한 연구 등 자연과학의 연구와 같은 다방면의 연구가 진행되리라 기대된다.","body":"제주도는 우리나라 남해안 최대의 섬으로 문화적인 특징이 다른 지방과 구별되는 독특한 지역이다. 제주의 선사문화 연구는 1970년대이래 고고학 조사를 바탕으로. 구석기시대에서 탐라시대까지 대체적인 윤곽을 잡는 단계에 이르렀다. 김녕리 지역에 대한 고고학적 조사는 우리 박물관에서 1991년부터 3년 동안 동김녕리 궤내기 동굴유적 발굴조사를 실시한 바 있으며. 이를 통해 이 지역이 이미 선사시대 이래 주민이 생활근거를 마련하였음을 확인하게 되었다. 이번에 발굴된 유적은 구좌읍 동 김녕리 입산봉 일대이다. 이곳은 제주일주도로 국도 12번에 대한 4차선 확장공사구간으로 제주-함덕 구간인 북제주군 구좌읍 김녕리 우회도로 포장공사구간 내 시굴조사를 통해 알려지게 되었다. 시굴조사를 마무리 할 무렵 도로예정구간에서 토사가 파헤쳐진 지점에서 신석기시대 타제석기와 원시무문토기 등이 출토되어 이 지점에 대한 본격적인 발굴조사로 이어졌다. 이러한 유적은 우리나라에서는 극히 드문 유적으로 제주도 고산리 유적이 알려져 있을 뿐이며. 신석기시대 초기유적에 해당되는 것으로 알려져 있다.","ref":"제주대학교박물관. 1988. \u003c북촌리유적\u003e/임효재.1995","pub":"제주민속자연사박물관","date":"1999-02-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=541","zip":"63357","addr":"제주특별자치도 제주시 구좌읍 김녕리 2121"},{"id":576,"name":"화천사","lat":33.506904,"lng":126.6102,"theme":"faith","cat":"민속","d1":"무속","d2":"신당","title":"석불","sub":"해당없음","author":"제주특별자치도","abs":"이 석불은 화천사가 창건되기 전부터 마을 미륵으로 모셔졌으며. 이 곳에서 치성을 드리면 득남의 효험이 있다하여 마을 사람들이 기자불공을 올렸던 곳이라고 한다.","body":"석불의 여러가지 모습이다. 이 석불은 화천사가 창건되기 전부터 마을 미륵으로 모셔졌으며. 이 곳에서 치성을 드리면 득남의 효험이 있다하여 마을 사람들이 기자불공을 올렸던 곳이라고 한다. 자연석에 표현된 석불의 얼굴 형태는 모두 다르면서 자연스런 형상을 띠고 있다. \u003c발췌 : 제주도 무속신앙 대상 돌(石)의 이미지를 응용한 도자조형 연구 P34 2002년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=576","zip":"63329","addr":"제주특별자치도 제주시 회천동 2390-3"},{"id":578,"name":"미럭당","lat":33.499445,"lng":126.536842,"theme":"faith","cat":"민속","d1":"무속","d2":"신당","title":"물할망","sub":"해당없음","author":"제주특별자치도","abs":"물할망은 당옆의 샘물 외새미를 지켜주는 물할망이며 아기를 점지해주는 생불할망이다.","body":"제주시 동광양 본향인 미럭당에 모셔진 미럭보살 물할망은 당옆의 샘물 외새미를 지켜주는 물할망이며 아기를 점지해주는 생불할망이다. 당에 갈 때는 해뜨기 전에 외새미의 물을 떠가서 빌었다고 한다.","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=578","zip":"63216","addr":"제주특별자치도 제주시 이도이동 379-6"},{"id":583,"name":"법화사지","lat":33.263572,"lng":126.459529,"theme":"faith","cat":"민속","d1":"의식주","d2":"해당없음","title":"법화사지","sub":"해당없음","author":"서귀포시","abs":"금번 보고서는 3차에 걸친 이러한 발굴성과를 정리한 것으로. 김원룡. 윤무병. 김정기. 장경호. 오휘영 지도위원과 최몽룡. 고창석. 김홍식. 윤덕향. 현해남 조사위원의 발굴지도와 자문이토대가 되었습니다. 아울러 최영희. 한병삼 선생님은 물론. 조유전. 손병헌. 김용선 교수의 교시가 이번 발굴보고서를 내는데 많은 도움이 되었습니다. 또한 발굴조사를 진행함에 우근민도지사를 비롯하여 서귀포시 김인규시장과 강창주 전 시장. 그리고 도문화예술담당관실. 시문화공보실 김진수실장과 김상언계장의 협조와 법화사 주지 시몽스님. 신도회 김평윤 회장. 그리고 변성근 선생의 성원이 있었습니다. 제주대학교에서는 김형옥 총장과. 전 박물관장 강통원 교수를 비롯한 박물관 운영위원의 격려와 박물관 직원 여러분의 적극적인 참여가 있었는바 이에 깊은 감사의 말씀을 드립니다. 아울러 발굴현장의 책임을 맡고. 보고서 사진촬영과 원고작성에 주도적인 역할을 했던 강창화를 비롯하여 제주대학교 사학과 학생들의 수고가 많았습니다. 이 자리를 빌어 고마움을 표합니다.","body":"법화사지에 대한 발굴조사는 1982년 서울 명지대학교박물관의 김홍식교수팀에 의해 1차 이루어졌습니다. 이를 통해 고려시대 후기 금당지라고 추정되는 건물지률 확인하는 성과를 올렸지만. 법화사 전체 가람 배치에 대해서는 충분한 자료를 얻지 못하였습니다. 그로부터 8년후 서귀포시는 법화사 구품연지 추정 구역에 대한 발굴조사의 계획을 세우고. 이를 우리 제주대학교박물관에 의뢰하게 되었습니다 1990一1992년의 2차에 걸침 연지추정지구에 대한 발굴조사를 통해 연지시설을 적극적으로 인정할 만한 고고학적 자료는 확인하지 못하였지만. 『신증동국여지승람』의 기록에 보이듯 고려 당시 연꽃 있는 물이 법화사 남쪽에 있음은 확인하였습니다. 연지추정지구에 대한 발굴조사 성과를 검토하면서. 발굴지도 위윈들은 기본적으로 전체 가람 배치에 대한 전반적이고도 체계적인 발굴 조사가 이루어져야 한다는 의견을 제시하였습니다. 그래서 1982년 지표조사를 통해 관물지가 있을 가능성이 있는 지역으로 추정된 금당지 북쪽 구역을 중심으로. 1992년 3차 발굴조사가 실시되었습니다. 그 결과 조선시대 전기의 건물지가 확인되고. 「중창십육년기묘필」명 기와와 운룡문 · 봉황문막새기와 등의 귀중한 유물이 다량 수습되었습니다. 결국 법화사는 고려 후기에 중창되고. 조선시대에 지속적으로 증개축 되었음이 고고학적으로 확인된 것입니다. 아울러 건물지와 기와보도 등의 부속시설이 서쪽으로 연장됨으로 법화사의 전체 가람과 그 변천과정을 제대로 파악하기 위해서는 서쪽으로 발굴면적 확대할 필요성이 제기되었습니다.","ref":"해당없음","pub":"서귀포시","date":"1992-11-25","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=583","zip":"63553","addr":"제주특별자치도 서귀포시 하원동 1071-1"},{"id":591,"name":"새미물","lat":33.506984,"lng":126.61061,"theme":"water","cat":"민속","d1":"의식주","d2":"주생활","title":"새미물","sub":"해당없음","author":"제주특별자치도","abs":"회천동 화천사라는 절 동쪽에는 아무리 가물어도 마르지 않는 새미물이 있다.","body":"제주시 회천동에는 화천사라고 사찰이 있다. 화천사에서 동쪽으로 약 40m 떨어진 곳에는 \u0027새미\u0027라는 용천수가 있다. 회천동 마을은 이 물을 생명수로 해서 생겼다 한다. 새미물에서 새미는 샘을 의미하며 이곳의 물은 만병통치약으로 불릴 만큼 유명하여 마을 사람들의 식수로 활용되었다. \u003c발췌 : 문화유적분포지도(제주시) P91. 1999년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=591","zip":"63329","addr":"제주특별자치도 제주시 회천동 2390-3"},{"id":594,"name":"금산","lat":33.433925,"lng":126.330672,"theme":"oreum","cat":"민속","d1":"기타","d2":"해당없음","title":"조사연구보고서 제3집","sub":"1987년도","author":"제주도민속자연사박물관","abs":"제주도민속자연사박물관은 본도 특유의 민속생활과 아름다운 자연을 한눈에 볼 수 있도록 하기 위하여 그 자료들을 수집. 보관. 연구하는 한편 이들을 생태적이고 입체적인 종합전시를 통하여 후세교육에 이바지 함은 물론 관광진흥에도 크게 기어코자 문을 연지 어언 3주년을 맞이하게 되었다. 그동안 수많은 관람객의 많은 관심 호평 속에서 2백만 명이 넘은 관광객이 다녀갔고 관광료 수입만도 7억 원이 넘었다. 그러나 전시내객과 그 방문이 급속히 변화되어 가는 시간의 흐름에 따라 세련되고 과학적이며 현대적인 수준에 충족시키기에는 아직도 미흡한 점이 적지 않다고 할 수 있다. 그러므로 우리 박물관은 이를 보완. 수정하는 것이 불가피하다고 사료되어 필자는 10월. 10일 여정으로 고고민속연구관과 자연사분야 연구관 1명을 대동하여 선진화된 일본국의 박물관 또는 기념관의 시찰에 올랐다. 그러나 본국에서 허가된 일정에 계획된 박물관 등을 소상하게 견학하고 연구하기에는 시간적으로 불가능했다. 그러므로 이곳에서는 시찰한 박물관 또는 기념관의 일반적인 현황을 간단히 소개하고 견학소감에 따른 우리 제주도민속자연사박물관의 발전방안에 대하여 소견을 피력코자 한다.","body":"탐라문화의 보급선양과 보존이라는 사명감속에 개관한 지 벌써 3년을 맞이하였습니다. 그간 본 박물관은 본도 교육 및 관광명소로 또한 제주문화의 창달이라는 책무를 다하고자 분야마다 특색 있는 민속유물과 자연사 자료 15.000여 점을 수집하여 전시 또는 연구. 보존을 하는 한편 미흡하고 빈약한 표본전시와 개체전시. 분야를 생태적이고 입체적인 전시방법과 음향시설로 세련되고 현대적인 감각과 수준에 맞게 보완해 나가고 있습니다. 이러한 발전은 오로지 귀하의 아낌없는 성원과 지도의 결실이라 생각됩니다. 이제 개관 3주년을 맞이하여 조사연구보고서 제3집을 발간하게 됨은 이 분야에 종사하는 우리들의 영광이라 자부하면서. 앞으로 지속적인 연구 활동을 통하여 더욱 우수한 조사보고서가 나오도록 최선을 다하고자 합니다.","ref":"제주도. 1973. 제주도문화재 및 유적조사보고서/제주도. 1984. 제주도통계연보/문화재관리국. 1984. 한국민속종합조사보고서(제주)/외 74권","pub":"제주도민속자연사박물관","date":"1987-05-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=594","zip":"63035","addr":"제주특별자치도 제주시 애월읍 납읍리 1457-1"},{"id":600,"name":"존자암","lat":33.3477,"lng":126.481982,"theme":"faith","cat":"민속","d1":"기타","d2":"해당없음","title":"한라산의 역사 · 유적","sub":"한라산총서3","author":"제주도/한라산생태문화연구소","abs":"본서에서는 한라산의 역사와 유적에 대하여 다루어 보았다. 한라산과 주민생활. 한라산 일대의 문화유적. 한라산 일대의 동굴유적. 도내 오름과 일제군사유적. 그리고 한라산과 4.3의 5개 분야에 관한 소고를 한 권의 책으로 묶어 내놓는다. 한라산은 생업활동의 터전과 각종 특산물 산출의 자연환경을 갖추게 해주었던 존재이기도 하다. 제주주민은 3~7세기 무렵부터 목축을 활발하게 행하였다. 특히 고려시대 들어와서는 국가수요의 상당량이 제주말로 충당될 만큼 제주에서는 말사육이 성행했다. 더욱이 제주주민이 몽골족과 더불어 말 사육을 향하기 시작한 13세기 말부터는 동. 서아막이라 일컬었던 탐라목장이 세계도처에 위치한 몽골제국의 14개 국립목장 가운데 하나로 간주될 만큼 규모가 커졌고. 제주도의 산과 들에는 말이 가득했다고 할 정도에 이르렀다.","body":"한라산이라는 명칭의 사용 예나 지금이나 한라산은 주민 생활에 자원을 제공하는 터전일 뿐만 아니라. 사람들에게 신앙 행위의 대상으로 인식되는 존재이기도 하다. 한라산과 주민생활의 관계가 아주 오랜 옛날부터 생겨나 오늘날에도 이어지고 있음은 각종 사서(史書)를 통해 확인할 수 있다. 한라산이라는 명칭이 기록에 드러나는 것은 조선시대 1397년(태조6) 권근(權近)이 지은 어제시(御製詩)가 가장 이르다. 그는 탐라(耽羅)라는 시제(詩題)를 내걸고. 다음과 같은 시를 지었음이 태조실록 권11. 태조6년3월 신유(辛酉)조에서 확인되고 있는 것이다. 푸르르고 푸른 한 점의 한라산이. 만경창파 아득한 속에 멀리 있네. 사람이 별을 움직여 바다 나라에 왔었고. 말은 용의 씨를 낳아서 천한에 들어갔다오. 땅은 궁벽되나 백성들이 업이 있어 살아가고. 바람이 편하면 장삿배가 겨우 오고가오. 성명의 시대에 직방에서 판적을 꾸밀 때. 그 고장 누추하지만 부디 빠뜨리지 마옵소서.","ref":"강정효.\u003c한라산\u003e.돌베게.2003/ 외 다수","pub":"제주도/한라산생태문화연구소","date":"2006-04-05","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=600","zip":"63554","addr":"제주특별자치도 서귀포시 하원동 산1-1"},{"id":655,"name":"성널오름","lat":33.38485,"lng":126.619188,"theme":"oreum","cat":"민속","d1":"기타","d2":"해당없음","title":"한라산의 지형 · 지질","sub":"한라산총서2","author":"제주도/한라산생태문화연구소","abs":"우리나라는 아시아 대륙의 동부 연변에 반도(peninsula)로 위치하고 있으며. 지질학적으로 유라시아판(eurasian plate)의 동단에 속한다. 한반도는 지질학적으로 중국대륙과 일본호상열도를 연결하는 다리 역할을 하고 있다. 한반도에는 매우 오래된 선캠브리아이언에서 신생대에 이르는 다양한 암석이 분포하고 있다. 주로 선캠브리아이언의 고기암류 위에 중생대 퇴적분지가 형성되어 퇴적암류들이 충진되고. 각종 화성암류들이 관입분포하여 육지를 이루고 있다. 지금으로부터 약 6천 5백만 년 전 신생대가 시작되면서 현재의 한반도의 모습을 지니게 되었다. 제주도는 제3기 말에서 4기초에 형성되기 시작하였으며. 이때의 우리나라 지질에 대해 간략하게 요약하면 다음과 같다. 중생대 말에서 신생대 초기의 우리나라는 육지의 산과 들에서 풍화·침식된 퇴적물들이 바다로 운반되고. 퇴적작용은 주로 동해안을 따라 소규모로 형성된 퇴적분지에 국한되었다. 이 때 형성된 신생대 제3기 암석이 현재 주로 동해안 쪽의 영해. 포항. 양남. 울산지역에 소규모로 분포하고 있다. 한반도 남서단에 위치하는 제주도 역시 지질학적 기반은 한반도가 가지는 지질학적 특징들과 동일한 것으로 여겨지고 있으며. 신생대 제3기 말 이전에는 한반도의 남부지역과 동일한 지질학적 진화환경에 있었다. 제3기 말(대략 200만 년 전)에 이르러 육지부와 달리 특이한 지질사건을 겪고 있는 것으로 보고된다.","body":"제주도는 전체가 비교적 최근에 형성된 화산암과 화산쇄설암으로 구성된 섬으로 그 중심부에 남한에서 가장 높은 한라산이 형성되어 있으며. 오염되지 않은 울창한 밀림과 이국적인 식생. 맑고 투명한 대기. 수평선이 아득한 푸른 바다와 현무암질 암석이 만들어 내는 짙은 암색의 바위들이 함께 어우러져 빼어난 자연경관을 만들어 내고 있다. 또한 육지와 멀리 떨어진 채 한반도 최남단에 위치하고 있어 남국의 정열과 이국적 정취를 곳곳에 지닌 매우 낭만적인 제주도는 우리에게 언제나 상큼한 유혹으로 다가온다. 이렇게 자연이 베풀고 있는 아름다움과 신비로움은 제주도의 지하 심부에서 만들어진 마그마(magma)분출의 결과물이며. 마그마 분출은 지구 내부의 열을 식히기 위한 지구진화과정의 한 표현인 것이다. 우리의 지구가 이 광활한 우주에서 하나의 행성으로 아직 살아 있는 별임을 의미하는 것이다. 또한 지구를 연구하는 지구과학자들에게 마그마 분출은 지구 심부를 직접 접할 수 있는 귀한 자료인 것이다. 이렇게 수평적으로는 제주도의 낭만을. 수직적으로는 지구와 제주도의 진화체계에 대한 의미를 함께 경험한다는 것은 괜찮은 즐거움이 될 것이다. 제주도와 제주도의 한라산은 남한에서 화산체의 원형을 볼 수 있는 유일한 장소이며. 우리나라의 제4기 화산활동을 대표할 수 있는 지역으로 최근의 지질학적 사건을 이해하는 데 중요한 정보를 지니고 있다. 이러한 한라산과 제주도 지질에 대한 형성메커니즘과 진화발달과정. 그리고 화산활동사에 대한 연구성과를 체계적으로 수집 · 종합 정리하는 것은 제주도와 한라산에 대한 우리의 이해고취와 가치정립에 크게 기여할 것이다. 현재의 시간에 접근할수록 여기저기에서 관찰되는 암석이 제공하는 의미를 획득·해석하기는 쉬워진다. 과거로 갈수록 암석들이 침식 · 풍화되어 이미 지구상에서 제거되었거나 변형작용 등을 받아 원래의 모습을 지니지 않을 확륭이 매우 높아진다. 또한 다양한 조구조운동(tectonic movement)에 의해 암석이 생성된 원래의 장소에서 이동될 확률이 높아지기도 하여 나이가 많은 암석일수록 노두(outcrop)에서 암석이 표현하는 언어를 해독하는 것이 쉽지 않게 된다. 마치 오래되어 변색되고 찢겨진 역사책을 통해 장구한 역사를 정확하게 이해하는 데 어려움이 있는 것과 같은 것이다. 제주도는 신생대의 제4기에 형성된 화산도로서 이제 막 제본·인쇄된 한 권의 소설과 같이 한반도 신생대 시기의 화산활동에 대해 많은 의미를 지니고 있다. 신생대 제4기에 형성되기 시작한 제주도의 지사(地史)를 논하기 위해 먼저 지구가 태양계에서 탄생하여 진화해온 지난 46억 년의 지질시대(地質時代)의 시간적 구분을 간략하게 살펴보면 다음과 같다. 지질시대는 크게 ①선캠브리아이언(Precambria Eon:46억년 전 ~ 5억 7천만 년 전 동안의 기간). ②고생대(Paleozoic Era:5억 7천만 년 전 ~ 2억 5천만 년 전 동안의 기간). ③중생대(Mesozoic Era:2억5천만 년 전 ~ 6천5백만 년 전 동안의 기간). ④신생대(Cenozoic Era:6천 5백만 년 전 이후부터 현재까지)로 나누어진다. 우리 인간에게 가장 가까운 과거인 신생대는 다시 크게 제3기(Tertiary)와 제4기(Quaternary)로 나누어진다. 제3기는 6천5백만 년 전(65Ma=Millions of years Ago)에서 1백 6십만 년 전(1.6Ma) 동안의 시기를. 제4기는 1백 6십만 년 전부터 현재까지의 시간을 의미한다. 제주도는 대략 200만 년 전 즈음에 현재의 위치에서 형성되기 시작했으므로 신생대 제3기 말에서 4기초에 제주도 형성이 시작되었다고 할 수 있다.","ref":"김옥준. 손치무. 이대성. 이상만. 남기영. 윤 선. 길영준. 홍충식. 1965. 제주도 지하수탐색 지질조사보고서. 건설부·(주)한국지하자원조사소.p.1~82.4 도면. / 남기영. 1966. 제주도의 지질과 지하수. 국립지질조사소. 지하수원조사보고.3.p.109~133.2 도판. 외 92권","pub":"제주도/한라산생태문화연구소","date":"2006-04-05","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=655","zip":"63345","addr":"제주특별자치도 제주시 조천읍 교래리 산137-24"},{"id":663,"name":"대정읍성","lat":33.249455,"lng":126.278752,"theme":"fort","cat":"민속","d1":"의식주","d2":"해당없음","title":"대정읍성 학술조사 보고서","sub":"해당없음","author":"제주문화예술재단","abs":"대정읍성은 조선시대 군현제가 확립되는 과정에서 생겨난 생성물로서 제주도 3대 문화권 가운데 하나의 중심지였다. 오늘날에 와서는 대정읍성은 제주도 문화권을 대표하는 위상과 기능을 충분히 지속·확산시켜 나아갈 수 있는 곳이다. 때문에 대정읍성은 국가 사적지로 지정고시가 이루어져야 할 필요성이 충분히 있다고 하겠다. 대정읍성은 고려시대와 조선시대 지방제도의 차이점과 그 특색을 엿볼 수 있는 경관으로서 국가사적 의미를 지니고 있음과 아울러. 제주도 문화의 형성과 전개에서 구심점의 역할을 해 왔었던 만큼. 제주도 지역의 정체성을 드러내는 문화유적이기도 하다. 앞으로. 대정읍성은 제주도 서남부 지역의 문화관광벨트권 형성을 선도할 거점으로서 그 보존 · 복원 등의 정비와 그 활용방안이 강구되어야 할 문화유적으로서도 그 존재가치가 크다. 이에 대정읍성은 제주목관아. 정의현성 등의 예와 같이. 발굴조사가 이루어져야 하며. 그에 따라 복원 정비계획 및 활용방안의 방향을 설정하는 것이 바람직하다. 차후 대정읍성은 국가 사적지로 지정되어야 할 것으로 본다. 이와 아울러. 대정읍성의 보존과 복원. 또한 성내 관아의 복원 등과 같은 정비가 보다 더 정확하고. 또한 서남부 지역 문화관광벨트권의 거점 유적으로 그 효과를 극대화하기 위한 전제작업으로서도 대정읍성 일대에 대한 발굴조사가 조속히 시행되어야 할 것이다.","body":"대정읍성은 고려시대 군현제에서 조선시대 군현제로의 이행을 보여줌과 아울러. 조선시대 읍성의 조영 규범을 따르면서도 제주의 지역적 특색이 엿볼 수 있는 구체적 경관으로서 국가사적 의미가 크다고 하겠다. 한편. 대정읍성은 제주도 3대 문화권의 발상지 가운데 하나로서 조선왕조 500여 년 이래 제주도 서남부 문화권의 구심점이 되어 왔었던 곳이다. 이에 제주도 기념물 제12호 지정의 대정읍성에 대한 가치를 재발견 · 재검토하여 국가 사적지의 지정고시를 추진함과 아울러. 체계적인 관리 대책을 수립하는데 기초를 삼고자 한다.","ref":"변태섭.1993.「지방의 중간 통치기구」『한국사』13.국사편찬위원회. / 이수건. 1984. 『한국중세사회사연구』. 일조각. 1984. 354~367. 외 10권","pub":"제주문화예술재단","date":"2006-01-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=663","zip":"63517","addr":"제주특별자치도 서귀포시 대정읍 인성리 2039"},{"id":704,"name":"무수천","lat":33.460193,"lng":126.447781,"theme":"water","cat":"민속","d1":"의식주","d2":"해당없음","title":"광령약사","sub":"해당없음","author":"광령1리","abs":"삼신산중 제일영봉인 한라산의 정기가 뻗어 내려 일곱 개의 산봉우리(山七星) 일곱곳의 맑은 샘물(水七星)이 조화를 이룬 지역이 광령 마을이다. 마을의 동편에는 무수천이 있어 제주시와 경계하며. 많은 전설과 아름다운 자연경관(무수천인경등)을 만들고 북쪽으로 흘러 도근천과 만나 바다로 흐른다. 중산간지대에 위치하고 있는 우리 마을은 제주시와 대정. 서귀포 지역과의 교통의 중심지가 되어 옛적 집단주거리로서 부락이 형성되었으며 교통이 불편하였던 시대에는 객굴집이 있어 여행자들이 쉬어가곤 하였다고 전한다. 이러한 입지적 조건과 자연환경은 사람이 살기에 알맞아 고대부터 선인이 살았음을 그 유적으로 보아 알 수 있다. 불행하게도 본리에 관한 사료들이 보전되지 못하여 문헌상에 나타나 있는 것이 극미한 실정이고 더욱이 4.3사건으로 인하여 마을의 사고각인 호적궤가 황망 중에 소실되어 근세사마저 확실하게 밝힐 수 없음은 참으로 안타까운 일이다. 이제 만시지탄 이나마 전설과 유적을 더듬어 수집된 자료와 마을의 원로 선배님들의 증언을 바탕으로 선인들의 삶을 이어오는 오랜 역정 속에 깃든 백절하굴의 정신과 고난극복 지혜를 오늘에 사는 우리가 배우고. 나아가 후세에 전하려 마을총회의 결의에 편집위원회를 구성. 편집에 착수하였던 것이다. 그 어간에 리민은 물론 이 지역 출신들의 많은 성원에 힘입어 한 권의 책지로 발간하게 된 것이다. 본지가 발간됨을 계기로 하여 향민의 대화합과 단결을 통하여 공동체로써의 일체감이 조성되고 애향심을 고양함으로써 지역사회발전에 크게 기여하게 되기를 바라며. 어려운 이 여건하에서도 책자의 발간을 위하여 편집 및 교정에 힘써주신 여러분께 깊은 감사를 드립니다.","body":"향토지를 발간한다는 계획을 세우고 만 2년이 지난 다음에야 겨우 한 권의 책을 묶게 됐다.모든 게 죄송스러울 뿐이다. 애초부터 너무 쉽게 생각하고 덤벼들었던 게 탈이었다. 이번 작업을 하면서 한 마을의 향토사를 정리하려면 적어도 5~6년의 오랜 시간과 심사숙고가 있어야만 하리라는 점을 새롭게 체득했다. 편집과정에서 도움을 주시던 두 분의 마을 고로(古老)께서 세상을 뜨셨다. 그래서 더욱 송구스럽다. 그러나 이 한권의 광령약사가 만족스럽지는 않더라도 제 2의 향토지가 만들어질 수 있는 토대를 마련할 수 있으리라는 기대감으로 죄스러움을 대신하며 여러분들의 해량을 바랄뿐이다.","ref":"해당없음","pub":"광령1리","date":"1990-12-31","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=704","zip":"63077","addr":"제주특별자치도 제주시 애월읍 광령리 4228"},{"id":709,"name":"와흘본향당","lat":33.50262,"lng":126.638869,"theme":"faith","cat":"민속","d1":"민간신앙","d2":"당굿","title":"와흘본향당 당제","sub":"해당없음","author":"제주특별자치도","abs":"와흘본향당당제는 일년에 4번 큰 제를 올리는데. 마을의 평안을 도모한다.","body":"와흘리 본향당은 \u0027와흘 한거리 하로산당\u0027 또는 노들당 이라고도 한다. 주민들이 나무를 신성시하여. 가지를 쳐낼 때도 반드시 제를 지냈다. 당에서 제를 지낸 뒤에는 곳곳에서 찾아온 사람들과 음식을 나누어 먹는다","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=709","zip":"63344","addr":"제주특별자치도 제주시 조천읍 와흘리 1274-1"},{"id":768,"name":"멜튼개","lat":33.521686,"lng":126.900095,"theme":"sea","cat":"민속","d1":"생산기술","d2":"어로기술","title":"새개와 멜튼개","sub":"해당없음","author":"제주특별자치도","abs":"조수간만의 차이를 이용한 어로법이다.","body":"제주시 구좌읍 하도마을 해안도로를 가로지르는 도로변 가까이에 \u0027새개\u0027와 \u0027멜튼개\u0027 가 자리해 있다. 그 뒷쪽으로 문주란 자생지로 유명한 토끼섬이 있다. \u0027새개\u0027는 서쪽에. 그리고 \u0027멜튼개\u0027는 그 동쪽에 있다. 새로 근래에야 축조했다고 하여 \u0027새개\u0027라 하고 멸치 떼들이 많이 몰려들어 잘 \u0027뜨는\u0027 개이기에 \u0027멜튼개\u0027라 한다. 이두개는 얼기설기 그 담을 축조했는데. 전체적으로 2.000여평은 족하다. 모래바닥위에 띄엄띄엄 돌멩이들이 보인다. \u003c발췌 : 제주도 제주민속유적 P318. 1997년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=768","zip":"63363","addr":"제주특별자치도 제주시 구좌읍 하도리 385-12"},{"id":769,"name":"별도봉","lat":33.519202,"lng":126.553084,"theme":"oreum","cat":"민속","d1":"기타","d2":"해당없음","title":"별도연대","sub":"해당없음","author":"제주특별자치도","abs":"연대는 횃불과 연기를 이용하여 정치·군사적으로 급한 소식을 전하던 통신수단을 말한다.","body":"제주시 화북동 동쪽 연대동산에 있는 별도연대는 화분진에 소속되었으며. 화북 대라고도 부른다. 횃불과 연기를 이용하여 정치·군사적으로 급한 소식을 전하던 통신수단을 말한다.","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=769","zip":"63293","addr":"제주특별자치도 제주시 화북일동 4472"},{"id":799,"name":"높은오름","lat":33.455074,"lng":126.798399,"theme":"oreum","cat":"민속","d1":"기타","d2":"해당없음","title":"바람의 고향 오름","sub":"서재철 제주 기생화산 사진집","author":"서재철","abs":"진달래꽃이 활짝 피었다는 소식을 듣고 선작지왓 나그네궤를 찾았다. 나그네궤는 오늘도 저기 있건만 자꾸 멀리 있는 것만 같은 마음은 웬일일까. 저만치 가는 오름들도 붙잡아 놓고 싶다. 그래서 부지런히 오름을 찾아 나서길 몇 년. 아직도 그 품에 안기기엔 무엇인지 부족한 듯한 마음뿐이다. 오름나그네 선생을 따라 나섰던 오름길은 여전하건만 옆에 있어야 할 나그네 선생은 그 자리에 없다. 아직도 풋풋이 느껴오는 오름이야기를 찍고 싶어 수없이 찾아다닌 오름들. 현상되어 나타난 오름을 보면서 실망할 때도 많았다. 그럴 때마다 다시는 오름을 찍지 말아야지 하는 생각을 수없이 하면서도 새벽녘이면 카메라를 들고 오름을 찾아 나섰다. 나그네선생 오름이야기를 영상으로 담고 싶었던 욕심은 아무래도 욕심으로 그칠 것 같다. 제주만이 지니고 있는 오름의 독특한 모습을 표현하고 싶어 그렇게도 발버둥을 쳤지만 아직도 부족함이 많다. 이것이 시작이란 마음으로 이 책을 엮었다. 다시 또 만들겠다는 다짐이기도 하다.","body":"과학의 입장에서 보면 \u0027오름\u0027 생성은 화산활동의 결과이지만. 제주 사람들의 관념에는 한스러움이 빚어낸 자연작품이다. 우리 고장에는 \u0027오름\u0027 생성과 관련된 전설이 전해지는데. 그 내용은 대충 다음과 같다. 먼 옛날 \u0027설문대할망\u0027이라는 할머니가 있었다. 얼마나 거대했는지 한라산을 베개 삼아 누우면 두 다리는 제주시 앞 바다에 있는 관탈섬에 걸쳐졌다고 한다. 이 \u0027설문대할망\u0027은 빨래를 하려면 빨래감을 추자도에 얹어 놓고 한라산 꼭대기에 손을 짚고 서서는 발로 문질러 빨았으며. 길쌈을 할 때는 성산 일출봉에 등잔을 올려 놓아 했다고 할 만큼 거인이었다. 그 당시 제주 사람들은 육지와 자유롭게 왕래하기를 바랐지만 바다가 가로놓여 있어 불편함이 많았다. 이런 사정을 알고 있는 \u0027설문대할망\u0027은 속옷 한 벌만 만들어 주면 육지까지 다리를 놓아주겠다고 약속했다. 속옷 한 벌을 만드는 데는 명주 100동이 필요한데. 모으고 모으고 했지만 99동밖에 되지 않는다. 옷감을 모으는 사이에 이 할머니는 치마폭에 흙을 담아 다리를 놓는 작업을 했는데 이때 조금씩 흘러 내린 흙덩이가 \u0027오름\u0027이 되었다. 끝내 한 동이 부족하여 약속을 어기게 되고 다리를 놓는 작업도 중단되었다. 그래서 제주도는 아직도 육지와는 떨어져 물로 에워진 섬으로 남아 있다는 것이다. 백에서 하나가 부족하여 소원이 이루어지지 않았다고 하는 것은 아쉬움의 다른 표현이다. 아쉽다는 것 또한 슬픔이며 한이다. 결국 \u0027오름\u0027은 제주 사람들의 한이 응어리져 생겼다는 말로 바꾸어도 좋을 것이다.","ref":"해당없음","pub":"높은오름","date":"1998-07-15","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=799","zip":"63355","addr":"제주특별자치도 제주시 구좌읍 송당리 54-1"},{"id":845,"name":"신영물","lat":33.220147,"lng":126.251838,"theme":"water","cat":"민속","d1":"방언","d2":"어휘","title":"우리 고유지명 유래집","sub":"해당없음","author":"남제주군","abs":"현재 문헌이나 구전되어 부르고 있는 우리고유의 아름다운 지명에 대하여 그 지명의 유래를 집대성 보존하기 위해 체계적으로 정리한다는 것이 얼마나 힘들고 어려운지를 새삼 실감했으며 두려움부터 앞섰습니다. 또한. 현지 확인 조사 및 전경사진을 촬영하는 과정에서 전문조사요원이나 촬영기사가 아닌 순수한 공무원들로 조사반을 편성하여 조사·촬영하다 보니 미숙한 점이 많았다고 생각하며. 마을별로 지명의 유래를 조사·확인하는 과정에서도 문헌 등에 의해서 기록·보존 되고 있는 것보다 대부분이 구전으로만 전해오고 있었으며 마을의 원로들에게 협조를 얻었으나 확실한 지명의 유래에 대해 책임성 있게 고증할 수가 없어서 다소 아쉬움이 있었습니다만. 우리 편집실무진들은 나름대로의 객관성을 갖고 편집부터 인쇄까지 최선의 노력을 다하였습니다. 그러나. 우리 지역 내에 고유지명에 대하여 그 유래를 정확히 기록하고 보존하는 것이 자라나는 후세들에게 마을의 역사를 바로 알고 이를 통한 애향심을 고취하는데도 크게 기여할 수가 있다는 군수님의 발간취지에 맞게 편집하려고 심혈을 기울여 노력을 하였습니다만. 자료내용이 일부 빈약 하는 등 누락된 부분도 없지 않아 있을 것으로 사료되면 차후 재발행시에는 보완하도록 하겠습니다.","body":"우리 고장의 각 마을에는 지역을 상징하는 우리 고유의 아름다운 지명이 있습니다. 그러나. 이에 대한 유래를 체계적으로 정리한 기록이 없어 안타깝게 생각하던 중 뜻 깊은 광복 50주년을 맞아 민족정기와 민족자존을 되찾는다는 차원에서 우리 지역의 고유지명에 대한 유래를 찾아 집대성한 책자를 발간하게 되었습니다. 지난 3개월간 관내 76개 각 마을별로 실태조사반을 편성하여 고유지명을 정밀조사 한 결과 우리 고장에는 일본식으로 개악된 지명이 없는 것으로 조사되어 선인들의 강한 자주의식을 발견할 수 있었음은 다행한 일이었습니다. 특히. 주민의견의 대부분이 구전으로 내려오는 고유지면을 사용하겠다는 것이기에 본 유래집을 발간하는데 큰 힘이 되었습니다. 우리 군 관내 2.100여개 지역의 지명유래가 수록된 이 책자에는 앞으로 자라나는 후세들에게 마을의 역사를 바로 알게 하고 이를 통한 애향심 고취에도 크게 기여하리라 생각합니다. 이 책자를 발간하기 위하여 많은 분들로부터 도움말을 듣고 방대한 자료를 수집하는데 최선을 다했습니다만 혹 미흡한 부분은 보완해 나갈 것을 약속드립니다. 아무쪼록 \u0027우리고유 지명유래집\u0027이 우리 남제주군 관내 마을의 역사와 군민들의 자존의식을 이해하는데 도움이 되기를 기대하는 바입니다.","ref":"해당없음","pub":"남제주군","date":"1995-06-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=845","zip":"63506","addr":"제주특별자치도 서귀포시 대정읍 하모리 938-3"},{"id":849,"name":"대평리난드르일뤠당","lat":33.240218,"lng":126.360893,"theme":"faith","cat":"민속","d1":"무속","d2":"신당","title":"대평리난드르일뤠당(입구)","sub":"해당없음","author":"제주특별자치도","abs":"대평리 난드르일뤠당은 서귀포시 대평리에 있는 신목형의 당이다.","body":"난드르는 넓은 들판이라는 뜻의 대평리의 옛 지명이다. 당신은 닷방할망. 닷밧 일뤠중저이며 제일은 매달 7일 17일이다. 마을을 떠나는 등의 대소사가 있을 때는 꼭 들러서 고하고 간다고 한다.","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=849","zip":"63531","addr":"제주특별자치도 서귀포시 안덕면 감산리 934"},{"id":853,"name":"수정사","lat":33.262252,"lng":126.374807,"theme":"faith","cat":"민속","d1":"기타","d2":"해당없음","title":"제주문화 제6호","sub":"해당없음","author":"제주문화원","abs":"「제주문화」 제6호를 내놓게 되었다. 이 2000년. 연초에는 이른바 밀레니엄의 해라는 의미에서 이것저것 하고 싶던 일도 많더니. 모든 것은 아쉬움만으로. 이 한 해도 얼마 남지 않았다. 그런대로 이제 「제주문화」 제 6호의 원고를 받아 놓고 보니. 집필하여 주신 여러 선생님께 고마운 말씀을 드리지 않을 수 없다. 이들 여러 원고 가운데서도. 지난 92년으로 개교 600주년을 맞이한 \u0027제주향교\u0027의 역사와 앞날의 과제에 대하여 집필하여 주신 제주향교의 전교 진맹하 선생의 옥고를 비롯하여. 제주도의 불교 유적 중 최고 유적으로 알려진 \u0027존자암\u0027에 관한 김봉옥 선생의 옥고. 고려 사찰이었던 것으로 알려진 \u0027수정사\u0027에 관한 김동전 선생의 논문. 그리고 \u0027고려 전기 탐라의 정치 사회적 위상과 형태\u0027에 관한 김일우 선생의 논문들은 우리 제주도민의 지난날의 삶과 문화를 이해하는 데 귀중한 자료가 될 것으로 생각한다. 지금 제주시에서는 옛 산지천을 되살리는 공사가 한창인데. 때 맞추어 홍순만 선생의 \u0027산지천 문화\u0027란 글은 옛 산지천의 정서를 이해하는 데 큰 도움이 되어 주리라고 믿어진다. 이 「제주문화」에 옥고를 보내 주신 집필자 여러 선생님께 거듭 고마운 말씀을 드리며. 앞으로도 이 「제주문화」에 많은 관심과 애정을 보내 주실 것을 기대한다.","body":"현 외도초등학교 서편은 옛 고려시대 \u0027수정사(修精寺)라는 사찰이 자리했던 터이다. 지금은 옛 사찰과는 직접적인 관련이 없는 동명의 수정사가 자리하고 있다. 그리고 토지구획 정리사업으로 주변이 새롭게 변모하고 있는 실정이다. 또한 그 주변에 조공천(朝貢川)이라 부르는 외도천이 자리하고 있고. 외도천 하류에는 월대(月臺)라 하여 옛부터 풍류객들이 풍류를 즐겼던 명승지가 있다. 수정사는 법화사 · 원당사와 더불어 고려후기 제주지역을 대표하는 3대 사찰로 알려져 왔다. 법화사는 그 동안의 발굴조사 등을 통하여 그 실체가 어느 정도 밝혀졌고. 이를 토대로 본격적인 복원사업을 전개하고 있다. 수정사는 1987년 제주대학교 박물관에서 지표조사를 통하여 대형 주초석과 각종 유물을 확인함으로써 사찰의 규모가 매우 컸을 것으로 추정되어 왔다. 그러나 1997년 이래로 제주시가 이 일대에 외도 토지구획 정리 사업을 전개하면서 유적의 중요성이 제기되어 왔음에도 불구하고. 이렇다 할 대책 없이 무리하게 사업을 전개하였다. 그러나 뒤늦게나마 유적에 대한 시굴조사가 시행되었다. 제주대학교 박물관에서 1998년 6월부터 4개월간 시굴조사를 실시하였다. 이 조사에서 고려 말 기와와 흑상감청자. 조선초 분청 등 도자기. 철제와 금동제유물. 화폐 등 다량의 유물을 확인함으로써 유적의 중요성이 크게 부각되었다. 이를 바탕으로 2차 확대 발굴이 2000년 2월부터 6월까지 실시되었다. 제주대박물관은 이 발굴에서 건물지 12동. 고려시대 청자 등 토기 자기류. 그리고 제주도 내에서 가장 오래된 것으로 추정되는 인왕상이 음각된 탑면석 등을 발굴해 내는 성과를 거뒀다. 나아가 발굴조사를 통해 확인된 주성사지를 현 수정사의 뒤편을 끼고 남북으로 능선을 따라 여러 채의 건물지가 배치된 것으로 확인되었다. 건물지는 남북 120~150m. 동서 50~60m 정도이며. 건물지는 외도동 198 · 199 · 376번지 일대를 중심으로 분포하는 것으로 밝혀졌다. 특히 외도1동 376-1번지 일대에서는 건물지 12동. 도로와 보도. 탑지. 석등지. 담장. 폐외무지. 적석유구 등이 확인됐다. 또 11세기 순청자에서 18세기 중엽의 백자류. 그리고 중국의 청자와 백자 등이 다양한데 매병은 12세기 강진 사당리에서 극소수 확인되는 것으로 질과 장식. 유약 등 청자 최전성기 작품이고. 백자는 15세기 초부터 16세기까지 만들어진 것이 모두 출토됐다. 이밖에도 연판문 · 일휘문 암막새. 연판문 수막새. \u0027만호\u0027 · \u0027목사\u0027 등의 명문기와. 평기와가. 그리고 금동제품. 숟가락 · 젓가락 등 청동제품. 인왕상이 음각된 탑제 부속구도 다량 출토됐다. 수정사가 언제 누구에 의해 창건되었는지는 확실하지 않다. 그러나 지금까지 수정사의 창건과 관련해서 크게 2가지 측면이 제기되어 왔다. 하나는 제주가 원의 간섭을 받고 있던 시기에 창건되었다는 원에 의한 창건설이고. 다른 하나는 삼별초를 토벌하기 위하여 몽고가 제주에 들어오기 이전인 13세기 중엽이전에 원과 상관없이 수정사가 창건되었다는 것이다.","ref":"해당없음","pub":"제주문화원","date":"2000-12-30","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=853","zip":"63537","addr":"제주특별자치도 서귀포시 상예동 4721-1"},{"id":859,"name":"자장코지","lat":33.236926,"lng":126.437482,"theme":"sea","cat":"민속","d1":"무속","d2":"신당","title":"대포동좀녀당(지전물색)","sub":"해당없음","author":"제주특별자치도","abs":"\u0027대포동좀녀당\u0027의 바위 상단의 신목에 걸려 있는 \u0027지전\u0027과 \u0027물색\u0027이다.","body":"대포동좀녀당\u0027의 바위 상단의 신목에 걸려 있는 \u0027지전\u0027과 \u0027물색\u0027이다. 해녀들이 기원을 하고 지드림을 하는 당이다. 주로 생기 맞는 날에 다니며. 제물로는 상메 한그릇. 보시메 세그릇. 백지 서넉장. 광목 서넉장. 과일 등을 올린다. 보시메는 지를 싸는데 쓴다. 지드림은 올렸던 제물을 조금씩 떼어서 올렸던 종이에 나누어 싸서 실로 묶는것으로. 이것을 \"지\" 혹은 \"제\" 라고 한다. 이것을 바다에 던지는데. 이를 \"지드림\" 이라 한다. 지드림을 할 때 대개 \"요왕황제국님전이 요왕지 받 수다\" 라고 말한다. \u0027대포동좀녀당\u0027은 대포동 인근에 있는 \"자장코지\" 우뚝한 바위 위에 있다.","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=859","zip":"63544","addr":"제주특별자치도 서귀포시 대포동 2385"},{"id":862,"name":"법환동본향당","lat":33.233125,"lng":126.51221,"theme":"faith","cat":"민속","d1":"무속","d2":"신당","title":"법환동본향당(외부)","sub":"해당없음","author":"제주특별자치도","abs":"서귀포시 법환동 본향당의 외부 모습이다. 법환동 바닷가 인근에 있으며. 당을 옮기면서 새로 보수하여 다른 곳에 비하여 깔끔한 편이다.","body":"서귀포시 법환동 본향당의 외부 모습이다. 법환동 바닷가 인근에 있으며. 당을 옮기면서 새로 보수하여 다른 곳에 비하여 깔끔한 편이다. 이곳에는 서쪽. 북쪽에 제단이 있는데. 서쪽이 일뤠당이고 북쪽이 여드렛당이다. 앞당의 당신은 \"배염줄이 일뢰중자\" 이다. 마을에 사람이 죽으려 하면 먼저 이 본향당이 문을 닫는다고 한다. 앞당에 면해서 따로 당이 만들어져 있다. 원래 윌뤠당은 남해 앞바다에. 여드렛당은그 너머에 있었는데. 십여년전에 다니기 불편하다는 이유로 큰 굿을 하면서 당을 옮겨왔다고 한다. 당을 옮기는 결정은 심방이 하였다고 한다. 祭日은 따로 없고 각자 生氣 맞는 날로 택일하여 다니며. 제물은 각각 사발메 1그릇. 보시메 1그릇. 생선 한마리. 과일 등이다.","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=862","zip":"63573","addr":"제주특별자치도 서귀포시 법환동 1450-1"},{"id":876,"name":"각시당","lat":33.526674,"lng":126.891896,"theme":"faith","cat":"민속","d1":"무속","d2":"신당","title":"하도리각시당전경","sub":"해당없음","author":"제주특별자치도","abs":"각시당은 구좌의 해녀들이 주로 영등일인 2월 13일경 제물을 바치며 비념을 비는곳이라고 한다.","body":"각시당은 구좌의 해녀들이 주로 영등일인 2월 13일경 제물을 바치며 비념을 비는 곳이라고 한다.신동 해안도로변에 위치해 있다. 노천에 돌과 시멘트로 둘레를 두르고 제단을 만들어 모시고 있다. 옛날에는 1년에 한 번씩 각 동네마다 각시당으로 와서 큰당의 신을 모셔다가 당굿을 하였고 후에는 세 동네가 모여서 당굿을 하였으나 1984년 이후로는 하지 않는다고 한다. 당굿은 해녀들이 바다에 갈 때 궂은 일이 일어나지 않게 해달라고 빈다.","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=876","zip":"63363","addr":"제주특별자치도 제주시 구좌읍 하도리 450-3"},{"id":903,"name":"면수동본향당","lat":33.523247,"lng":126.865967,"theme":"faith","cat":"민속","d1":"무속","d2":"신당","title":"하도리면수동본향당","sub":"해당없음","author":"제주특별자치도","abs":"면수동 본향당(할망당)은 여씨 할머님이 강진에서 중이대소 선소님을 거느리고 하도에 좌정하였다.","body":"면수동 본향당(할망당)은 여씨 할머님이 강진에서 중이대소 선소님을 거느리고 하도에 좌정하였고 각시당. 요왕당. 선앙당. 달위당을 거는리는 여래불법 할마님이다. 재일은 정월 12. 영등 2.12 시만국대제날이다.","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=903","zip":"63362","addr":"제주특별자치도 제주시 구좌읍 하도리 3359-19"},{"id":937,"name":"매오름","lat":33.310112,"lng":126.813874,"theme":"oreum","cat":"민속","d1":"의식주","d2":"해당없음","title":"제주의 마을 시리즈16 표선리","sub":"섬 동남부의 중심마을","author":"오성찬","abs":"지난 1년반여의 오랜 진통 끝에 오늘 우리 표선리향토지가 탄생하게 된 것을 매우 반갑게 생각하며 보람을 여기는 바입니다. 제주섬의 동남단 중심지이며 600여년 역사가 있다고 여겨져 온 표선리는 앞에 광활한 표선해수욕장이 있고. 뒤에는 매봉이 병풍을 두른 듯 지켜주고 있어 그 동안 이 지역 상권의 중심지로 발전을 거듭해 왔습니다. 더구나 이번의 조사과정에서 신석기시대의 유물이 출토되어 마을의 역사를 훨씬 먼 옛날로 거슬러 올려놓은 것은 우리에게 긍지를 더해 주고. 향토지 편찬의 의의마저도 깊게 했다고 하겠습니다. 우리 원로회가 조사를 책임맡아서 작업을 벌여온 지난해 봄 이후 1년 동안 우리는 이런 마을의 역사적 사실 외에도 민요와 전설. 민속 등 우리 선인들의 삶에 대해 한 가닥이라도 더 수집하려고 애써 왔으며. 이제 이것을 정리하여 후대에 전하려 합니다.","body":"우리가 역사를 정리하는 이유는 우리 선조들이 어떤 삶을 살아왔는가 방식과 뿌리를 밝히고. 그 중 슬기롭게 잘한 사례들은 후세에 계승하고. 잘 못한 실수들은 이것을 고쳐 바로잡으려 하는 데 있습니다. 긴 역사 동안 여러 고비에 많은 사람들이 그런 뜻을 세웠으나 이루지 못했던 것으로 우리는 압니다. 그러나 600년 동안에 이제 비로소 우리는 마을의 역사책을 갖게 되었습니다. 물론 처음 정리하는 것이라 부족한 부분도 있고 흠도 많을 것입니다. 그러나 우리 속담에 첫 술에 배 부르랴는 말이 있듯 이것을 기초로 하여 부족한 부분들을 보태고 잘못된 부분들을 다듬어 나간다면 머잖아 훌륭한 마을의 역사책이 완성될 것입니다.","ref":"해당없음","pub":"도서출판 반석","date":"2002-12-30","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=937","zip":"63628","addr":"제주특별자치도 서귀포시 표선면 표선리 2441-9"},{"id":941,"name":"섯알오름","lat":33.205605,"lng":126.281085,"theme":"fort","cat":"민속","d1":"기타","d2":"해당없음","title":"갇힌 울음 열린 소리","sub":"해당없음","author":"오성찬","abs":"아버지는 보재기를 겸한 소작농이었다. 집안 살림은 당시 우리 형제들을 공부시킬 만큼 넉넉한 편이 못돼서 위로 두 형과 밑의 누이동생까지 4남매 모두 학력이 \u0027국졸\u0027로 끝나야만 했다. 낫 놓고 기역자도 몰랐으나 나름의 철리를 터득하고 계셨던 아버지는 지금 생각하면 더러는 \u0027배운자\u0027들에 대해 혐오감마저 가지셨던 듯하다. 우리 형제들이 책상머리에 앉았으면 \u0027공부가 밥먹여 주느냐\u0027며 불호령을 내리시곤 했던 것이다. \u0027산수의 천재\u0027라는 소리를 소학교 시절에 들었던 바로 위의 형도 그랬지만. 나 역시 \u0027돈은 내가 댈테니 중학교를 보내기만 해달라.\u0027는 당시 담임이셨던 여선생님을 아버지는 \u0027내 자식 내가 알아서 가르친다.\u0027는 면박으로 거절하셨다. 국민학교 때 같은 반 아이들이 교복을 입고 4km 거리의 서귀포중학교를 향하여 갈 때 소의 고삐를 끌고 들판으로 나가야만 했던 소년기의 나는 가슴에 멍울을 키우며 살아갈 수밖에 없었다. 내가 4.3을 직접 목격하고 실감한 것은 내 나이 여덟 살 때였다. 사건이 일어난 해인 1948년 10월. 추수가 거의 끝나갈 시기였는데 어느 날 무렵 한떼의 군인들이 우리 마을을 포위 공격하는 과정에서 동네사람 셋이 죽고 모자가 총상을 입었다. 우리 집은 마을의 초입에 있었으므로 이 날 저녁의 살벌했던 장면은 일생동안 나를 쫓아다녔다. 1969년께 연작 \u003c탐라인\u003e의 한 대목으로 쓴 단편 \u003c하얀 달빛\u003e은 이 날의 기억을 거의 사실적으로 쓴 것이다. 그러나 나는 그 후 첫 작품집 때 당한 후유증으로 이 문제에 대해 의도적으로 외면하고 있었다. 그러다가 《마을 시리즈》를 위해 조사하다 보니까 어느 마을에서나 가장 절실하게 부딪쳐오는 것이 이 4.3문제였다. 마을마다 피해가 엄청나다는 것도 실감했다. 언론이 경색돼 있던 이 무렵 이 문제의 거론은 물론 금기사항이었다. 그러나 나는 은밀히 자료를 모으고 있었는데. 4.3 40주년(48년)을 맞은 날 새벽 문득 작가적 양심상 올해도 그냥 스쳐 보낼 수는 없다는 자책감을 느꼈다. 그래서 부랴부랴 정리해 낸 것이 그 해 4월 《신동아》에 게재된 \u003c40년 제주의 한. 4.3사건의 진상\u003e이다. 그러고 나서 피해자들의 증언을 모아 《한의 통곡소리》라는 책으로 묶어내기도 한 것이다.","body":"제주도의 소위 ‘4.3사건’이 일어난 것이 1948년 4월 3일. 이 달로 꼭 만 40년이 된다. 이 40년 동안 이 사건은 외국인 존 메릴을 위시한 몇 사람에 의하여 단편적으로 거론된 적이 있을 뿐. 한 번도 전체적으로 조명된 바 없다. “지난 40년간. ‘4.3의 역사’는 지워진 것이 아니라 쓰여지지 않았으며. 잊어버린 것이 아니라 잊기를 강요당했을 뿐이었다”는 주장이 실감있게 들릴 정도이다. 심지어 사망 인원 등 피해상황까지도 그 동안의 기록은 각각이었다. 김남식의 \u003c남로당\u003e과 제주도가 발행한 \u003c제주도\u003e8호가 인명피해를 8만65명으로 기록하고 있는가 하면. 하성수의 \u003c남로당사\u003e는 살상 인원을 8만5천여 명으로. 좌익사건에서 쓴 김봉헌의 \u003c濟州道 血の　歷史\u003e는 7만명으로. 1960년 당시 제주도 국회의원 김성숙은 국회에 제출한 \u003c제주도 양민학살 건의안\u003e에 5만 명으로. 또 1956년판 \u003c한국편람\u003e은 4만여 명으로. 존 메릴은 그의 \u003c제주도 반란\u003e에서 ‘최소한 당시 도민의 10%인 3만명은 죽었을 것’으로 추정하고 있다. 1982년 제주도가 발행한 \u003c濟州道誌\u003e는 사망자를 2만7천7백19명. 중상을 1천80명. 행불 38명 등으로 기록하고 있다. 지난 2월 25일 제6공화국의 출범을 앞두고 민주화합추진위원회는 “8년 전에 있었던 ‘광주사태’에 대해서 정부가 사과하고 명예회복과 보상 등으로 8년 응어리를 풀어야 한다.”는 내용의 \u003c광주 사태 치유방안 건의문\u003e을 제출한 바 있다. 이런 ‘화해무드’를 타고 거창사건유족회원 2백여 명도 지난 2월 15일 거창 현지에서 6.25동란 중 국군이 거창군 신원면 일대에서 공비를 토벌하면서 주민 7백19명을 공비와 내통한 것으로 오인. 집단 학살한 사건을 해결해 달라는 결의대회를 갖는 등 정식으로 이 사건을 들고 일어섰다. 그러나 이 같은 정부 차원의 과잉진압과 학살의 최초의 예는 아무래도 ‘4.3사태’로 생각된다. ‘40년의 한’을 풀려고 제주도에서 함덕리와 토산리의 일부 주민들이 대정부 진상의 기미를 보이고 있다. 또한 근년에 들어서는 학생들이 이 사건에 관심을 보이고 있고. 자료집(도서출판 온누리의 ‘제주도 4.3항쟁의 기록’)도 발간되는 등 40년 동안 묻혔던 역사가 새롭게 조명될 시점에 있다.","ref":"해당없음","pub":"도서출판 눈","date":"1991-07-10","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=941","zip":"63530","addr":"제주특별자치도 서귀포시 대정읍 상모리 1618"},{"id":946,"name":"외도 월대","lat":33.49251,"lng":126.43574,"theme":"sea","cat":"민속","d1":"기타","d2":"해당없음","title":"제주시 통권 제7호","sub":"해당없음","author":"제주시","abs":"행정란에는 「향방」관계를 주로 하여 시일주도로 포장. 토지구획정리사업. 주민소득문제등 제주시행정의 당면문제를 중점적으로 다루었다. 학술란에는 「경제」문제를 특집형식으로 엮었는데. 제대 상학부 교수진의 협조를 얻은 셈이며. 앞으로도 이 학술문제는 부문별로 제주도문제와 관련시켜 다루어 볼 생각이다. 이번 호부터 특수연재물로서 「탐라기년」의 번역을 실리게 되었음을 기뻐한다. 제주도 사과가 현대화된 것이 하나도 없는 이러한 아쉬운 처지에서 이 정도의 번역사업만이라도 햇빛을 보게 되었다는 것은 다행한 일이다. 선친의 역자를 손수 책임 번역 해주신 김계연씨에게 거듭 감사를 드린다.","body":"제주시 관내 삼양 ~ 외도간 일주포장이 이제 실현을 보게 되었다. 본도의 일주도로 포장에 앞서서 제주시 포장만이라도 하루 속히 이루어져야 한다는 시민의 열띤 소망은 벌써부터 행정의 중점사업으로 착안되고. 드디어는 추진체까지 마련하여 재원확보를 비롯한 온갖 방법을 예의 검토하고 있었던 사실을 시민 모두는 이미 잘 알고 있던 터이다. 그것이 이제 모든 애로를 무릅쓰고 햇빛을 보게 되어. 이 4월 중순부터 7월 중순까지는 삼양 ~ 외도간 총연장 10·5㎞의 완전포장을 예산 4천 3백만원을 들여 실현하게 되었다는 것은 다중적인 의미에 있어서 매우 기뻐해 마지않을 일이라고 생각한다. 사업의 내용인즉. 시내도심지 ~ 삼양간 5·3㎞선은 시발주로 실시하게 되고. 도심지 ~ 외도간 5·2㎞선선은 도 직영으로 각각 4월 중순부터 착공하게 되었는데. 삼양선의 경우는 해수욕 계절인 7월 중순까지는 완성해 놓을 목표아래 벌써부터 주민들의 골재재취를 서두르고 있는 형편이다. 이에 앞서 시에서는 작년부터 제주시일주도로 포장추진위원회를 민간체제로 구성하고 소요예산을 확장 국고보조와 시비를 제외한 자체부담액 20%를 조달하기 위해서 온갖 노력을 다하고 있었다. 공무원들의 급료에서 매달 50원씩을 갹출하게 된 것을 시범으로 하여 재일교포. 요식업소. 운수업 학생들까지도 모두 나서서 이 역대의 숙원사업을 실현을 위해서 일치된 열망을 집주하고 있었던 것이다. 이는 췌언할 필요도 없이 본도 관문도시로서의 일차적인 체면유지를 위해서도 마땅한 건설 사업일 뿐만 아니라. 각종 산업의 신속한 소비유통을 위해서나 더 나아가서는 제주도일원의 완전포장을 촉진시키기 위한 그 자극제가 되게 하기 위해서도 매우 고무적인 사업이라고 할만도 하다. 더욱이 관광적인 일면으로만 보더라도 이 포장도로는 천금의 가치를 발휘하게 될 터인즉. 제주관광의 센터가 되고 있는 시 중심가를 비롯하여 여름철의 해수욕장에 이르는 삼양어간이나 제주공항을 지나 외도월태. 이호해수욕장을 거느린 이 제주시관내를 완전히 포장해 놓는다는 일은 외래객을 위한 우리의 수입태세의 확립을 위해서도 참으로 뜻있는 일이 아닐 수 없다. 이 도로가 완성되면 주민의 국도보수의 노력이 근본적으로 덜어질 뿐만 아니라. 각종 운수업계의 소비절약은 물론 이용자들의 정신위생에도 현저한 개선이 있게 될 것이며 주민들의 경제유통의 수익성에도 상당한 변화가 자초하게 되리라고 확신하는 터이다. 이와 같이 다면적인 이점을 지니고 있는 이 삼양 ~ 외도간 도로포장이 이 4월 중순부터 7월 중순까지는 거의 완전한 포장을 보게 된 것이니 시민 모두가 기뻐해 마지않을 일이다. 구만시민 모두는 이 역사적인 숙원사업을 기일 내에 효율적으로 실시하기 위해서 전폭적인 협조와 성원을 보내주기 바라며. 특히 몽리 주민인 삼양 화북 도두 이호 동민들은 누구보다도 앞장 선 열도로써 이 획기적인 사업이 동민들의 노력에 의해서 하루라도 앞당길 수 있도록 일층 분발해 줄 것을 거듭 당부하는 바이다.","ref":"해당없음","pub":"제주시","date":"1968-04-08","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=946","zip":"63071","addr":"제주특별자치도 제주시 외도이동 2552-7"},{"id":1008,"name":"외도천","lat":33.491981,"lng":126.435182,"theme":"water","cat":"민속","d1":"기타","d2":"해당없음","title":"제주시 통권 제19호","sub":"해당없음","author":"제주시","abs":"시민 여러분도 아시다시피 우리 제주시의 긴급과제가 간선도로의 확장 외도천 용수개발 제3지구 토지구획정리와 아울러서 농어촌의 균형발전에 있다는 사실은 누구도 부인할 수가 없을 것입니다. 우리 온 시민은 이러한 당면과제를 하루 속히 처리해 나가는데 노력해 주어야 하고 시민복지를 향한 일치된 시민적 각성은 자율적인 시정참여를 통해서 전폭적 협조 성원의 체제로 나타나 주기를 충심으로 기대해 마지않습니다.","body":"분발과 새로운 결의에 넘칠 소망의 새해를 맞이하여 본인은 먼저 시민 여러분의 가정마다 한없는 번영과 다복이 깃드시기를 충심으로 기원하는 바입니다. 돌이켜 보면 지난 해는 국내외적으로 격동과 긴장된 변화가 연쇄적으로 일어난 일 년이었으며 그에 따른 우리 시민적 각성이나 협조적 총화체제가 더욱 공고히 다져진 한 해였다고 확신합니다. 이러한 현실적인 어려운 긴장 속에서도 우리 제주시에 있어서는 시민총화의 각성을 거듭 촉구하면서 현시점에 처한 새로운 국가관의 정립에 주력하는 한편 소기했던 도시건설사업과 농어촌 개발사업에 충분한 목표성과를 거두었다고 확신하는 바입니다.","ref":"해당없음","pub":"제주시","date":"1972-02-29","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=1008","zip":"63074","addr":"제주특별자치도 제주시 내도동 640-05"},{"id":1047,"name":"신청사","lat":33.255528,"lng":126.510438,"theme":"fort","cat":"민속","d1":"기타","d2":"해당없음","title":"서귀포시 통권 제4호","sub":"해당없음","author":"서귀포시","abs":"시제 실시 13주년을 맞는다. 처음 그러했던 것처럼 늘 새로운 마음이고자 했다. 신시가지에 신청사가 우뚝 세워짐으로해서 이 땅에 또 하나의 세계가 탄생되었다. 언제나 열린 마음으로 걸어가야 하리라. 푸른 꿈을 간직하고 용솟음치는 힘을 모아 빛나는 일을 개척하고 \u003c창조의 자치시대\u003e를 이끌어가는 주민의 역할을 다해 주기를 기대한다. 시민과 시점이 한목소리로 밝은 내일을 합창하고 지역발전을 위해 선구자적으로 헌신해 나갈 때 우리시는 활력이 넘치는 복된 땅으로 용트림하게 될 것이다.","body":"우리 모두가 서 있는 이 자리는 지금으로부터 약 580년전 시청사 뒤에 우뚝 솟은 고근산을 기점으로 하여 대정현과 정의현이 나눠졌던 역사적인 경계선이었습니다. 또한 13년전 우리는 서귀읍민과 중문면민이 하나가 되어 서로 손에 손을 잡고 이 경계선에서 서귀포시민으로서 하나가 되는 서귀포시의 새로운 시대를 열었습니다. 이제 그 자리에 동서의 화합을 다지며 다시 시민의 자존인 새 청사를 세웠습니다. 민족의 영산 한라의 드높은 기상이 뻗어 내리고 태평양 푸른 물결이 한눈에 펼쳐지는 이 전원도시에 신청사가 우람한 모습으로 탄생된 것은 우리 모두의 큰 자랑이요 보람인 것입니다. 우리는 그동안 시로 승격되어 13년의 연륜을 쌓아 오면서도 읍사무소였던 낡고 협소한 건물을 시정의 살림집으로 사용해 왔습니다. 이것은 우리나라의 대표적인 아름다운 도시로 웅비하고 있는 서귀포시의 위상과 시민들의 기대에도 어긋나는 일이었습니다. 때문에 활기차게 뻗어가는 서귀포시의 모습에 걸맞는 시정의 전당을 세우는 것이 시민 모두의 한결같은 염원이었습니다. 마침내 소망이 튼튼한 초석으로 놓여지고 한 장 한 장의 탑처럼 쌓아 올려짐으로서 시민들의 자존을 상징하는 전당이 웅대한 모습을 드러내게 되었습니다. 이제부터 우리는 이 시정의 산실에서 맑고 힘찬 미래를 설계하고 지도의 선과 색채를 바꾸는 번영의 신화를 창조하는데 헌신의 힘을 쏟아 나갈 것입니다. 우리는 이제 한반도 남녘의 변두리가 아니라 신한국의 얼굴로 떠오르는 자랑스러운 전원 관광도시를 만들어 가고 있습니다. 우리가 힘을 모아가면 2천년대 초에 세계인들이 동경하는 관광의 이상향을 만들 수 있을 것입니다. 우리 공무원들부터 날로 새로워지는 \u003c지성감민\u003e의 시정을 펴면서 시민들의 마음속에 믿음과 희망을 심어나갈 것을 약속합니다. 일찍이 제주도민들의 생활을 풍요롭게 엮게 했던 감귤원의 진원지인 이 전원도시를 활력이 넘치고 번영의 교향악이 울려 퍼지는 중심무대가 되도록 하겠습니다. 서귀포시가 국제화 시대의 관광도시로서 활력이 넘치는 발전을 이룩해 나가기 위해서는 무엇보다도 시민 여러분의 절대적 협조가 필요합니다. 쾌적한 삶의 터전이 되고 풍요로움이 넘치는 도시는 저절로 만들어지는 것이 아니며 국정의 노력만으로 건설될 수 있는 것도 아닙니다. 시민 모두가 앞장서서 참여하고 이루고 가꾸어 나가야 합니다. 시민 여러분은 더욱 살기 좋고 자랑스러운 서귀포시를 만들기 위해 내가 할일이 무엇인가를 생각하고 실천하는데 앞장서 주시기 바랍니다.","ref":"해당없음","pub":"서귀포시","date":"1994-07-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=1047","zip":"63565","addr":"제주특별자치도 서귀포시 법환동 731"},{"id":1090,"name":"한북교","lat":33.46694,"lng":126.516072,"theme":"fort","cat":"민속","d1":"기타","d2":"해당없음","title":"한라산의 하천","sub":"한라산총서 11","author":"제주도/한라산생태문화연구소","abs":"본서에서는 한라산에서 발원하는 여러 하천들에 대하여 하천이 갖는 자연적·인문적 지리특성을 다루었으며. 각 주요 하천들과 마을과의 관계. 유역의 문화유적과 식생에 중점을 두었다.","body":"지표에 내린 강우는 식물이나 지표 위의 다른 물질들의 표면을 적신 후 지하로 침투하게 된다. 강우의 침투율은 토지이용. 토양의 특성과 수분량. 강우의 강도와 지속시간 등에 따라서 달라진다. 사질토양의 삼림에서는 시간당 25mm가 침투될 수 있지만 점토질 토양의 경우 시간당 수mm가 침투되며 사질토양이라도 농경지로 이용되는 경우 침투율이 산림지역보다 작아진다. 단위시간당 내린 강수량이 침투율보다 높은 경우에는 빗물이 경사진 지표면을 따라 낮은 곳으로 흘러내려(지표유출이라 함) 하천을 통해 바다로 이동한다. 한편 토양에 침투된 물중에서 일부는 지하로 계속 이동하여 지하수가 부존되어 있는 대수층에 도달하게 되며. 대수층에서 지하수는 아래로 또는 옆으로 이동하여 산사면이나 샘으로 배출되거나. 하천이나 해양의 바닥으로 스며나온다. 따라서 하천을 통한 유출은 지표유출이나 지표하유출 그리고 지하수유출에 의해 하천에 도달한 물이 경사진 하천을 따라 표고가 낮은 곳으로 흘러가는 것이라고 할 수 있다. 제주도에서는 대부분의 하천이 평상시에는 건천이며 많은 양의 강우가 내렸을 때 지표유출이나 지표하유출에 의해 2~5일간 유출이 발생한다. 또한 하천의 하류 일부 구간에서 지하수유출에 의해 하천유출이 발생한다.","ref":"권혁재. 지형학. 1990 외 다수","pub":"제주도/한라산생태문화연구소","date":"2006-04-05","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=1090","zip":"63147","addr":"제주특별자치도 제주시 오라이동 43-16"},{"id":1094,"name":"석굴암","lat":33.402782,"lng":126.501978,"theme":"faith","cat":"민속","d1":"기타","d2":"해당없음","title":"제주도 통권 제14호","sub":"해당없음","author":"제주도","abs":"제주도의 종합개발계획이 내외의 시청을 모으며 하나의 붐을 일으키고 있다. 이 고장 주민들의 오랜 시일을 두고 염원해 오던 원대한 꿈이 바로 지금 우리 문턱에 위치한 것이다. 이의 현실적인 구현은 정부의 절대한 힘에 달려 있는 것이겠지만. 30만 도민의 일치된 열의가 보다 앞장서야 되고 해외 본도출신 교포들까지도 충분한 협조의 손이 닿아야 할 줄 안다. 이번호에는 이와 같은 본도의 내일의 웅비를 널리 알림에 앞서 그 중추된 구상과 전망같은 것을 소개하기로 했고 그에 따라 같이 논의될 수 있는 향토문화개발에의 기계의 제언도 함께 모아 넣었다. 모두 다 이고장의 내일을 위해 힘을 기울이려는 좋은 발언들이라고 믿는다. 본도의 민속. 무속. 방언같은 것은 아무리 해도 천금의 우리의 학술자원이다. 기학도들이 자각적인 연찬 태도가 믿음직하며 그 연구결과를 족족 발표시킬 수 있는 기능을 「제주도」지가 담당할 수 있는 것도 다행한 일이다. 이달에도 현용준. 송석범씨를 비롯한 여러 민속학회원들의 역고를 실었고 또한 최현식. 강통원. 이씨의 문제작 그 밖에 시내 국민학교 여교사와의 좌담회 기사 등을 알차게 담아 꽤 다채로운 심포니를 이룬 셈이다. 아무튼 제주도의 분질을 본질적으로 입체적으로 널리 강보 절개하는 큰 사명이 「제주도」지의 짐이 되고 있다. 이번 호부터 편집실에 홍순칠군이 들어오게 되었다. 잔뜩 일손이 모자랐던 편집실에도 이젠 큰 힘이 생기게 되어 기쁘다. 다음 6월호의 인쇄입찰을 또 곧 붙여야 하겠는데. 일부업자들의 애향적인 협조 있기를 바란다. 발표지 하나 없는 이 고장의 문화적 빈곤을 극복하기 위한 본지는 내일의 보람찬 유산을 위한 도의 희생적 사업인 것이다. 업자의 특실이 별로 없음을 모르는 바 아니로되 당 이 행위만을 자행하며 사업추진에 적지 않은 차질을 가져오게 하는 사례나 없도록 해주었으면 좋겠다. 다 제 집안일이기 때문이다.","body":"제주도라면 이내 돌이 많고 바람이 많고 여자가 많은 섬을 생각하게 된다. 사실 이조때는 죄인의 유배지였고. 가깝게는 부패한 정객들의 제물로서 마치 버림받은 이국의 땅처럼 취급되어 왔다. 그러나. 제주도의 역사는 1961년 5월 계기로 개도이래 처음 보는 근대화의 작업이 전개되었다. 즉 「속령」이 아니라는 「본토」요 「호기심의 대상」이 아니라 「행정의 대상」으로 새 시대의 각광을 받기 시작한 것이다. 그리하여 지난 3년간. 바람과 돌과 여자가 많다는 삼다의 섬은 이제 「재물」 「자원」 「아름다움」의 뜻으로 변해져 가고 있으며. 문자 그대로 비약적인 발전의 토대가 마련되어 가고 있다. 제주시 간선도로 포장. 한라산횡단도로 포장 등 도로의 정비확충을 비롯하여 중산간 부락에 수돗물이 공급되고 있으며. 사. 삼사건 이재민들을 원주지에 복귀시켰으며. 고구마. 유채 등의 환금작물 증산으로 농가소득을 향상시켰으며. 또한 제주 ~ 부산 제주 ~ 목포 간에 최신식 여객선이 취항하였으며. 이 외에도 육지부와의 무선전화 개통. 관광시설의 대폭적인 확충 등. 이상도 건설을 목표하는 여러 가지 작업이 줄기차게 진행되어 가고 있다. 그것은 종전. 제주 ~ 서울 간을 주에 세 번밖에 왕래하지 않던 여객기가 오늘날은 매일 2회씩 왕래하여도 언제나 만원으로 붐비고 있다는 사실만으로 보더라도 본도의 비약적인 발전상을 알기에 족할 것이다. 그러나 보다 더 긴 안목으로 전도를 내다 볼 때 지금까지의 작업은 정초적인 것에 불과하며. 본도가 지니는 모든 자원도 최대한으로 종합 개발할 새로운 출발점에 임했다고 보아서 좋을 것이다. 물론 제주도개발의 제창자이신 박대통령각하의 고무와 격려도 있었지만 우리가 개발목표 ㅡ 「제주도건설종합계획(안)」ㅡ을 수립하고 이의 강력한 추진을 정부에 요청하게 된 데에는. 이를 뒷받침 할 자연 및 자원의 배경이 있는 것이다.","ref":"해당없음","pub":"제주도","date":"1964-05-06","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=1094","zip":"63088","addr":"제주특별자치도 제주시 노형동 산 20"},{"id":1172,"name":"어승생","lat":33.396057,"lng":126.489417,"theme":"oreum","cat":"민속","d1":"기타","d2":"해당없음","title":"제주도 통권 제49호","sub":"해당없음","author":"제주도","abs":"황금색으로 누리에 수(繡)놓아 꿀내음 풍기던 유채(油菜) 꽃. 정녕. 이는 제주도에서만이 보고 느끼는 비원(秘苑)이 아닐수없다. 그 꽃이 지고 결실의 잉동(孕動)이 있는가 하니. 이제는 한라산 기슭 2백고지 아래 백옥(白玉) 같은 유자(柚子)꽃 감귤(柑橘)꽃 송이송이 귤향(橘香)이 그윽하다. 「산은 옛 산이로되 물은 옛 물이 아니로다.」 이것은 정(靜)과 동(動)을 헤아리고 정중동(靜中動)의 가변성을 의미한다. 그렇듯 이 고장에도 「5·16」이후 즉 60년대에 접어들면서부터 문화. 사회. 경제 등 온 분야에 비약적 발전을 이룩했다. 정부의 홍은(鴻恩)의 손길에 근검. 검소하고 자주성이 강한 도민성이 뒷받침이 되어 화음을 이룬 소산이라고 단정하는 바이다. 이번호의 제1특집을 「5·16후의 제주도」로 잡고 어제와 오늘 그리고 내일의 중단 없는 전진을 꾀하였다. 제2특집으로 40만도민의 길잡이가 되고 같이 호흡하는 일선 행정의 공약된 사업을 간추렸다. 시리즈로 엮어지는 「제주도 3제」는 이번호에는 방언. 민속. 무속으로 다루어 이 고장 생활풍토의 편력과 조상이 남기고 간 슬기로움을 흠모(欽慕)해 봄이다. 「제주도」지를 아끼어 옥고(玉稿)를 보내주시는 여러 선생에게 거듭 감사를 드린다. 이번호의 표지는 견월악(犬月岳)을 택했다. 지난해 NBS 남양TV 안테나가 세워지고. 이번에 KBS 제주방송 TV안테나가 나란히 견월악 봉우리를 지키고 있다. 이것은 전진하는 이 고장의 기상이며 우리 도민의 귀와 눈이기도 하다.","body":"오늘 제주방송국이 10kw로 출력을 강화하고 중앙방송국 TV중계소를 설치하여 그 개국을 보게 되는 성전(盛典)을 본인은 40만 도민과 함께 충심으로 축하하는 바입니다. 더구나 오늘의 개국을 보게 해 주신 신범식문화공보부장관을 대리하여 홍경모문화공보부차관께서 직접 왕림하셔서 저의 도민에게 축복을 주신데 비하여 감사를 드립니다. 그동안 제주방송국은 불비한 시설을 운영하면서도 항상 도민과 함께 생활하면서 필요한 지식과 신속 정확한 보도로서 도민의 벗이 되고 길잡이가 되어 왔습니다. 특히 지난해 「빌리」호 태풍 시에는 도내의 통신이 두절되어 당황하고 있을 때 철야방송을 통하여 도민의 귀가 되어주었고. 연말의 「남영호」 조난사고 시에도 직접간접 유족의 등불이 되어 아픈 가슴을 달래고 위로하여 그들을 어둠속에서 건져주는 중요한 역할을 아끼지 않았던 것입니다. 이와 같이 도민과 같이 웃고. 같이 서러워하면서 성년(成年)이 되어 왔습니다. 이제 본 방송국이 10kw로 시설이 증강되고 TV가 개국된다는 이 획기적인 사실은 확실히 도민의 기쁨이요. 또 동시에 우리도(道)의 또 하나의 발전의 거보인 것입니다. 우리 제주도는 분명히 말씀드려서 지난 10년 동안에 도(道) 다운 면목을 찾았고 발전도 5·16후에 비롯되었습니다. 육지에서 멀리 떨어져서 낙도의 후진을 벗지 못하고 있던 우리 제주도가 5·16혁명 후에 부각되기 시작하였으니. 먼저 「5·16도로를 개통 포장함으로써 제주. 서귀를 연결하는 간선동맥을 이루게 하였고 그후 「물 문제」를 해결하기 위한 어승생(御乘生) 수원개발은 우리 박대통령각하께서 제주도민에게 물을 주기위하여 친히 구상(構想)하신 특별선물이었던 것입니다. 그리고 중산간도로. 제2횡단도로. 동서부산업도로의 개통과 지난 해 베풀어주신 일주도로의 포장으로 이제는 도내의 국도는 80%가 포장을 하게 되어 교통에 일대혁신을 가져왔고 물 문제는 금년도에 기공한 강정천(江汀川)과 외도천(外都川) 개발과 병행 진행시키는 지하수개발이 완료되면 상수도는 물론 농업용수에 까지 수리(水利)의 혜택을 보게 될 것입니다. 전기(電氣) 사정도 전국 평균을 상회(上廻)하는 40%의 혜택을 줄 수도 있다는 것입니다. 해방 후 10년 동안에 일약 국민소득이 2백20 달러를 상회하는 중진국대열에 들어섰고. 수출고 10억 달러를 초과 달성하기까지에는 우리 정부나 국민이나가 한 덩어리가 되어서 피땀 흘려 노력한 결과라는 것을 잊는다면. 우리가 앞으로 3차. 4차 5개년계획을 통하여 상위급(上位級)중진국을 지향하는 우리의 소망을 안일의 터전 위에서 바라다가 과거의 쓰라림을 되풀이하고 십년적공(十年積功)을 수포에 돌리지나 않을까하고 염려도 되는 것입니다. 우리는 이제 막 시동(始動)이 걸리기 시작한 근대화의 수레를 여기서 멈출 수는 없는 것입니다. 여기서 수레바퀴를 멈추게 했다가는 다시 시동시키는데 그 이상의 노력이 필요한 것입니다.","ref":"해당없음","pub":"제주도","date":"1971-05-15","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=1172","zip":"63077","addr":"제주특별자치도 제주시 해안동 산220-12"},{"id":1378,"name":"삼천서당","lat":33.513683,"lng":126.528308,"theme":"fort","cat":"민속","d1":"기타","d2":"해당없음","title":"제주도 통권 제40호","sub":"해당없음","author":"제주도","abs":"1969년을 기하여 미곡의 자급자족은 기필코 성취하여야 할 것이며. 단위 증수를 위하여 병충해 방제의 의의와 필요성은 어느때보다도 가장 긴급하고 어느 요인보다도 효율적임이 명백해졌다. 증산을 위한 밀식다비집단재배의 뒷받침 아래 성공적으로 이루어졌으며 병충해 방제의 여건도 갖추어져 획기적인 방제작업이 수행될 수 있게 되었고 병해충 발생 예찰은 지도원들의 철저한 관찰로 이루어졌으며 농약 값의 인하와 부정농약 단속철저 및 공급방법의 개선 등으로 농민의 인식이 촉구되었고 방제작업은 행정지도 농협 등 유관기관의 적극적인 참여하에 재배단지 및 리. 종별 방제반과 농민들의 노력으로 종자소득 묘판방제. 본담방제 등에 철저를 기할 수 있었으므로 본도에서도 근래 없던 풍작이 예상되며 앞으로 관민의 일심동체가 되어 미곡증산을 밀고 나간다면 70년도에는 자급자족이 무난할 것으로 확신한다.","body":"정부에서는 1969년 이후 쌀의 자급자족을 위하여 여러가지 중점시책을 실시하고 있으며 그 대표적인 것으로는 수도 집단 재배가 있다. 여기에는 비료가격 인하를 비롯하여 농약가격인하 및 보조 병충해 방제. 농업용수개발 등을 들 수 있는데 그 중에서 병충해 방제 하나만으로도 종례 10a당 313kg의 수량을 370kg로 올려 약15%의 증수는 가능하기 때문에 방제비 5~10억원 내외의 투자로 방제에 총력을 경주하고 있음을 우리는 목견하고 있는 바이며 농업국이면서도 매년 식량이 부족하며 50~80만톤의 쌀을 도입하고 있음이 현실이라 하겠다. 병충해 방제만으로 이러한 부족의 생산량 확보와 외화소비를 막아 낼 수 있을 뿐만 아니라 50~100억 원 정도의 방제비 투자로 300억 원 이상의 증수효율을 높여 식량증산과 아울러 농가소득 증대에 기여할 수 있도록 농가 소득 증대에 기여할 수 있도록 하고 있음을 볼 때에 농업경영에 있어서 병충해 방제가 얼마나 중요한가를 짐작하고도 남음이 있는 것이다.","ref":"해당없음","pub":"제주도","date":"1969-09-30","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=1378","zip":"63278","addr":"제주특별자치도 제주시 일도일동 1198-9"},{"id":1454,"name":"연북정","lat":33.540108,"lng":126.636119,"theme":"fort","cat":"민속","d1":"기타","d2":"해당없음","title":"제주도 통권 제91호","sub":"해당없음","author":"제주도","abs":"제주도는 지금 한. 소 정상회담 이후 국제적 관광지로서 세계인들이 동경하는 총아로 등장하고 있다. 제주는 실로 하늘이 내려준 천혜의 아름다움이 사철 넘치는 섬이다. 성스런 영봉 한라산을 가운데 두고 갖가지 동식물이 살아가는 수풀과 계곡. 형형색색으로 빚어진 천혜의 예술품과 같은 바위와 동굴. 기생화산. 분화구. 목장. 폭포수. 질펀한 백사장과 그림같은 섬들 그리고 감귤농장. 이러한 대자연의 조화와 더불어 독특한 문화와 습속이 아득한 옛날부터 맥박치며 섬을 지켜오고 있다. 그러나 이 탐라땅은 검은 바윗덩이와도 같은 고난의 역사가 깔려 있음을 안다. 울고 왔다. 울고 간다.는 속담은 제주의 지난날 어려움을 극명하게 드러내는 증언이다. 옛날 벼슬아치들이 제주에 배명을 받거나. 죄인들이 귀양살이 할 유형지로 정해지면 절해고도에서 각박하게 살아갈 자신의 처지를 자탄하며 울며 와서 생활하다 보면 제주민들이 베풀어 준 훈훈한 인심에 사로잡혀 돌아갈 때는 차마 그 두터운 인정을 뿌리치지 못하거나 아니면 더많은 슬픈 사연을 안고 가기에 울고 간다는 내용일지도 모른다. 이러한 연유는 제주가 수평선에 갇힌 섬이라는 사실에서 비롯된 것이다. 제주에선 어딜 가나 수평선이 따라다닌다. 돌아보아도 수평선. 또 돌아보아도 눈썹에 걸리는 것은 끝없는 수평선뿐이다. 그러기에 제주인들은 수평선을 숙명의 물마루로 인식해 온 것이다. 오죽해야 한라산을 창조했다는 거녀 설문대 할망의 힘을 빌어 제주와 육지부 사이의 해협에 다리를 놓으려고 꿈을 전설로 만들어 내었겠으며 이어도라는 상상의 섬을 강남 가는 물길로 띄워 놓고 물질을 하면서도 이어도 하면 눈물이 난다는 민요 가락을 뽑아내면서 이상향으로 삼았으랴.","body":"돌하르방이란 말은 해방 이후에게 우리에게 익숙해진 이름이다. 아직도 지역에 따라 그 이름이 우석목. 무석목. 벅수머리 등 여러 가지로 불리고 있는데. 이는 그 서 있는 위치가 기능. 그리고 해학적인 모습 등에서 연유된 듯싶다. 그 형상은 마치 절해고도에 유배를 왔던 어느 어진 선비의 모습 같기도 하고. 잠시 밭갈이를 멈추고 먼 수평선을 바라보는 우리 할아버지의 인자한 모습 같기도 하고. 비가 오나 눈이 오나 누군가를 끊임없이 기다리는 사람 같기도 하다. 그렇다면 돌하르방은 언제 어디서 무엇 때문에 한반도의 본토는 건너뛰고 유배와 질곡의 땅 제주에 찾아왔을까. 그리고 맨 처음 제주의 현무암에 생명의 숨결을 불어넣은 사람은 누구였을까. 이런 물음에 대해 역사적인 기록은 거의 찾아볼 수 없으나 종합해 보면 서기 1754년. 방제사의 발의에 의한 것이었다 한다. 건립동기. 건립시기. 명칭을 확실히 단정지을 수는 없다. 학자들 간에 유입경로에 대한 의견이 엇갈리는 것도 사실이다. 제주. 대정. 정의의 삼주현성에 세워졌던 석상들의 기능은 과연 무엇이었을까. 무엇 때문에 이 석상들은 삼주현성의 성문 밖에 서 있었을까. 이를 해명할 만한 문헌은 아직까지 찾아 볼 수 없으나 마치 성문을 보초하여 수호하듯 서 있다는 점에서 수호신적 기능을 했다는 추측이 가능하며. 축술 종교적 기능. 위치표식 등의 기능을 했을 것이라는 주장도 있다. 어쨌거나 돌하르방은 제주의 상징적 풍물임에 틀림없다. 거센 바람에도. 크고 작은 난리에도 그는 제주도민과 더불어 삶의 애환을 함께해 온 역사의 산증인이다. 그는 밤에도 왕방울 눈을 부릅뜨고 제주를 지켜온 파수꾼이다.","ref":"해당없음","pub":"제주도","date":"1991-12-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=1454","zip":"63331","addr":"제주특별자치도 제주시 조천읍 조천리 2690"},{"id":1533,"name":"검섯개","lat":33.548289,"lng":126.689591,"theme":"sea","cat":"민속","d1":"의식주","d2":"해당없음","title":"북제주군 문화유적분포지도","sub":"해당없음","author":"북제주군","abs":"본 지도에서 다룬 유적은 다음과 같다. 가린여원. 가문동바위그늘집자리. 감남답굴. 강림사터. 강창희가옥. 개랭이개. 건지굴. 개창원. 검멀레굴. 검섯개. 게여멀굴. 개옷샘굴. 게우두둑굴. 고내남당. 고내오름허릿당. 고내큰당. 고내리유물산포지1지구. 고내리유물산포지2지구. 고내리절터. 고내리지석묘. 고내리패총. 고내봉수. 고넹이굴. 고사리원개. 고산당목잇당. 고산자구내개당. 곽지사지. 곽지리포제단. 관음사터. 광려자원당. 금능리포제단. 금성알당. 금성리석축유적. 귀덕리제사유적. 금성리패총. 금악리포제단. 김녕비석군. 김녕성세깃당. 김녕큰당. 낙천본향당. 남두리원. 남두연대. 너부배원. 논깍원. 논알원. 다랑쉬동굴. 다려도제사유적. 당산봉수. 대림비석군. 덩개읏소. 도내봉수. 도파당개. 독개. 독진개. 돔베성창. 동개. 동귀성창. 동명개당. 동백동산. 동복본향당. 동복리동굴입구집자리. 동안경굴. 명월성지. 모살개. 모살원. 목수물굴. 문형도가옥. 묵은원. 바른알개. 박하르방개원. 배들인개. 배무숭이소금밭. 백병개. 변효정가옥. 보문사터. 불턱개. 비양도술일당. 비양도유물산포지. 비양도포제단. 사원이 소금밭. 산양리도요지. 상가리 포제단. 수산곰솔. 수물원. 송림굴. 세화일뤠당. 세화갯것할망당. 선흘1리포제단. 성굴. 소길본향당. 수산서목당. 쉰모살개. 쉿개. 신솟개. 신엄본향당. 신초비석군. 신촌리도대불. 신초리방사탑. 신촌향사. 쌍용굴. 씰물빌레소금밭. 아친개. 앞개. 애월해신제단. 애월진성. 어음비메닛당. 연북정. 예초리도대불. 영흥리산신당. 오상이원. 옥산이굴. 용수철새도래지. 용수리패총. 우미솟개. 원난이개. 월정성당. 월정리 포제단. 유수암 검은데기남당할망당. 유수암할망당. 육되기굴. 제주산굼부리분화구. 조랑개. 조롱굴. 조수본향당. 족은원. 조천비석거리. 조천진성. 종달리제사유적. 좌가연대. 지미봉수. 차귀도. 코짓개. 큰개. 큰물개. 큰원. 터웃개. 팔자굴. 펄개. 평대해신당. 평대리. 푸눈체굴. 하가리포제단. 하도각시당. 함덕산신당. 하도남당. 행원남당. 협재굴. 홍건이개. 황금굴. 흰모살개.","body":"문화유산은 우리 겨레의 삶의 예지와 숨결이 깃들어 있는 소중한 보배이자 인류문화의 자산입니다. 유형의 문화재와 함께 무형의 문화재는 모두 민족문화의 정수이며. 그 기반입니다. 더욱이 우리 문화유산은 오랜 역사속에서 많은 재난을 견디어 오늘에 이르고 있습니다. 그러므로 우리의 문화유산을 알고 찾아서 가꾸는 일은 곧 나라사랑의 근본이 되며 겨레사랑의 바탕입니다. 이번에 우리 북제주군이 제주대학교 탐라문화연구소에 용역의뢰하여 제작한 문화유적분포지도는 우리 지역의 소중한 문화유적을 보다 체계적으로 보존하고 관리해 나감은 물론 개발과정에서 무분별하게 훼손되는 것을 사전에 예방해 나가기 위한 목적이 있습니다. 북제주군 문화유적 분포지도에는 지정문화재 75건을 비롯하여 문화재적 가치가 있는 천연동굴. 봉수대. 연대. 포제단. 당. 원등 비지정 문화재를 포함하여 총 600여 건이 넘는 문화유적을 1/5만지형도에 나타내는 한편. 그 목록을 종류별. 지정문화재별로 일목요연하게 정리하였습니다. 이로써 북제주군지역에 산재해 있는 문화유적의 분포를 누구나 쉽게 상세히 알 수 있도록 함으로써 각종 개발사업의 시행단계부터 문화유적을 근본적으로 보호 할 수 있는 길이 열렸습니다.","ref":"립지리원 발행 1:5만지형도/제주도고고학연구/제주도유적/제주의 방어유적외 다수","pub":"북제주군","date":"2002-12-27","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=1533","zip":"63339","addr":"제주특별자치도 제주시 조천읍 북촌리 1193-3"},{"id":1635,"name":"건입동 칠머리당","lat":33.519063,"lng":126.548024,"theme":"faith","cat":"민속","d1":"민간신앙","d2":"당굿","title":"영등송별제배방선(영감놀이)","sub":"해당없음","author":"제주특별자치도","abs":"영감신들이 배방선을 한다. 건입동 칠머리당에서만 주로 행해진다.","body":"칠머리당굿에서는 배방선을 하기 직전에 영감놀이를 간단하게 연출하는데 이것은 다른 당의 영등굿에서 찾아보기 힘들다. 집에 환자가 있을시 영감신을 청해 환자를 영감신의 동생이라고 말하면 영감은 집나간 동생을 찾았다며 술을 주고받는다. 이후 서우젯소리에 맞추어 신나게 놀다가 짚배에 쌀. 물. 제주 명산물을 배에 가들 실으라고 하면 소미들이 무거운 물건인양 싣는다. 그러면 영감신들이 동생을 데리고 가는 양으로 그 배를 어깨에 메고 바깥으로 나가 배방선을 한다. \u003c발췌 : 제주도 무속과 그 주변 P98. 2002년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=1635","zip":"63284","addr":"제주특별자치도 제주시 건입동 387-6"},{"id":1779,"name":"귀덕리 포구(진질개)","lat":33.442541,"lng":126.279048,"theme":"sea","cat":"민속","d1":"생산기술","d2":"어로기술","title":"귀덕리도대불","sub":"해당없음","author":"제주특별자치도","abs":"귀덕리 속칭 진질개라는 포구에 위치하는 옛 등대이다.","body":"귀덕리 속칭 진질개라는 포구에 위치하는 옛 등대이다. 1930년경에 축조되었으며. 형태는 원통형이다. 현무암으로 쌓았으며 높이는 256cm이다. 도대불의 등화는 호롱불을 이용하였는데. 등화담당은 선창 가까이 거주하면서 일정한 생업이 없는 노인들로 하여금 담당하도록 하였다. \u003c발췌 : 북제주군 문화유적분포지도 P206. 2002년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=1779","zip":"63024","addr":"제주특별자치도 제주시 한림읍 귀덕리 991-5"},{"id":1790,"name":"고산리 자구내항 안쪽(돔베성창)","lat":33.309815,"lng":126.164941,"theme":"sea","cat":"민속","d1":"무속","d2":"신당","title":"고산자구내개당(입구전경)","sub":"해당없음","author":"제주특별자치도","abs":"고산자구내개당의 입구전경이다.","body":"고산자구내개당의 입구전경이다. 고산리 자구내항 안쪽에 있으며 시멘트 담으로 가려져 있다. 아직도 찾는 이가 많은지 깨끗이 관리가 되어있다. 큰돌을 쌓아 지반을 높인 뒤에. 제단은 물론 울타리와 바닥까지 시멘트로 축조했다. 현무암을 정교하게 다듬어 자그마한 당집을 만들고. 그 안에는 할망신을 조각한 석상을 앉혀 놓았다. 울타리 너머 잡목에 물색이 걸려 있다. 당신은 개당 한집이다. 자구내 개당 또는 선주당 할망당이라고도 한다. 어선.해녀를 관장한다. 제일은 매달 초하루. 보름이나. 현재는 초하루에만 다닌다. 제물로는 메 2그릇과 돼지고기를 포함한 음식을 올린다. 어업에 종사하는 이들이 모두 이 당에 다닌다. \u003c발췌 : 북제주군 문화유적 분포지도 P229. 2002년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=1790","zip":"63008","addr":"제주특별자치도 제주시 한경면 고산리 3616-15"},{"id":1904,"name":"중문 베릿내","lat":33.244128,"lng":126.419004,"theme":"oreum","cat":"민속","d1":"무속","d2":"신당","title":"베릿내개당(입구)","sub":"해당없음","author":"제주특별자치도","abs":"베릿내(성천포) 포구의 입구이다.","body":"베릿내(성천포) 포구의 입구이다. 입구는 나뭇가지에 가려 잘 보이지 않는다. 베릿내 포구의 해녀탈의장 옆에 있다. 높은 절벽 아래 자리 잡고 있는데. 관광객들이 자주 드나드는 곳이어서 천막을 친 상태이다. 제단은 온통 시멘트로 만들었다. 이 당에서는 붉은덕 일뤠할망을 모신다. 일렛당으로 제일은 6월 매 7일. 11월 매 7일이다. 바다일을 하는 어부들이 주로 모신다. \u003c발췌 : 서귀포 문화유적분포지도 P147. 2000년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=1904","zip":"63537","addr":"제주특별자치도 서귀포시 중문동 275-2"},{"id":1972,"name":"다끄네포구","lat":33.518406,"lng":126.500745,"theme":"sea","cat":"민속","d1":"무속","d2":"신당","title":"다끄네 해신당(외부)","sub":"해당없음","author":"제주특별자치도","abs":"\u0027다끄네\u0027 포구의 용담3동 어촌계 건물 옆에 있다.","body":"다끄네\u0027 포구의 용담3동 어촌계 건물 옆에 있다. 돌담에 시멘트를 바른 정방형의 좁은 공간 한 쪽에 \u0027해신지위\u0027라고 새겨진 빗돌을 세워 놓았다. 빗돌 옆면에는 단기 4294년 3월 3일 진흥회에서 세운 것이라 기록하였다. 단기 4294년은 서기 1961년에 해당한다. 흔히 \u0027갯당\u0027이라 한다. 다끄내 잠녀와 어부들이 모시는 당이다. 음력 2월 영등달 14일에 영등굿을 벌인다. \u003c발췌 : 문화유적분포지도 P78. 1998년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=1972","zip":"63114","addr":"제주특별자치도 제주시 용담삼동 1064-14"},{"id":2006,"name":"섯물","lat":33.519741,"lng":126.492711,"theme":"water","cat":"민속","d1":"의식주","d2":"주생활","title":"섯물내부(용담동)","sub":"해당없음","author":"제주특별자치도","abs":"섯물 내부의 모습이다. \u0027동물\u0027의 서쪽에 용천수가 있어 \u0027섯물\u0027이라고 한다.","body":"섯물 내부의 모습이다. \u0027동물\u0027의 서쪽에 용천수가 있어 \u0027섯물\u0027이라고 한다. 섯물 바로 동북쪽에 있다. \u0027섯물\u0027가까운 곳에 있기 때문에 \u0027섯물원\u0027이라고 한다.   섯물이 흘러내리고 밀물 때 밀려든 바닷물이 서로 만나 고여 물웅덩이를 이루는 곳이다. \u003c발췌 : 문화유적분포지도 P65. 1998년\u003e","ref":"문화유적분포지도","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2006","zip":"63114","addr":"제주특별자치도 제주시 용담삼동 2292-26"},{"id":2010,"name":"왕돌앞당","lat":33.510896,"lng":126.483389,"theme":"faith","cat":"민속","d1":"무속","d2":"신당","title":"왕돌앞당전경(도두동)","sub":"해당없음","author":"제주특별자치도","abs":"왕돌앞당전경의 모습이다. 몰래물 동네 바닷가 엉물동산 바위 아래 있다. 인위적인 시설물은 전혀 없다.","body":"왕돌앞당전경의 모습이다. 몰래물 동네 바닷가 엉물동산 바위 아래 있다. 인위적인 시설물은 전혀 없다. 다만 바위에서 자생하는 잡목 줄기에 물색이 걸려있을 뿐이다.  이 당에서는 서출노비 혹곰이 조곰이 영감또 1신위를 모신다. 구사수동 (몰래물)사람들이 공항 확장 공사로 말미암아 제성부락으로 이주해 가는 바람에 폐당 위기에 처했었으나. 아직도 다니는 사람들이 있다. \u003c발췌 : 문화유적분포지도 P66. 1998년\u003e","ref":"문화유적분포지도 P66. 1998년","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2010","zip":"63115","addr":"제주특별자치도 제주시 도두이동 2607 바닷가 앞"}
