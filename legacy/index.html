,{"id":2018,"name":"모살원","lat":33.50903,"lng":126.470635,"theme":"sea","cat":"민속","d1":"생산기술","d2":"어로기술","title":"모살원과동물원(용담동)","sub":"해당없음","author":"제주특별자치도","abs":"용담3동에 속한 \u0027어영\u0027이라는 외딴 동네 앞에 있는 모살원이다.","body":"용담3동에 속한 \u0027어영\u0027이라는 외딴 동네 앞에 있는 모살원이다. \u0027동물\u0027이라는 용출수에서 솟아 나온 담수가 동북쪽으로 흐르다 모여드는 15평 정도의 물웅덩이다.   그래서 \u0027동물원\u0027이라고 한다. 조간대 상층에 붙어 있으나 썰물에도 어느 정도 물웅덩이를 이룬다. 이곳에 멸치들이 곧잘 몰려 들었기 때문에 \u0027원\u0027이라 하지만. 거의 천연적으로 생긴 것이다. \u003c발췌 : 문화유적분포지도 P65. 1998년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2018","zip":"63112","addr":"제주특별자치도 제주시 도두일동 1727-1"},{"id":2128,"name":"홍효자비","lat":33.449966,"lng":126.885808,"theme":"fort","cat":"확장분야","d1":"사회","d2":"사회","title":"고성 홍효자","sub":"해당없음","author":"제주특별자치도","abs":"집안이 몹시 가난했으나 부모님을 극진히 모신 효자의 이야기","body":"성산읍 고성리에 효자문거리라는 곳에 홍효자비가 있다. 집안이 매우 가난하였으나 부모님을 극진히 모셨다. 부친이 병환으로 자리에 눕자 부친의 대변 맛을 보면서 간호하였다. 현종 왕이 승하하자 향을 피워 놓고 통곡하였고 조정에서는 그가 죽은 후에 효자비가 내려졌다. \u003c발췌 : 제주의 민속 3권 (제주도)_p.57\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-28","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2128","zip":"63056","addr":"제주특별자치도 서귀포시 성산읍 수산리 526-2"},{"id":2388,"name":"산지천","lat":33.515132,"lng":126.528957,"theme":"water","cat":"민속","d1":"민간신앙","d2":"해당없음","title":"조천석제사터표지석","sub":"해당없음","author":"제주특별자치도","abs":"산지천은 제주항과 제주시의 중심가인 동문로터리를 흐르는 하천으로 예로부터 제주의 상징이였던 곳이다.","body":"제주시내에서 바다로 흐르는 산지천 하류인 산지포구에서 고기를 낚는 모습이 아름다워 산포조어라 하여 영주 10경중 하나로 칭송 하였다. 산지천 안에는 조천이라는 표석이 있는데 가뭄으로 농사가 어려울때 기우제를 지내던 곳이다. \u003c발췌 : 즐거운 제주 P53. 2007년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2388","zip":"63277","addr":"제주특별자치도 제주시 건입동 1430"},{"id":2436,"name":"장수물","lat":33.455413,"lng":126.402165,"theme":"water","cat":"확장분야","d1":"역사","d2":"고려시대","title":"삼별초군깃발","sub":"해당없음","author":"제주특별자치도","abs":"삼별초가 최후까지 항쟁하다 전원이 순직한 삼별초의 마지막 보루였던 역사적장소","body":"몽골에 맞서 삼별초가 최후까지 항쟁하다 전원이 순직한 삼별초의 마지막 보루였던 역사적인 장소. 이곳에는 또한 김통정 장군이 토성 위에서 뛰어내린 발자국이 바위에 파여 샘이 솟아나게 되었다는 \"장수물\"이다. \u003c발췌 : Welcome to 제주 P114. 2007년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2436","zip":"63057","addr":"제주특별자치도 제주시 애월읍 상귀리 1104-3"},{"id":2460,"name":"군산진지동굴","lat":33.252791,"lng":126.369949,"theme":"fort","cat":"확장분야","d1":"역사","d2":"일제강점기","title":"군산진지동굴내부에서본풍경","sub":"해당없음","author":"제주특별자치도","abs":"일본군이 전쟁을 하기 위해 만든동굴이다.","body":"일제시대에 일본군이 전쟁을 계속하기위해 소형의 특수잠수정이나 비행기. 곡사포 등 군수물품을 숨겨둘 목적으로 제주도민을 강제로 부역시켜 만든 곳이다. 제주시 사라봉. 명도암. 성산일출봉. 송악산. 우도 등지에 있다. \u003c 발췌 : 제주관광메뉴얼 P 55. 제주도 \u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2460","zip":"63533","addr":"제주특별자치도 서귀포시 안덕면 창천리 산1"},{"id":2470,"name":"수월봉진지동굴","lat":33.299932,"lng":126.167904,"theme":"fort","cat":"확장분야","d1":"역사","d2":"일제강점기","title":"수월봉진지동굴","sub":"해당없음","author":"제주특별자치도","abs":"일본군이 전쟁을 하기 위해 만든동굴이다.","body":"일제시대에 일본군이 전쟁을 계속하기위해 소형의 특수잠수정이나 비행기. 곡사포 등 군수물품을 숨겨둘 목적으로 제주도민을 강제로 부역시켜 만든 곳이다. 제주시 사라봉. 명도암. 성산일출봉. 송악산. 우도 등지에 있다. \u003c 발췌 : 제주관광메뉴얼 P 55. 제주도 \u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2470","zip":"63008","addr":"제주특별자치도 제주시 한경면 고산리 3672-1"},{"id":2480,"name":"셋알오름 일제 고사포진지","lat":33.206526,"lng":126.281047,"theme":"fort","cat":"확장분야","d1":"역사","d2":"일제강점기","title":"일본군탄약고","sub":"해당없음","author":"이어도사나","abs":"집단 학살되는 비극의 장소","body":"송악산 섯알오름에 위치했던 일본군의 탄약고. 지하에 구축된 일본군의 탄약고는 주변의 진지동굴로 이어지게 설계됐는데 훗날 4.3사건을 겪었으며 1950년 이곳에서 예비검속자 252명이 집단 학살되는 비극의 장소이기도 하다. 당시 희생된 사람들은 백조일손지묘에 안장돼 있다.","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2480","zip":"63530","addr":"제주특별자치도 서귀포시 대정읍 상모리 1590-3"},{"id":2490,"name":"서귀포수력발전소 터","lat":33.2463,"lng":126.555975,"theme":"fort","cat":"확장분야","d1":"역사","d2":"근대","title":"1950년대하논습지작업풍경","sub":"해당없음","author":"강병수","abs":"서귀포시는 일제시대 부터 발전을 거듭하였다.","body":"서귀포시에 현대적 의미의 도로가 개설된것은 일제시대인 1920년대 후반기 부터이고. 전기가 처음으로 들어온것은 1943년 천지연 하류에 서귀포수력발전소가 신설되면서부터이다. 서귀포 시민들이 기선을 이용한 것은 1913년 제주기선 회사가 생기면서부터이다. \u003c발췌 : 서귀포시의 어제와 오늘 . P54\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2490","zip":"63592","addr":"제주특별자치도 서귀포시 서귀동 808-2"},{"id":2590,"name":"선덕사","lat":33.320578,"lng":126.593645,"theme":"faith","cat":"확장분야","d1":"문화","d2":"전통문화","title":"선돌선덕사일주문과코끼리상","sub":"해당없음","author":"제주특별자치도","abs":"선덕사는 불교와 인연이 깊은곳이다.","body":"선덕사가 있는 ‘선돌’지역은 오래전부터 많은 수행승들이 하천변 토굴 등에서 수행을 하다가 산남지역으로 나아가 불사를 일으켰다고 전해 내려오는 예부터 불교와 인연이 깊은 곳이다.","ref":"『한국의 사찰문화재-제주도 자료집』(문화재청. 2003)+『전통사찰총서』21(사찰문화연구원. 2006)+「정방사 여래좌상쪽 선덕사 대적광전 제주도 문화재 지정」(『제주불교신문』. 2005. 9. 23.)+「제주불자 도내·외 도량서 ‘마음 닦기’」(『제주불교신문』. 2006. 9. 15.)+「서귀포시 상효동 ‘선덕사’」(『제주불교신문』. 2009. 5. 13.)+선덕사(http://www.sunduksa.kr)","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2590","zip":"63577","addr":"제주특별자치도 서귀포시 상효동 산86-16"},{"id":2611,"name":"귀덕리 거북등대","lat":33.446615,"lng":126.291371,"theme":"sea","cat":"확장분야","d1":"사회","d2":"사회","title":"거북등대","sub":"해당없음","author":"제주특별자치도","abs":"귀덕리에 위치하고 있다.","body":"귀덕리에 있는 거북등대는 무인등대로 저녁 시간에 포구에서 바라보는 낙조는 한폭의 그림을 연상케 한다. 이 곳은 웨딩촬영과 특히 낚시터로 유명한데. 특이한 모습의 거북등대로 별다른 이정표가 없어도 쉽게 찾을 수가 있다","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2611","zip":"63024","addr":"제주특별자치도 제주시 한림읍 귀덕리 989-9"},{"id":2618,"name":"귀덕우물","lat":33.443781,"lng":126.293359,"theme":"water","cat":"확장분야","d1":"사회","d2":"사회","title":"귀덕우물","sub":"해당없음","author":"제주특별자치도","abs":"귀덕리에 위치하고 있다.","body":"귀덕리에 있는 거북등대는 무인등대로 저녁 시간에 포구에서 바라보는 낙조는 한폭의 그림을 연상케 한다. 이 곳은 웨딩촬영과 특히 낚시터로 유명한데. 특이한 모습의 거북등대로 별다른 이정표가 없어도 쉽게 찾을 수가 있다","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2618","zip":"63024","addr":"제주특별자치도 제주시 한림읍 귀덕리 1020-2"},{"id":2633,"name":"동문시장","lat":33.511416,"lng":126.526193,"theme":"life","cat":"확장분야","d1":"사회","d2":"사회","title":"동문시장","sub":"해당없음","author":"제주특별자치도","abs":"재래시장중에서도 규모가 가장 큰 상설 시장이다.","body":"품질 좋은 제주 특산물들을 마음껏 고를 수 있는 재래시장 중에서도 규모가 가장 큰 상설시장이다. 저녁이면 포장마차 장이 서는 곳이다. 저렴한 가격에 푸짐한 안주와 술 한 잔을 나눌 수 있는 정겨운 시장이다. \u003c발췌 : 즐거운제주 P53. 2007년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2633","zip":"63192","addr":"제주특별자치도 제주시 이도일동 1436-7"},{"id":2636,"name":"모슬포항 등대","lat":33.214404,"lng":126.251742,"theme":"sea","cat":"확장분야","d1":"사회","d2":"사회","title":"모슬포항등대","sub":"해당없음","author":"제주특별자치도","abs":"포구는 항내가 좁을 뿐더러 배후지를 제주와 서귀포에 빼앗겨 어항으로서만 발전해 왔다","body":"제주도남서쪽 끝에 있으며 배후에 모슬봉(187m)·가시악을 등지고 있는 남서부 해안은 암석해안 또는 암초로 둘러싸여 천연의 방파제가 되고 있다. 포구는 중앙에 돌출한 작은 반도에 의하여 항구가 좌우로 양분된다. 포구는 항내가 좁을 뿐더러 배후지를 제주와 서귀포에 빼앗겨 어항으로서만 발전해 왔다","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2636","zip":"63513","addr":"제주특별자치도 서귀포시 대정읍 하모리 694-1"},{"id":2644,"name":"사계포구","lat":33.228259,"lng":126.306631,"theme":"sea","cat":"확장분야","d1":"사회","d2":"사회","title":"사계포구","sub":"해당없음","author":"제주특별자치도관광협회","abs":"사계포구는 토끼축항이라고도한다.","body":"산방산 아래에 형성된 마을 사계리 포구로 산방산을 한눈에 볼수 있고 경치가 아름답다","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2644","zip":"63528","addr":"제주특별자치도 서귀포시 안덕면 사계리 2147-32"},{"id":2651,"name":"하모해변","lat":33.211302,"lng":126.261356,"theme":"sea","cat":"확장분야","d1":"사회","d2":"사회","title":"새우젓 드럼통","sub":"해당없음","author":"제주100년","abs":"멀리 모슬봉이 보이는 모슬포 해변에 새우젓 담근 드럼통이 여러 개 놓여 있고 드럼통에는 가마니를 덮어 봉해 놓았다","body":"멀리 모슬봉이 보이는 모슬포 해변에 새우젓 담근 드럼통이 여러 개 놓여 있고 드럼통에는 가마니를 덮어 봉해 놓았다. 트럭이 와 있는 것으로 보아 흥정 또한 잘 되는 모양이다.","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2651","zip":"63513","addr":"제주특별자치도 서귀포시 대정읍 하모리 279-2"},{"id":2662,"name":"소레포구","lat":33.239465,"lng":126.607741,"theme":"sea","cat":"확장분야","d1":"사회","d2":"사회","title":"소레포구","sub":"해당없음","author":"강병수","abs":"날 맑은 날이면 한라산의 모습이 바다에 그대로 비추이는 보목동에 있는 포구로 한라산의 모습이 바다에 비치는 곳으로 유일한 곳이다.","body":"날 맑은 날이면 한라산의 모습이 바다에 그대로 비추이는 보목동에 있는 포구로 한라산의 모습이 바다에 비치는 곳으로 유일한 곳이다.","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2662","zip":"63599","addr":"제주특별자치도 서귀포시 보목동 1400"},{"id":2676,"name":"화북포구","lat":33.524671,"lng":126.565573,"theme":"sea","cat":"확장분야","d1":"사회","d2":"사회","title":"원당오름과화북","sub":"해당없음","author":"제주특별자치도","abs":"조선시대에 제주의 관문이였던 화북포구","body":"조선시대에 제주의관문인 화북포구는 역사의 생생함이 그대로 담겨있는 곳이다. 제주사람들에게 포구는 거친 바다와 싸우며 삶을 일궈온 치열한 삶의 현장이자 제주문화의 원형을 찾을 수 있는 곳이다. 별도봉에서 바라보는 원당봉과 화북포구는 평화롭기 그지없다.","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2676","zip":"63287","addr":"제주특별자치도 제주시 화북일동 1619-6"},{"id":2690,"name":"제주측후소","lat":33.514636,"lng":126.529662,"theme":"fort","cat":"확장분야","d1":"사회","d2":"사회","title":"제주측후소 쪽에서 찍은 제주 시가지","sub":"해당없음","author":"제주100년","abs":"제주측후소 쪽에서 서쪽을 향하여 찍은 제주 시가지 모습이다","body":"제주측후소 쪽에서 서쪽을 향하여 찍은 제주 시가지 모습이다. 이제 초가는 한 동네를 제외하곤 거의 찾아볼 수가 없다. 2~3층의 건물들이 들어서기 시작하여 고층화 현상이 일고 있음을 알아볼 수 있다.","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2690","zip":"63278","addr":"제주특별자치도 제주시 일도일동 1186"},{"id":2692,"name":"종달리 포구","lat":33.496945,"lng":126.911145,"theme":"sea","cat":"확장분야","d1":"사회","d2":"사회","title":"종달리포구","sub":"해당없음","author":"제주특별자치도관광협회","abs":"종달리포구는 우도로 가는 도항선이 취항한다.","body":"종달리 포구.우도로 가는 도항선이 취항하면서 제법 크게 확장된 포구다.지미봉에서 내려다 보는 포구와 일출봉 그리고 우도에 이르기까지 아름다운 풍경을 자랑한다.","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2692","zip":"63364","addr":"제주특별자치도 제주시 구좌읍 종달리 484-10"},{"id":2839,"name":"서귀포칠십리바닷가","lat":33.243637,"lng":126.56874,"theme":"sea","cat":"확장분야","d1":"자연","d2":"지구과학","title":"서귀포칠십리바닷가여명","sub":"해당없음","author":"강병수","abs":"서귀포항을 중심으로 해안선이 절묘하게 어우러진 칠십리. 이곳에서 칠십리축제등 다양한 행사가 열린다.","body":"서귀포항을 중심으로 해안선이 절묘하게 어우러진 칠십리에서 개최되는 축제. 제주목사행차 재현. 칠십리가요제. 서귀포 문화제 등이 열린다. \u003c발췌 : Welcome to 제주 P66. 2007년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2839","zip":"63596","addr":"제주특별자치도 서귀포시 서귀동 70-1"},{"id":2859,"name":"하도리 철새 도래지","lat":33.5117,"lng":126.895331,"theme":"eco","cat":"확장분야","d1":"자연","d2":"지구과학","title":"하도리철새도래지","sub":"해당없음","author":"제주특별자치도","abs":"하도리철새도래지는철새들이 서식하기에 좋은 새들의 낙원이다.","body":"매년 9월부터 12월 사이에 천연 보호 기념물로 지정 보호받고 있는 노랑부리저어새. 황새. 백로. 청둥오리. 원앙이등 철새들의 모습을 관찰 할 수 있다.주변에는 지하수를 이용한 송어. 숭어 양식장이 있는 까닭에 먹이가 풍부해 한겨울동안 이곳에서 지내기에 부족함이 없고. 비교적 조용하여 철새들이 서식하기에 좋은 새들의 낙원이다. \u003c발췌 : 즐거운 제주 P179. 2007년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2859","zip":"63363","addr":"제주특별자치도 제주시 구좌읍 하도리 53-2"},{"id":2869,"name":"고내 해안","lat":33.467184,"lng":126.337286,"theme":"sea","cat":"확장분야","d1":"자연","d2":"지리","title":"고내해안","sub":"해당없음","author":"제주특별자치도관광협회","abs":"제주해안도로중 유일하게 경사가 있는곳이다.","body":"제주도의 해안도로 중 거의 유일하게 경사가 있는 곳으로 과거 제주도민이 사용하던 천연 돌염전을 비롯해 각종 기암괴석이 곳곳에 있어 볼거리가 풍부하다.","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2869","zip":"63045","addr":"제주특별자치도 제주시 애월읍 고내리 1156-4"},{"id":2870,"name":"고망난돌쉼터해변","lat":33.510121,"lng":126.906457,"theme":"sea","cat":"확장분야","d1":"자연","d2":"지리","title":"고망난돌쉼터해변","sub":"해당없음","author":"제주특별자치도","abs":"머리를 맑게 해주는 우묵사스레피 나무가 언덕을 덮고있는 고망난 돌 쉼터","body":"쪽빛 바다위에 여유로워 보이는 우도가 정면으로 보이고 왼쪽으로는 문주란섬이. 오른쪽으로 성산일출봉이 보인다. 바다를 향한 벤치에 앉아 있으면 발아래는 철따라 예쁜 들꽃이 융단을 깔아 놓은듯하며 우묵사스레피 나무가 언덕을 덮고 있다. \u003c발췌 : 즐거운제주 P198. 2007년","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2870","zip":"63364","addr":"제주특별자치도 제주시 구좌읍 종달리 112-4"},{"id":2872,"name":"고산해안산책로","lat":33.304424,"lng":126.165148,"theme":"sea","cat":"확장분야","d1":"자연","d2":"지리","title":"고산해안산책로","sub":"해당없음","author":"제주특별자치도","abs":"고산큰엉알은 해안도로를 따라 해안산책로가 마련되어 있다","body":"수월봉과 자구내 포구를 연결하는 해안도로를 따라 형성된 엉알 산책로에는 녹고의 눈물이 흐르고 있는 샘이 있다. 해안의 절벽은 파도에 깎여서 형성된 수중화산의 단면을 잘 보여주고 있다.","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2872","zip":"63008","addr":"제주특별자치도 제주시 한경면 고산리 3653-2"},{"id":2882,"name":"논짓물","lat":33.236825,"lng":126.388291,"theme":"water","cat":"확장분야","d1":"자연","d2":"지리","title":"논짓물","sub":"해당없음","author":"제주특별자치도","abs":"바닷물과 민물이 만나는 곳에 돌담을 쌓아놓은 곳이다.","body":"바닷물과 민물이 만나는 곳에 돌담으로 쌓아 만조 때면 바닷물이 들어와 주인행세를 하고 바닷물이 빠지면 민물이 주인이 되는 자연 그대로의 천연 수영장이다. \u003c발췌 : 즐거운 제주 P225. 2007년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2882","zip":"63538","addr":"제주특별자치도 서귀포시 하예동 532-3"},{"id":2891,"name":"원앙폭포","lat":33.301803,"lng":126.578931,"theme":"water","cat":"확장분야","d1":"자연","d2":"지리","title":"돈내코원앙폭포","sub":"해당없음","author":"제주특별자치도","abs":"원앙폭포는 돈내코가운데 있다.","body":"깊은 골짜기와 폭포 울창한 난대 상록수림. 특히 계곡 한가운데 있는 높이 5m의 원앙 폭포는 매년 음력 7월 15일 백중날 제주 여인들이 여름철 물맞이 하는 곳으로 유명하다. \u003c발췌 : Welcome to 제주 P102. 2007년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2891","zip":"63582","addr":"제주특별자치도 서귀포시 상효동 1463"},{"id":2894,"name":"지미봉","lat":33.496894,"lng":126.906103,"theme":"oreum","cat":"확장분야","d1":"자연","d2":"지리","title":"두산봉에서본지미봉","sub":"해당없음","author":"제주특별자치도","abs":"지미봉은 화구가 패어내린 말굽형 기생화산체이다.","body":"일주도로 구좌읍 종달 마을 입구 동쪽 방향에 있는 오름으로 산위 등성이는 원뿔모양의 동쪽 봉우리가 주봉이며. 정상봉 가까이의 안부에서 바닷가 쪽 으로 화구가 패어내려 말굽형 기생화산체를 이루고 있다. \u003c발췌 : 제주의 오름 1997. P284\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2894","zip":"63364","addr":"제주특별자치도 제주시 구좌읍 종달리 산3-1"},{"id":2908,"name":"사계해변","lat":33.228256,"lng":126.308463,"theme":"sea","cat":"확장분야","d1":"자연","d2":"지리","title":"사계해안","sub":"해당없음","author":"제주특별자치도관광협회","abs":"사계해수욕장은 물이 맑고 깨끗하며 레져스포츠를 즐기기에 적합하다.","body":"제주도내 다른 해수욕장에 비해 덜 알려진 관계로 아직은 맑은 수심과 고은 모래를 자랑하고 있다.좌로는 용머리 해안이.우로는 송악산이 그림같이 펼쳐져 있고 마라도 해상유람뿐만 아니라 스킨 스쿠버 다이빙 체험 관광을 선택할 수도 있다. 송악산 사계 해수욕장 부근에는 물이 맑고 깨끗한 스킨 스쿠버 다이빙 포인트가 위치해 신비로운 바닷속 세계를 경험하는 이색 투어가 가능하다","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2908","zip":"63528","addr":"제주특별자치도 서귀포시 안덕면 사계리 131-8"},{"id":2912,"name":"산지등대","lat":33.521261,"lng":126.545478,"theme":"sea","cat":"확장분야","d1":"자연","d2":"지리","title":"산지등대(별도봉에서 바라본 전경)","sub":"해당없음","author":"제주특별자치도","abs":"산지등대는 제주항의 관문이다","body":"1916년 10월 무인등대로 처음 점등된 산지 등대는 1917년3월에 유인등대로 변경되어 1999년 12월까지 83년 동안제주항의 관문 역할을 해냈다. 바다를 붉게 물들이며 넘어가는 사봉낙조의 황홀함에 빠져들 즈음이면 고기잡이 나가는 수십척의 배가 불을 밝혀 장관을 연출했다. \u003c발췌 : 즐거운 제주 P55. 2007년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2912","zip":"63284","addr":"제주특별자치도 제주시 사라봉동길 108-1"},{"id":2937,"name":"안덕계곡","lat":33.254404,"lng":126.350603,"theme":"water","cat":"확장분야","d1":"자연","d2":"지리","title":"안덕계곡","sub":"해당없음","author":"제주특별자치도","abs":"항상 맑은 시냇물이 흘러 내리고 맑은 용천수가 나온다.","body":"조용하고 쾌적하며 가족단위. 팀단위의 여행객들에게 좋다.항상 맑은 시냇물이 흘러내리고 맑은 용천수가 솟아나오는곳이 많고 천상의 바위들은 물에 닳아 한층 자태가 곱다. \u003c 발췌 : 제주관광메뉴얼 P 51. 제주도\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2937","zip":"63531","addr":"제주특별자치도 서귀포시 안덕면 감산리 1946"},{"id":2938,"name":"알오름군락","lat":33.329988,"lng":126.777995,"theme":"oreum","cat":"확장분야","d1":"자연","d2":"지리","title":"알오름군락","sub":"해당없음","author":"제주특별자치도관광협회","abs":"제주의 오름 중에서 세개의 분화구와 알 오름이 있는복합형오름이다.","body":"제주의 368개 오름 중에서 세 개의 분화구와 알 오름이 있는 복합형 오름이다. 이 오름 자락에는 굵은 선으로 네모칸을 그린듯한 산담이 멀리서도 확연하게 들어오는 것만으로 보아도 명당자리가 많음을 짐작케 한다.용이 누워 있는 형상이라 용눈이 오름이라 불리고 있다. \u003c발췌 : 즐거운제주 P73. 2007년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2938","zip":"63626","addr":"제주특별자치도 서귀포시 표선면 토산리 산11"},{"id":2941,"name":"오조리철새도래지","lat":33.463143,"lng":126.915385,"theme":"eco","cat":"확장분야","d1":"자연","d2":"지리","title":"오조리철새도래지","sub":"해당없음","author":"제주특별자치도","abs":"숭어를 양식하고해조류가 풍부해 해마다 많은 철새가찾는곳이다.","body":"오조리철새도래지는 오조리 해안에 위치하고 있으며 숭어를 양식하고 있고 해조류가 풍부하며 갈대밭이 넓게 분포하고있다. 수심은 120cm 정도이고 면적은 1.54평방킬로미터이다. \u003c발췌 : 제주의 습지2 . P114\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2941","zip":"63639","addr":"제주특별자치도 서귀포시 성산읍 오조리 2210"},{"id":2945,"name":"온평리 해안","lat":33.415988,"lng":126.910528,"theme":"sea","cat":"확장분야","d1":"자연","d2":"지리","title":"온평리해안","sub":"해당없음","author":"제주특별자치도","abs":"삼성신화에서 목함을 발견하고 뭍으로 끌어올렸던 곳이 온평리이다.","body":"온평리는 삼성혈과 삼성신화의 이야기와 연결된다. 삼성신화에 나오는 목함을 발견하고 뭍으로 끌어 올렸던 곳이 온평리 해안이고. 결혼을 하였던 곳이 혼인지이다. \u003c발췌 : 즐거운 제주 P180. 2007년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2945","zip":"63633","addr":"제주특별자치도 서귀포시 성산읍 온평리 66-2"},{"id":2949,"name":"용수리 해안도로","lat":33.323724,"lng":126.166017,"theme":"sea","cat":"확장분야","d1":"자연","d2":"지리","title":"용수리해변","sub":"해당없음","author":"제주특별자치도","abs":"용수리는 아름다운 해안 도로가 협재부터 이어져 있어 국도를 타고 해안도로를 타라 올라오면 제주도의 해안 풍치를 맛볼수 있다.","body":"용수리는 아름다운 해안도로가 협재 부터 이어져 있어 국도를 타고 해안도로를 따라 올라오면 제주도의 해안 풍치를 맛 볼 수 있다.","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2949","zip":"63009","addr":"제주특별자치도 제주시 한경면 용수리 4274-1"},{"id":2959,"name":"이달봉","lat":33.3624,"lng":126.345292,"theme":"oreum","cat":"확장분야","d1":"자연","d2":"지리","title":"이달봉","sub":"해당없음","author":"제주특별자치도","abs":"이달봉은 새별오름서쪽에 이웃해 있다.","body":"이달봉은 새별오름 서쪽에 이웃해 2개의 봉우리로 이루어져있다. 이달봉은 이달 이촛대봉과 함께 원추형 쌍둥이 화산체라고 할수 있다. 이달이촛대봉의 정상부에는 용암유출흔적인 화산암이 노출되어 있다. \u003c발췌 : 제주의 오름 1997. P245\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2959","zip":"63039","addr":"제주특별자치도 제주시 애월읍 봉성리 산71-1"},{"id":2960,"name":"서림물","lat":33.238979,"lng":126.22853,"theme":"water","cat":"확장분야","d1":"자연","d2":"지리","title":"일과리해변","sub":"해당없음","author":"제주특별자치도","abs":"일과리에는 소금밭도 있다.","body":"제주도 서귀포시 대정읍에 있는 리이다. 생활용수를 공급하는 서림수원지가 있으며. 많은 용천이 있어 식수가 풍부한 마을이다.","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2960","zip":"63504","addr":"제주특별자치도 서귀포시 대정읍 일과리 1293-1"},{"id":2975,"name":"도순다원","lat":33.272478,"lng":126.483071,"theme":"eco","cat":"확장분야","d1":"자연","d2":"지리","title":"제다녹차밭","sub":"해당없음","author":"제주특별자치도관광협회","abs":"이곳은 한라산 중턱의 도순다원이다.","body":"한라산중턱을 끝도 모르게 이어진 차밭. 유배생활을 하던 추사가 차 한 잔에 마음을 달래며 세한도를 그리고 추사체를 완성했을 그때가 눈앞에 아른거린다. \u003c발췌 : Welcome to 제주 P101. 2007년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2975","zip":"63555","addr":"제주특별자치도 서귀포시 도순동 1-1"},{"id":2988,"name":"칡오름","lat":33.477139,"lng":126.612434,"theme":"oreum","cat":"확장분야","d1":"자연","d2":"지리","title":"칡오름","sub":"해당없음","author":"제주특별자치도","abs":"두개의 독립된 봉우리로 이루어진 쌍둥이 원추형 화산체이다.","body":"명도암마을입구에 위치한 오름으로 북. 남쪽에 두개의 독립된 봉우리로 이루어진 쌍둥이의 원추형 화산체로서 큰 봉우리를 큰오름. 작은봉우리를 족은오름이라고 하여 따로 부르고 있다. \u003c발췌 : 제주의 오름 1997. P149\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2988","zip":"63313","addr":"제주특별자치도 제주시 봉개동 466-2"},{"id":2992,"name":"송악산 해안동굴","lat":33.206047,"lng":126.289732,"theme":"sea","cat":"확장분야","d1":"자연","d2":"지리","title":"해안동굴","sub":"해당없음","author":"제주특별자치도관광협회","abs":"주봉을 중심으로 서북쪽은 넓고 평평한 초원지대이고 분화구안은 아직도 화산재가 남아있다.","body":"올인 촬영지\"송악산\" 쪽빛바다와 언덕이 아름답게 어울리는 크고 작은 봉우리들이 모여 있는 송악산에서 드라마 올인 촬영을 하였다. 멀리 우리나라 최남단인 마라도가 보이고 비가 조금만 내려도 가라앉을듯한 가파도가 한 폭의 그림처럼 떠 있다. 멀리로는 한라산이 보이고 동쪽으로는 산방산과 용머리 해안이 시야에 들어오고 형제섬도 보인다. \u003c발췌 : 즐거운 제주 P241. 2007년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=2992","zip":"63512","addr":"제주특별자치도 서귀포시 대정읍 상모리 179-4"},{"id":3002,"name":"강정천","lat":33.232636,"lng":126.489534,"theme":"water","cat":"확장분야","d1":"관광","d2":"관광명소","title":"법환(막숙) 해안","sub":"해당없음","author":"강병수","abs":"손에 닿을 듯 말듯 한 범섬을 지적에 두고 있는 법환해안은 해돋이와 해넘이를 찍으려는 사진작가들이 많이 찾는 장소중의 하나이기도 하며 영화 촬영지로도 유명하다.","body":"손에 닿을 듯 말듯 한 범섬을 지적에 두고 있는 법환해안은 해돋이와 해넘이를 찍으려는 사진작가들이 많이 찾는 장소중의 하나이기도 하며 영화 촬영지로도 유명하다.","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3002","zip":"63563","addr":"제주특별자치도 서귀포시 강정동 5647 외"},{"id":3079,"name":"성읍 남문성","lat":33.385692,"lng":126.801694,"theme":"fort","cat":"확장분야","d1":"관광","d2":"관광명소","title":"성읍남문성","sub":"해당없음","author":"제주특별자치도","abs":"제주의 옛 초가. 향교. 관공서. 돌아르방 등 그대로 보존되고 있는 민속마을이다.","body":"제주의 옛 초가. 향교. 관공서. 돌하르방. 연자방아. 성터.비석이 그대로 보호되고 있는 민속마을이다. 제주 고유의민요. 민속놀이. 향토음식. 민간공예. 제주방언 등의 무형문화유산과 함계 천연기념물 제161호인 느티나무. 팽나무의 운치도 이곳만의 기품을 더해준다. \u003c발췌 : Welcome to 제주 P136. 2007년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3079","zip":"63624","addr":"제주특별자치도 서귀포시 표선면 성읍리 3294"},{"id":3125,"name":"황우지열두굴","lat":33.241906,"lng":126.55069,"theme":"sea","cat":"확장분야","d1":"관광","d2":"관광명소","title":"천연해수풀장","sub":"해당없음","author":"제주특별자치도","abs":"휘영청 달 밝은밤선녀들이 내려와목욕을 했음직한해수천연풀장","body":"외돌개 주차장에 차를 세워놓고 길 건너 바다 솔빛 찻집이 있는 계단으로 내려가면 바다로 가는 길이 이어져 있다. 황우지 열두굴로 내려가는 가파른 나무 계단을 내려가면 문섬이 보인다. 그 밑으로 선녀들이 내려와 목욕을 했음직한 해수천연풀장이 나온다. 풀장은 깊은곳. 얕은곳 두곳이 있어 어린이들도 안심하고 즐길수 있다. \u003c발췌 : 즐거운 제주 P145. 2007년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3125","zip":"63594","addr":"제주특별자치도 서귀포시 서홍동 764-1"},{"id":3146,"name":"한라산 고산습지","lat":33.357557,"lng":126.463406,"theme":"eco","cat":"확장분야","d1":"관광","d2":"관광","title":"1100고지고상돈묘역","sub":"해당없음","author":"제주특별자치도","abs":"1100고지습지는 야생화의 천국이며 한라산에서만 볼수 있는 생물들의 서식지이다.","body":"1100도로는 드라이브 코스로서 한번쯤은 다녀왔을 것이다. 그러나 한라산의 고산습지가 있다는 것을 아는 사람은 그리 많지 않을 것이다. 1100고지습지는 야생화의 천국이며 한라산에서만 볼 수 있는 생물들의 서식 하는 곳이다. 지금은 습지를 훼손하지 않고 관찰할 수 있도록 친환경적인 나무데크길로 정비를 잘 해 놓았다. \u003c발췌 : 즐거운 제주 P93. 2007년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3146","zip":"63554","addr":"제주특별자치도 서귀포시 색달동 산1-2"},{"id":3164,"name":"붉은오름 자연휴양림","lat":33.401645,"lng":126.675313,"theme":"eco","cat":"확장분야","d1":"관광","d2":"관광","title":"교래리보호수","sub":"해당없음","author":"제주특별자치도","abs":"교래리는 해발 421고지에 자리하고 있다","body":"마을이 해발 421고지에 자리하고 있고 한라산 동쪽에 위치한 중산간 마을이며 목가적인 전원풍경으로 가족단위 관광객이 많이 찾는다. 자연마을로는 구두악. 물오름. 성오름. 붉은오름이 있다. 구두악은 마을 뒷산 모양이 개 머리와 비슷하다 하여 붙여진 이름이다. 물오름은 산에서 생수가 나온다 하여 붙여진 이름이다. 성오름은 마을 뒷산이 절벽같이 되었고 성을 쌓은 형상이라 하여 붙여진 이름이다. 붉은 오름은 마을의 흙이 붉다는 데서 붙여진 이름이다.","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3164","zip":"63622","addr":"제주특별자치도 서귀포시 표선면 가시리 산 158"},{"id":3240,"name":"명월 팽나무군락","lat":33.387594,"lng":126.266171,"theme":"eco","cat":"확장분야","d1":"관광","d2":"관광","title":"명월리느티나무(겨울)","sub":"해당없음","author":"제주특별자치도","abs":"명월리 마을 사람들은 마을의 나쁜 기운을 막기위해 수백년 전에 팽나무를 심었다고 한다.","body":"마을 동구 밖에는 명월리 설촌 유래를 알리는 표석이 마을을 찾는 이방인을 맞이하고 있다. 명월천이 시작되는 마을 입구부터 꽤나 오랜 세월을 지켜온 듯한 아름드리 팽나무가 즐비하게 서 있다. \u003c발췌 : 즐거운제주 P101. 2007년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3240","zip":"63014","addr":"제주특별자치도 제주시 한림읍 명월로 71"},{"id":3267,"name":"솜반천","lat":33.25335,"lng":126.553013,"theme":"water","cat":"확장분야","d1":"관광","d2":"관광","title":"봄이시작되는공원","sub":"해당없음","author":"제주특별자치도","abs":"인간과 자연이 공존하는 생태공원","body":"걸매란 \"물도랑이 자주 막혀 메워져 있는 곳\"이다. 솜반천에서 흘러 내리는 계곡에 인간과 자연이 공존하는 생태공원을 조성하였으며 일급수에서만 서식하는 송어와 천연기념물 원앙새 등 철새를 만날수 있다. \u003c발췌 : 즐거운 제주 P145. 2007년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3267","zip":"63583","addr":"제주특별자치도 서귀포시 서홍동 2565"},{"id":3315,"name":"성김대건신부 제주표착기념관","lat":33.322849,"lng":126.167724,"theme":"faith","cat":"확장분야","d1":"관광","d2":"관광","title":"성김대건신부제주표착기념관","sub":"해당없음","author":"제주특별자치도관광협회","abs":"김대건 신부가 풍랑을 만나 용수리에 표착하였던 자리이다.","body":"김대건 표착기념관은 배 모양의 건물로 김대건 신부가 상해에서 사제서품을 받고 서해바다로 귀국하기 위해 타고 온 배가 풍랑을 만나 용수리에 표착하였던 자리로 1999년에 순례지로 선포한 곳이다. 고증에 의해 150년 전의 모습을 복원한 하파엘호는 마당 한켠에 전시되어 있다. \u003c발췌 :즐거운제주 P123. 2007년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3315","zip":"63009","addr":"제주특별자치도 제주시 한경면 용수리 4266"},{"id":3349,"name":"쇠소깍해변","lat":33.251553,"lng":126.623122,"theme":"water","cat":"확장분야","d1":"관광","d2":"관광","title":"효돈동쇠소깍검은모래해변축제(먹거리장터)","sub":"해당없음","author":"제주특별자치도","abs":"제주 한라산 수악계곡에서 흘러내려온 물과 서귀포 앞바다가 만나는 서귀포시 효돈동 \u0027쇠소깍\u0027. 서귀포칠십리 숨은 비경중 한곳인 이곳에서 환경사랑쇠소깍축제가 열린다.","body":"효돈동 쇠소깍 검은모래해변축제의 먹거리 장터에서는 제주 고유의 각가지 토속음식들을 즐길수 있으며 제주 흑돼지 바비큐가 제일 인기가 좋다.","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3349","zip":"63600","addr":"제주특별자치도 서귀포시 하효동 997-3"},{"id":3618,"name":"반딧불이 보호구역","lat":33.24132,"lng":126.396413,"theme":"eco","cat":"확장분야","d1":"관광","d2":"관광","title":"반딧불이 보호구역","sub":"해당없음","author":"제주특별자치도","abs":"2002년 전국 `반딧불이 보호구역` 제1호로 지정된 곳","body":"2002년 전국 `반딧불이 보호구역` 제1호로 지정된 곳으로 8월 말에서 9월 중순까지 캄캄한 여름밤이면 인근 마을에 반딧불이 꽁무니에 불을 켜고 돌아다니는 모습을 심심치 않게 볼수 있다. \u003c발췌 : 즐거운제주 P225. 2007년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-21","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3618","zip":"63536","addr":"제주특별자치도 서귀포시 상예동 5001-1"},{"id":3717,"name":"공천포","lat":33.26342,"lng":126.641112,"theme":"sea","cat":"확장분야","d1":"사회","d2":"풍속/민속학","title":"공천포지(공천미)","sub":"해당없음","author":"남원읍 신례2리","abs":"공천포(공천미)라 불리는 예래 2리는 해안에 접한 마을로 1211년 경 지금의 예촌(禮村) 가름 일대를 중심으로 호촌현이 설치되었을 당시에 현청 및 관청의 식수와 제사등의 행사시에 필요한 청정 제수는 이 마을에서 나는 생수를 사용하였을 것이다.. 청정한 식수를 공급받는 과정에서 \u0027맛이 좋은 샘물을 바친다\u0027는 뜻으로 지명이 이두(吏讀)로 표기되어 공샘이 (공세미:공천미-貢泉味)라 불리다가 그 이후 현청이 이전됨에 따라 생수 공급의 필요성이 없어지게 되고. 120년 전 부락이 형성되고 포구가 축성되는 등 어업에 종사하는 사람이 많아지자 포구가 있는 마을이라 하여 공천포(公泉浦)라는 리명으로 불리게 된 것으로 예측된다.","body":"예래 2리는 해안선을 따라 넓은 모래판이 펼쳐져 있고 그 중간 중간에서는 깨끗한 생수가 용출하여 식수로 이용되고 있으며. 여름 철에는 물난밭에서 나는 물이 골창물이라는 도랑을 이루며 바다로 흘러내리는 등 예부터 수자원이 풍부하였다. 특히 새까만 모래알들과 그 모래알 사이로 샘솟는 이 마을의 젖줄 \u0027영등물\u0027은 예래 2리 에서 빼놓을 수 없다. 비단 이것 뿐만이 아니라 예래동은 현대에 이르러서도 깨끗한 제주 속에서도 청정 환경을 토대로 하는 생태마을로 꼽히고 있고. 상고시대의 유물과 유적인 \u0027고인돌\u0027과 \u0027왜왓\u0027도 빼놓을 수 없는 예래 2리의 이야기거리이다. 그 외에도 마을의 개괄적인 내용을 비롯하여. 마을의 형성과 변천에 관련된 설촌 유래. 지명 유래. 한문서당과 같은 이 고장의 역사. 문화에 대하여 살펴볼 수 있다. 생활의 변천사를 담은 의.식.주 생활과 고장의 관혼상제와 세시풍속. 일제하에서의 생활. 사건사고. 또한 제주의 아픈역사인 4.3사건 역시 기록되어 있다. 해안마을 답게 어로(漁撈)의 변화. 그리고 기타 방언이나 민요. 속담 등도 함께 실려 있다.","ref":"해당없음","pub":"남원읍 신례2리","date":"1994-01-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3717","zip":"63612","addr":"제주특별자치도 서귀포시 남원읍 신례리 72-18"},{"id":3734,"name":"고내봉","lat":33.457352,"lng":126.340551,"theme":"oreum","cat":"확장분야","d1":"사회","d2":"풍속/민속학","title":"고내리지","sub":"해당없음","author":"김봉옥","abs":"사람은 태어나 고향에 자라면서 처음으로 자신과 외부와의 상호관계를 인식하게 되며. 역사와 사회의 주인공으로서 자신의 존재에 대한 인식을 시작하면서부터 마음 속에 영원한 애향심을 가지고 자신의 생애를 설계하게 된다. 이러한 뜻에서 향토지의 발간은 후대들에게 대를 이어가면서 향토에 대한 깊은 인식을 주고. 애향심과 조국애를 배양하는데 큰 도움을 줄 것이라 굳게 믿는다.","body":"해안절경이 뛰어난 마을 고내리 향토지이다. 1980년. 뜻있는 마을 관계자들과 재일향민들의 적극협조로 발간되었다. 마을의 위치와 자연환경. 설촌과 성씨. 마을의 향약. 민속문화.고내팔경 등을 향토사학자 김봉옥씨가 자료를 수집조사해 편집했다.","ref":"해당없음","pub":"고내리","date":"1980-01-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3734","zip":"63045","addr":"제주특별자치도 제주시 애월읍 고내리 산3-1"},{"id":3743,"name":"정의현성","lat":33.386948,"lng":126.799951,"theme":"fort","cat":"확장분야","d1":"사회","d2":"풍속/민속학","title":"옛날엔 영 살았젠","sub":"해당없음","author":"제주시교육청","abs":"[옛날엔 영 살았젠]은 \u0027옛날에는 이렇게 살았단다\u0027라는 뜻의 제주방언으로. 제주향토학습자료로써 이 책을 발간하였다. 제주의 선사시대때의 유적은 물론. 행정과 대외교류. 제주인의 생업. 세시풍속. 민속신앙. 제주어에 대한 제주향토자료를 학습과 제주 역사의 흐름을 이해 하는 데 도움을 줄 것이다. 또한 이 책에서는 \u0027제주섬은 언제 생겼을까 \u0027. \u0027제주에는 언제부터 사람들이 살았을까 \u0027. \u0027탐라국 사람들은 어떻게 살았을까 \u0027. \u0027탐라국은 언제 고려에 귀속되었을까 \u0027. \u0027왜 방어시설이 필요했을까 \u0027. \u0027감귤은 언제부터 재배되었을까 \u0027. \u0027바다를 통한 제주사람들의 대외 교류는 언제부터 시작되었을까 \u0027. \u0027제주에는 불교가 언제 들어왔을까 그 이전에는 무엇을 믿고 살았을까 \u0027 이런 형태로 각 테마의 서두에서 의문형으로 호기심을 자아내고. 이에 대한 설명을 사진과 함께 상세하게 실었다.","body":"이 책에서는 제주의 선사시대의 유적(라영숙). 행정과 대외 교류(좌진영). 제주의 방어 시설(양수열). 민초들의 저항(하명실). 제주에 유배 온 사람들(양인숙). 제주인의 생업(이양신). 의식주 생활(고영호). 제주의 세시풍속(장승심). 민속신앙(고영철). 제주어(강경수)의 내용을 다루고 있다. 그 동안 제주지역에서는 구석기에서 초기 철기 시대에 이르는 유물과 유적들이 발굴되었으며 이들을 바탕으로 제주 지역 선사인들의 삶을 짐작 해 볼 수 있다. 구석기 유적인 빌레못 동굴 유적에서 출토된 석기류와 동물뼈 화석을 통해 추정해 보면 제주에서는 약 4만년 전 이전에 인류가 생활하고 있었음을 추정할 수 있다. 고대 탐라국이 언제 형성되었는지. 또 그 규모는 어떠했는지에 대해서는 잘 알 수가 없지만. 탐라전기시대의 기록을 참고하면 기원후부터 약 500년까지라 하겠다. 탐라의 형성과 관련된 것으로 제주시 용담동 월성마을(먹돌새기)에 있는 용담동 무덤 유적이 있다. 여기서는 철제장검과 단검. 도끼 등의 유물이 발견되었다. 이것들은 실제 전투용의 무기들이 아니라 자기의 고귀한 신분이나 힘을 자랑하기 위한 물건들이었다. 또한 중국 것으로 여겨지는 유리구슬 제품이 발견되었는데 이는 철제무기류와 유리구슬 등이 발견된 무덤의 주인공들은 자신들의 사회적 지위를 자랑하기 위한 물품들을 얻기 위하여 한반도와 중국까지 교역한 국(國)의 수장(首長)계층이었다고 추측된다. 점차 시간이 흐르면서 고려에 귀속되고 원의 간섭을 받는 과정을 거치고. 조선으로 들어서서 제주는 제주목. 대정현. 정의현의 세 행정구역으로 나뉘게 된다. 그런데 왜구의 침략은 고려말기. 조선시대에까지 계속되었는데. 그렇게 되자 조선정부는 초기부터 엄격한 해안 방어 정책을 써서 왜구의 침략에 대비하게 되었다. 이러한 왜구 침략에 대비로써 체계적인 방어를 위해 설치한 시설은 3성 9진 25봉수 38연대로 요약할 수 있다. 여기서의 3성은 행정과 군사목적을 갖춘 성으로 제주읍성. 정의현성. 대정현성을 일컫는다. 고려시대 탐라국이 고려에 속하는 지방이 되었던 때부터 제주민초들의 저항은 있었으나. 조선시대에는 정치적 상황으로 19세기 전까지는 그리 큰 민중의 저항이 발생하지는 않았다. 하지만 19세기에 들어와 조선왕조가 세도정치로 부패하고 외세가 침입하면서 정치. 사회적으로 부정이 심해져 다른 지역처럼 제주 백성들도 살기 위한 저항을 거세게 하기 시작했다. 1905년 을사조약으로 외교권을 잃어버린 우리나라는 일제의 식민지로 전락하여 1910년 완전히 나라의 주권을 빼앗겼다. 이러한 상황에서 일제의 폭력에 대항한 제주인들의 저항은 독립투쟁으로 발전하게 된다.","ref":"해당없음","pub":"제주시교육청","date":"2005-01-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3743","zip":"63624","addr":"제주특별자치도 서귀포시 표선면 성읍리 820-1"},{"id":3773,"name":"귤림서원","lat":33.510438,"lng":126.525713,"theme":"fort","cat":"확장분야","d1":"역사","d2":"근대","title":"제주 오현 조사","sub":"해당없음","author":"탐라문화연구소","abs":"김정은 충암묘를 만들어 배향했던 인물이고. 현종10년(1669) 에는 김상헌과 정온이 배향되었다. 숙종 4년(1695)에는 제주목사를 지낸 송인수가 배향되었으며. 숙종 21년(1695)에는 제주유학 김성우 등의 건의에 의해여 제주에 유배되었던 송시열이 배행되었다. 고종 8년(1871) 대원군의 서원철폐령에 의해 귤림서원이 철폐되면서 여기에 배향되었던 오현에 대한 제사를 드리는 제단이 마련 되면서 오현단이라 불려지게 되었다. 귤림서원이 자리했던 곳이 제주도민들에게 귤림서원 터로서 보다는 오현단으로 널리 알려지게 된 것은 이러한 연유때문이다. 오현에 대한 체계적인 학술조사와 새로운 조명은 제주역사의 정체성을 확립해 나가는 하나의 길이라 믿어 의심치 않는다. 그러나 무엇보다 중요한 것은 오현의 정신을 오늘날 효과적으로 계승할 수 있는 방안일 것이다. 아무리 훌륭한 문화유산이라도 현대적 의미가 없게 된다면 그것은 생명력을 잃은 문화유산이 되고 말 것이기 때문이다.","body":"제주오현(五賢)은 귤림서원(橘林書院) 에 배향되었던 다섯명의 현인을 말한다. 즉 충암 김정. 청음 김상헌. 동계 정온. 규암 송인수. 우암 송시열을 지칭한다. 사실 서원은 사학(私學)을 대표하는 교육기관이면서 도 각 지방 군현의 향청(鄕廳)과 더불어 향촌사림의 집결소로서 정치.사회적 기능을 가지고 있었다. 귤림서원은 문묘종사였던 충암묘와 인재양성을 위해 설치되었던 장수당(藏修堂)에 그 연원을 두고 있다. 충암묘는 조광조 등과 함께 기묘사화에 연루되어 제주에 유배되었다가 사약을 받고 죽은 충암 김정의 넋을 기리기 위해 선조11년(1578)에 조인후 제주판관에 의해 그의 적거지에 세워졌다. 반면에 장수당은 효종 10년(1659)에 제주출신 진사 김짐용의 건의로 이회(李檜) 목사에 의해 책을 읽고 학문에 힘쓰는 장소로 지금의 오현단 일대에 건립되었다. 서로 위치를 달리했던 두 기관은 현종8년(1667) 최진남 제주판관이 김정의 사묘를 장수당 남쪽으로 옮기면서 합쳐지게 된 것이다. 즉. 이때부터 사(祀)와 재(齋)를 갖춘 서원으로 발전하게 되었다. 당시 이곳은 감귤을 진상하기 위해 과원이 있었던 곳으로 귤림서원은 귤나무가 무성한 곳에 서원이 위치해 있다는 의미에서 유래되었다. 귤림서원에 대한 국가의 공식적인 인정은 숙종8년(1682)에 이루어졌다.","ref":"해당없음","pub":"제주시/탐라문화연구소","date":"2000-01-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3773","zip":"63192","addr":"제주특별자치도 제주시 이도일동 1421-34"},{"id":3778,"name":"청수리 가마오름 일제 진지동굴","lat":33.30517,"lng":126.247815,"theme":"fort","cat":"확장분야","d1":"역사","d2":"일제강점기","title":"오늘에 남아있는 일제의 흔적들","sub":"해당없음","author":"제주도/제주예총","abs":"이 사진 집을 보고 있으며 모슬포 비행장에 강제노역 당하던 우리의 아버지. 할아버지의 그 고단했던 삶들을 떠올린다. 제주에는 특정한 세대를 부르는 말이 있는데 `묻지마라 갑자생`이 그것이다. 얼마나 역사적 시련기에 있었으면 갑자생 그러면 제주 근현대사의 희생자들이였음을 상징하는 말이 되어 버렸다. 그정도로 그들의 고통의 컸다는 말일 것이다. 또한 이책자에는 오름사진과 해안가 절벽이 아름다운 모습으로 잡혀있는데 거기에도 여지없이 동굴들이 있다. 이사진집은 일제가 남긴 유적들을 보면서 용서는 하되 그 아픔을 잊지는 말고 교훈을 얻어야 함을 말하고 있다.","body":"오늘에 남아있는 일제의 흔적들은 일제시대의 유적들을 사진으로 담아놓은 사진 집이다. 우리가 잘 알고 있는 진지동굴이라든지 모슬포에 즐비하게 있었던 격납고같은 설치물들. 고사포 기지. 그리고 주정공장의 모습이라 든지 당시의 적지 였거나 그랬을지도 모를 곳들이 사진으로 담겨져 있다 말 그대로 역사의 흔적인 것이다.","ref":"해당없음","pub":"제주도/제주예총","date":"1996-01-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3778","zip":"63006","addr":"제주특별자치도 제주시 한경면 청수리 1166"},{"id":3779,"name":"비자림","lat":33.49135,"lng":126.81058,"theme":"eco","cat":"확장분야","d1":"사회","d2":"사회","title":"제주도 2","sub":"해당없음","author":"제주도","abs":"우리는 언제나 민족의 독립과 국토의 통일을 염원해 왔다. 그러나 이는 어디까지나 목적을 위한 수단이지 목적 그 자체는 아닌 것이다. 우리의 목적은 민족의 영광. 즉 복지사회건설에 있다.","body":"기관공무원의 연구발표와 실무교양에 쓰여질 뿐아니라 향토개발사업의총계와 그리고 전도민의 경제 사회 문화들 각 분야의 연구 발표를 골고루 구제 하여 혁명정신무장을 강화하여 교양 향상에 이바지 하는데 그 목표가 있다. 우리는 언제나 민족의 독립과 국토의 통일을 염원해 왔다. 그러나 이는 어디까지나 목적을 위한 수단이지 목적 그 자체는 아닌 것이다. 우리의 목적은 민족의 영광 즉 복지사회건설에 있다. 독립된 지 십여년이 경과되도록 \u0027유엔\u0027에 가입하지 못함을 염려하기도 한다.","ref":"해당없음","pub":"제주도공보관실","date":"2000-01-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3779","zip":"63551","addr":"제주특별자치도 제주시 구좌읍 평대리 3161-1"},{"id":3813,"name":"도두봉","lat":33.508034,"lng":126.468195,"theme":"oreum","cat":"확장분야","d1":"사회","d2":"풍속/민속학","title":"몰래물향토지","sub":"해당없음","author":"몰래물향토지발간위원회","abs":"희미한 등잔불 밑에 앉아 이야기 하던 그 옛날의 지도를 만들어 우리네 조상님들이 어느 곳에 살았던가 한 것을 한 눈에 알 수 있게 . 어떠한 곳에 있었는가를 지도에 표시하여 보았다. 워낙 오래 전 일이라 정확성에 빈약하고. 사료(史料)수집의 빈약으로 착오가 있더라도 너그러이 헤아려 주었으면 한다. 선조들의 숨결이 서려있는 곳 몰래물. 오랜 세월을 두고 선조들이 대대로 살아온 몰래물의 형성과 변천과정을 알려줄 문헌이나. 옛일을 고증해 줄 향노. 유지(有志)들도 이제는 가고. 마을도 없어졌다. 없어진 곳에 향지는 웬일이고 할 수도 있겠으나 동성동본(同性同本)은 백대지친(百代之親)이라 하여 만지동근(萬枝洞根)임을 확인하는 것이다.","body":"몰래물은 한라 영산의 정기를 이어받은 도두봉과 드넓게 펼쳐진 비옥한 토지. 그리고 연안수자원이 풍부하여 다른 어느 지역보다도 무한히 도약할 수 있는 잠재력을 지닌 희망의 땅이었다. 그러나 불행히도 마을 전체가 제주국제공항 확장지역에 포함되어 모든 마을 주민들은 조상 대대로 살아온 고향을 지키고 싶었으나. 국가와 지역발전을 위한 충정으로 정든 고향을 떠나 여러 곳에 흩어져 정착하는 아픔을 겪었다. 비록 지금은 없는 마을이지만 그 역사를 기억하고자 본 지를 발간하여 몰래물의 역사. 자연환경을 기록하고. 1940년도 이전의 몰래물 원형도와 점차 변화과정의 지도를 함께 실고 있다.또한 몰래물의 신앙과 민속. 전설등도 살펴 볼 수 있다.","ref":"해당없음","pub":"몰래물향토지발간위원회","date":"2000-01-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3813","zip":"63112","addr":"제주특별자치도 제주시 도두일동 산1"},{"id":3822,"name":"빌레못 동굴 유적","lat":33.404514,"lng":126.350424,"theme":"life","cat":"확장분야","d1":"문화","d2":"전통문화","title":"제주도 천연동굴내 문화유적기초조사보고서","sub":"해당없음","author":"제주도","abs":"우리 제주는 민족의 영산 한라산을 두고 갖가지 동식물이 살아가는 수풀과 계곡. 형형색색으로 빚어진 천연 예술품인 바위와 분화구. 단아하게 생긴 기생화산인 오름들과 대평원처럼 펼쳐진 목장과 바다로 떨어지는 폭포 등 실로 아름다움이 사철 넘치는 섬이다. 이러한 자연 위에 선사시대부터 열린 역사는 독립 부족 국가였던 탐라국 시대와 고려시대. 조선조와 현대에 이르기까지 유구한 맥을 이루면서 여기까지 왔다. 제주도가 자연이 신비롭고 유구한 역사를 지녔다는 사실은 곳곳에 산재해 있는 천연동굴과 그 속에 살아 있는 문화유적이 증언하고 있다. 이에 따라 제주도 천연 동굴 내 문화유적 기초조사를 실시하고 그 보고서를 펴내는 것은 역사적으로나 학술적. 문화적으로 매우 값진 일이다. 또한 제주도의 동굴유적에 대한 연구가 더욱 활발해져 천연동굴이 잘 보존되고. 제주사가 올바르게 정립되어 기지를 바란다.","body":"빌레못 동굴 유적\u0027은 제주의 1만여년전의 연륙설을 뒷받침해주고 있는 매우 귀중한 문화 유산이다. 이처럼 제주의 천연동굴은 신비로운 자연일 뿐만 아니라. 역사의 보고로서 많은 문화유적이 아직도 동굴 속에 살아 있다는 것을 보여준다. 이에 따라 천연동굴의 문화유적에 대한 기초조사를 실시하고 보고서로 엮었다. 조사개요 및 조사에 대한 내용으로 동굴입구 집자리. 바위그늘 집자리에 대하여 적고 있다.","ref":"해당없음","pub":"제주도","date":"2001-01-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3822","zip":"63038","addr":"제주특별자치도 제주시 애월읍 어음리 1391"},{"id":3842,"name":"용담레포츠 공원","lat":33.518207,"lng":126.499395,"theme":"eco","cat":"확장분야","d1":"사회","d2":"풍속/민속학","title":"용담동지","sub":"해당없음","author":"용담동지편찬위원","abs":"용담동에는 옹관묘. 석관묘. 고인돌 등의 선사유적들이 많이 발견되고 있고. 조선시대대표적 교육기관인 제주향교가 있다. 특히 용연을 비롯하여 용두암. 용담레포츠 공원. 해안절경 등이 위치하여 시민들의 휴식처인 동시에 관광 요충지로 각광을 받고 있으며. 제주국제공항이 있어 명실상부한 제주의 관문이라 할 수 있다.이렇게 역사가 오래고 아름다운 용담마을에 마땅한 향토지가 없어 안타까움을 갖고 있던 터에 이 마을의 역사와 문화. 설화등을 총망라한 용담동지를 편찬하게 되었다. 특히 용담동의 깊은 역사는 나아가 제주의 역사를 이해하는 데도 도움이 될 것이다.","body":"태초에 바다 한가운데에서 한라산이 솟아오르고. 백록담에서 두 줄기 큰 내(川)가 흘러넘쳐. 다시 바다와 만나 용연을 이루어 마을이 형성 된 곳.. 그래서 마을 이름을 용담이라 했고. 두줄기 큰 내 (한천. 병문천)를 중심으로 우리 용담동이 태동하기 시작했다. 이 향토지는 이러한 용담동의 고고사에서 현대사에 이르기까지 총 7장으로 구성되어 있다. 용담동의 역사와 문화. 유적. 설화등을 총망라한 본 지를 통해 선인들의 삶과 애환을 읽을 수 있을 것이다.","ref":"해당없음","pub":"용담동지편찬위원회","date":"2001-01-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3842","zip":"63114","addr":"제주특별자치도 제주시 용담삼동 1089"},{"id":3857,"name":"마이못 해안","lat":33.493345,"lng":126.427501,"theme":"sea","cat":"확장분야","d1":"관광","d2":"관광","title":"제주생태기행/제주시권","sub":"해당없음","author":"제주시/제주참여환경연대","abs":"제주참여환경연대가 2003년 1월에 펴냈던 제주생태기행 안내책자 \u0027빛과 그림자의섬. 제주이야기\u0027에 이어 두번째 생태기행 안내책자인 \u0027제주시 생태기행\u0027을 세상에 내놓는다. 처음에 만든 책자가 제주도 전체의 생태유산을 개괄적으로 다룬 거라면. 이번에 내는 책자는 제호가 그러하듯 제주시 지역의 자연생태를 담고 있다. 이 책은 연구자들의 보고서처럼 전문적이지도 않으나. 그렇다고 기존에 나와 있는 관광책자처럼 단순하게 관광지를 알리는 관광안내서도 아니다. 늘 우리 곁에 두고 있지만 그 소중함을 제대로 깨닫지 못하는 자연유산을 소개하고. 무심코 지나 쳤던 작은 생명들에 대한 관심을 부추기기 위해 이 책은 만들어졌다.","body":"우리 제주도는 예로부터 한라산 주변일대가 식물의 보고라고 할 만큼 다양한 식물자원을 가지고 있으며. 노루 등 야생동물들이 많이 서식하고 있는 천해의 자연을 그대로 간직한 고장입니다. 제주생태기행은 \u0027식물 및 화산연구의 보고\u0027 라고 할 수 있는 한라산의 자생식물 등을 비롯하여 \u0027바람의 고향\u0027 오류. \u0027생태계의 요람\u0027 습지. \u0027제주 바다의 깊고 푸른빛\u0027 제주해안. \u0027제주 생명의 원류\u0027 하천. \u0027산신 같은 산천단 곰솔\u0027 등 천연기념물과 자연학습장을 총망라한 자연 그대로의 세계를 담은 지침서로써 매우 소중한 자료라고 생각합니다.","ref":"해당없음","pub":"제주시/제주참여환경연대","date":"2005-01-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3857","zip":"63068","addr":"제주특별자치도 제주시 외도이동 1956-23"},{"id":3868,"name":"거믄여해안경승지","lat":33.243349,"lng":126.58115,"theme":"sea","cat":"확장분야","d1":"문화","d2":"생활문화","title":"그리운 서귀포칠십리여행","sub":"해당없음","author":"서귀포시","abs":"천혜의 자연경관과 남국의 정취를 자랑하는 아름다운 꿈의 도시 서귀포. 장엄한 한라산과 광활한 초원. 신이 조각한 듯한 기암절벽과 청정한 바다가 서로 조화를 이루며 세계인들에게 무한한 감동을 안겨 주는 곳.다양한 레저. 휴양관광과 함께 인류 평화와 대화합을 다짐하는 세기의 대제전인 2002월드컵 축구대회가 열렸던 스포츠의 파라다이스. 역사가 문화가 살아 숨쉬는 도시. 신명나는 축제가 사계절 개최되어 내외국인들에게 풍성한 볼거리와 즐길거리를 제공해 주는 서귀포시로 초대한다.","body":"이 책은 2002년 8월 23일 부터 11월 20일까지 전국민을 대상으로 공모한 자원 가운데 [서귀포칠십리 70경 자원선정 위원회]의 심의를 거쳐 지정한 서귀포 70경 관광화보집이다. 서귀포시에 오면 70가지의 독특한 아름다움과 만날 수 있다. 또한 다양한 레저체험과 휴양관광을 함께 즐기며 평생에 잊지 못할 소중한 추억거리를 만들 수 있다. 이러한 서귀포시의 70가지의 아름다움을 코스별로 4코스로 분류해 `칠십리 여행`으로 엮었다. 백록담과 돈내코. 서귀포 자연 휴양림. 영실기암. 예래동 환해장성. 서귀포 잠녀. 천제연 폭포. 칠선녀 축제. 법화사지. 강정천. 이중섭 문화의 거리. 자리테우. 서귀포 칠십리 축제. 정방폭포. 거믄여해안경승지. 쇠소깍. 서귀포 감귤. 향토 오일시장에 이르기까지 테마별 여행을 화보와 함께 소개 한다.","ref":"해당없음","pub":"서귀포시","date":"2003-01-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=3868","zip":"63599","addr":"제주특별자치도 서귀포시 토평동 473-1"},{"id":4023,"name":"만수사터","lat":33.515655,"lng":126.532331,"theme":"faith","cat":"확장분야","d1":"사회","d2":"풍속/민속학","title":"건입동지","sub":"해당없음","author":"건입동마을회","abs":"건입동지에는 건입동의 설촌유래로부터 일제 항일운동의 활약의 하나인 `산지용진회`의 활동그리고 관내의 주요시설들을 소개하고 있다. 뿐만아니라 2000년을 여는 3대개발인 1. 산지천 복원. 2. 제주항이 달라진다. 3. 스포츠센터 건립공사의 취지 또한 실려 있다. 그래서 건입동지 하나만으로도 건입동의 역사와 민속. 유물과 유적 인물등을 소상히 살필 수 있다.","body":"제주의 건입동은 많은 유적들이 널려있고 산지항 즉 제주항은 또한 중국과 무역의 관문이었습니다. 중요 유적으로는 산천서당. 연무장. 괘승정. 연교정. 영은정. 좌연각. 번길당. 홍예교 등이 있고 일제강점기에는 `산지용진회`라는 항일단체를 결사하여 독립운동에 앞장서기도 하였습니다.","ref":"해당없음","pub":"건입동마을회","date":"2001-01-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=4023","zip":"63279","addr":"제주특별자치도 제주시 건입동 1275-10"},{"id":4101,"name":"인성리 방사탑","lat":33.241599,"lng":126.282581,"theme":"faith","cat":"확장분야","d1":"역사","d2":"근대","title":"널개오름을 등진 섬마을","sub":"해당없음","author":"한국향토사연구전국협의회","abs":"우리가 살고 있는 고장마다 고유한 촌락문화가 존재하며. 이의 실태를 정확히 파악하여 기록.보존. 발전시키는 것은 우리의 시급한 과제로 대두된다. 일제강점기 우리문화의 말살정책과 1970년대 이후의 산업화.도시화 과정에서 민족생활양식의 기반인 우리의 촌락사회가 파괴. 멸실. 훼손. 변형되어 그 실체를 파악하기 어렵게 되어가고 있다. 이러한 시점에서 촌락사회의 실태. 그 역사와 문화를 조사.보존하는 일은 우리가 해야할 당연한 책무이다. 이 책자의 발간이 계기가 되어 전국촌락 실태조사로 확대되고 이자료가 널리 활용될 수 있기 바란다.","body":"주로 300~500년 전 에 이루어진 `제주의 마을`들에는 마을마다 특이한 형성과정이 있다. 귀양으로 혹은 정치적 망명으로 목숨을 걸고 거친 바다를 건너와서 부평초처럼 정착했던 태초의 마을 사람들.우리의 이 작업은 이들에 대한 애뜻한 한가닥 애정에서 비롯된 것 이다. 정착후 이들은 숱한 전설과 일화를 남겼다. 거친한숨. 고뇌의 숨결은 그대로 민요가 되었다. 지어지는데로 붙인 밭이름. 바다 이름. 언덕 이름들이 그마을의 역사와 삶의 자취들을 짐작케 하며 오늘날까지도 밭이랑의 돌멩이만큼이나 널려 있다.","ref":"해당없음","pub":"한국향토사연구전국협의회/문화체육부","date":"1996-01-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=4101","zip":"63511","addr":"제주특별자치도 서귀포시 대정읍 인성리 29-1"},{"id":4390,"name":"구엄리 돌염전","lat":33.483407,"lng":126.376488,"theme":"sea","cat":"확장분야","d1":"사회","d2":"사회","title":"구엄리돌염전","sub":"해당없음","author":"제주특별자치도","abs":"커다란 암반 위에 마치 거북이 등처럼 흙으로 경계선을 만들며 바닷물을 퍼 올려 여러 번의 손을 거쳐 염도를 높였으며 마지막으로 염분을 졸여서 소금을 만들었다.","body":"커다란 암반 위에 마치 거북이 등처럼 흙으로 경계선을 만들며 바닷물을 퍼 올려 여러 번의 손을 거쳐 염도를 높였으며 마지막으로 염분을 졸여서 소금을 만들었다. 빌레에서 생산된 소금은 당시 제주에서 귀하기로 소문나 육지 염전의 열 배 가격으로 거래되었으며. 그 맛과 품질이 뛰어나 나라님에게까지 진상할 정도였다. \u003c발췌 : 즐거운 제주 (제주넷)_p.99\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-30","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=4390","zip":"63049","addr":"제주특별자치도 제주시 애월읍 구엄리 608-1"},{"id":4392,"name":"단산","lat":33.242848,"lng":126.288344,"theme":"oreum","cat":"확장분야","d1":"자연","d2":"지구과학","title":"박쥐모양의단산","sub":"해당없음","author":"제주특별자치도","abs":"박쥐형상을 하고 있는 \u003c단산\u003e 옛날부터 전해 내려오는 구명수의 전설이 있는 곳이다. 아득한 옛날 이 지역에 괴질이 번지고 있었는데 현감의 선몽대로 마침내 석양에 붉게 타오르는 박쥐가 눈앞에 보이는 단산의 형상이 바로 그것이었다고 한다.","body":"박쥐형상을 하고 있는 \u003c단산\u003e 옛날부터 전해 내려오는 구명수의 전설이 있는 곳이다. 아득한 옛날 이 지역에 괴질이 번지고 있었는데 현감의 선몽대로 마침내 석양에 붉게 타오르는 박쥐가 눈앞에 보이는 단산의 형상이 바로 그것이었다고 한다. \u003c발췌 : 즐거운 제주 (제주넷)_p.241\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2007-09-30","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=4392","zip":"63511","addr":"제주특별자치도 서귀포시 대정읍 인성리 21-2"},{"id":4495,"name":"불탑사5층석탑","lat":33.529296,"lng":126.598174,"theme":"faith","cat":"확장분야","d1":"관광","d2":"관광","title":"즐거운 제주(숨어있는 제주의 설화.전설을 따라)","sub":"해당없음","author":"㈜제주넷","abs":"제주를 찾는 관광객이나 자유여행객에게 제주는 어떤 의미를 가지고 있을까 사실 많은 사람들이 알고 있는 제주의 모습은 개개인마다 조금씩 다르겠지만 제주에 살고 있는 주민에게도 생소한 이야기가 많이 있다. 이러한 이야기들은 제주의 문화를 접하지 못했던 여행자들이나 외국인들에게는 또 다른 새로운 볼거리로 신비롭게 다가갈 수 있다. 어디에서나 쉽게 찾아볼 수 없는 자연경관과 독특한 생활문화. 지리적 폐쇄성으로 인해 사람들이 살아가는 모습 또한 외부인의 호기심을 끄는데 충분하다. 이번 책자에 담겨있는 제주의 관광지 주변의 설화. 전설지 소개는 관광지에 볼거리와 더불어 그 속에 어떤 의미가 담겨져 있는지를 느끼게 해줄 것이다.","body":"옛날 한라산 기슭에 한 효성이 지극한 사냥꾼이 아픈 어머니와 살고 있었다. 어느날 그는 나그네로부터 어머니 병에 사슴피가 특효라는 말을 듣고 다음날 일찍 일어나 사슴 사냥에 나섰다. 한라산 정상은 짙은 안개로 덮여 앞을 분간하기 어려웠다. 안개 속을 헤매던 그는 마침내 사슴 한 마리를 발견했다. 바로 흰 사슴이었다. 화살을 쏘려던 순간. 어디선가 백발의 노인이 나타나 백록을 막아서더니 사슴을 안고 짙은 안개 속으로 사라졌다. 노인과 백록이 사라진 곳에는 큰 연못만이 있을 뿐이었다. 사냥을 포기한 그는 대신 연못물을 떠가지고 돌아와 어머니께 그 물을 드렸다. 그러자 어머니 병이 하루아침에 말끔히 나았다. 이 이야기를 들은 사람들은 훗날 이 연못을 ‘백록담‘ 이라고 불렀다 한다.","ref":"해당없음","pub":"㈜제주넷","date":"2007-01-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=4495","zip":"63316","addr":"제주특별자치도 제주시 삼양일동 697"},{"id":4602,"name":"구억리 검은굴","lat":33.281606,"lng":126.285685,"theme":"life","cat":"민속","d1":"민속공예","d2":"도기공예","title":"검은굴","sub":"해당없음","author":"제주특별자치도","abs":"불때기에서 연기가 기물에 들어가 회색으로 나타나 가마 이름을 \u0027검은 굴\u0027이라 한다.","body":"검은 굴에서는 기물들이 대략 1000도 내에서 소성되었다. 불때기에서 연기가 기물에 들어가 회색으로 나타난다. 그래서 가마 이름을 \u0027검은 굴\u0027이라 한다. \u003c발췌 : 제주의 민속 2권 P538. 1994년\u003e \u003c발췌 : 제주도 전통 사회의 옹기 생산과 유통에 관한 연구 P 72. 2002년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=4602","zip":"63519","addr":"제주특별자치도 서귀포시 대정읍 구억리 677"},{"id":4618,"name":"하도리별방진","lat":33.52618,"lng":126.884378,"theme":"fort","cat":"민속","d1":"의식주","d2":"해당없음","title":"별방진 지표조사 보고서","sub":"해당없음","author":"북제주군","abs":"별방진에 대한 지표조사는 성곽의 보존상태가 다소 양호한 구간을 중점적으로 실측조사하였고. 기타 구간은 현장확인 및 사진촬영을 하였다. 금번 지표조사의 중점구간은 서문지 반시계 방향 60m지점에서부터 동문지 부근까지 실시하였다. 본쇄의 서문지와 동문지를 잇는 해안 쪽 성곽은 대부분 소멸되어 없어지고 변형되었지만 동쪽의 치성 1개소와 인접한 성곽 일부는 그 윤곽을 잘 드러내고 있다. 쇄내 외로 통하는 문루는 서문 동문 남문 3개소가 있으며 문루에는 각각 옹성을 설치하여 방어하였다. 3개소의 옹성중 서문지와 동문지 옹성은 소멸되거나 변형되어 옹성의 윤곽만 남아 있다. 남문지 옹성의 외탁은 잘 남아 있으나 내탁은 붕괴 및 변형이 심한 상태이며 문루의 흔적은 어느 곳에서도 발견하지 못했다. 성곽은 평지에 내축으로 축성하고 내외택 면석은 부정형의 제주자연석을 쌓아 올리면서 성벽의 틈새는 작은 돌을 괴어 견고하게 축성하였으며 내택성벽의 경사는 0.5~1:10의 기울기를 갖고 있다. 내택의 축성은 서문지와 남문지 사이 일부구간에서 2단으로 축조한 모습을 발견할 수 있고 남문지와 동문지 사이 구간에도 2단식 축조의 흔적을 엿볼 수 있으니 2단식 축조의 진리는 좀더 정밀조사와 분석을 통하여 밝혀져야 하리라보며 본서에서는 현상만 고찰했다. 속채움석은 돌만 사용한 구간이 있고 돌과 흙을 혼용한 구간이 있다. 성곽 상부는 종벽하게 남아 있는 구간이 없어 정확한 형태는 알 수 없으나 미석과 여장이 있었다고 마을 주민(부영성 77 일구좌읍지발간)은 증언한다. 옹성의 축조는 성곽과 일체식으로 하였으나 치성의 축조는 성곽을 먼저 축조한 후 덧쌓은 방법으로 축조하였다. 탐라순력도 별방조점도를 참고하여 보면 쇄내에는 많은 건물들이 있으나 지금은 그 유적들을 찾아 볼 수 없고 오랜 옛날부터 내려온 우물터만이 현존하고 있다.","body":"북제주군에서는 현대사를 맞이하여 날로 훼손이 심화되어가는 문화재를 보호하고 보존하기 위한 사업의 일환으로 연초에 별방진에 대한 종합적인 정비계획을 수립하여 유적지 지표조사를 위해 지난 6월 (주) 금성종합건축사 사무소와 용역 계약이 이루어졌다. 지표조사는 현장답사가 선행되어 전반적인 보존 상태를 확인하고 날로 훼손이 심화 되어가는 성곽을 주요대상으로 삼았으며 보호구역으로 지정된 성곽을 중점적으로 조사하면서 성내 유적지와 유구 조사를 병행하여 추후 복원보수사업에 기초자료로서 활용될 수 있도록 하는데 주안점을 두고 조사 작업을 진행시켰다. 본보고서에서는 성곽의 보존 상태를 구간별로 설명. 특징과 현장을 설명하였으며 형태의 이해를 돕기 위해 실측도면과 구간별 현황사진을 함께 실었고 각계전문가의 자문을 구하여 별방진에 대한 역사적 의의를 살펴보고 문화재위원의 글을 함께 실어 문화재적 가치와 역사적 의미를 부각시키려는 노력도 소홀히 하지 않았다. 차제에 성지 전반에 걸친 보다 정밀한 지표조사와 발굴조사를 실시하여 성지의 전반적인 규모와 건물지 및 기타 유구 위치 등을 확인하여 복원보수사업이 진행됨이 타당하리라 사료된다.","ref":"해당없음","pub":"북제주군","date":"1993-09-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=4618","zip":"63362","addr":"제주특별자치도 제주시 구좌읍 하도리 3354"},{"id":4745,"name":"한림읍 명월진성","lat":33.400293,"lng":126.263205,"theme":"fort","cat":"민속","d1":"의식주","d2":"주생활","title":"명월진성 성벽위","sub":"해당없음","author":"제주특별자치도","abs":"이 명월진성은 한림읍 명월리와 동명리에 걸쳐 있다. 둘레가 2천 20자. 높이가 8자였으며. 동쪽과 남쪽 및 서쪽에 각각 문이 있었다.","body":"이 명월진성은 한림읍 명월리와 동명리에 걸쳐 있다. 둘레가 2천 20자. 높이가 8자였으며. 동쪽과 남쪽 및 서쪽에 각각 문이 있었다. 성 안에는 샘이 있어 가뭄에도 마르지 않았으며. 건물로는 객사. 별창. 군기고 등이 있었다. 원래 이곳에는 원래 성이 없었으나 조선 중종 5년(1510)에 장림 목사가 이곳은 비양도로 왜선이 가까이 대일 수 있는 곳이라 하여 목성을 쌓았었는데. 선조 25년 (1592)에 이경록 목사가 석성으로 개축하였으며. 영조 40년(1764)에는 이수봉 어사가 조정에 아뢰어 조방장을 만호로 승격시켰다. \u003c발췌 : 북제주군 문화유적분포지도 P219. 2002년\u003e","ref":"해당없음","pub":"제주특별자치도","date":"2006-10-01","link":"https://www.jeju.go.kr/culture/digitalContents/directory.htm?classification=\u0026subClassification=\u0026act=view\u0026seq=4745","zip":"63013","addr":"제주특별자치도 제주시 한림읍 동명리 2256"}];
const THEMES={
 sea:{name:"바다와 포구",color:"#1f7ea1",lede:"해녀와 어부가 드나들던 포구, 길을 밝힌 등대와 도대불, 소금을 굽던 돌염전까지. 섬 사람의 삶이 바다와 맞닿은 자리를 따라갑니다."},
 oreum:{name:"오름과 봉우리",color:"#5f9a2a",lede:"오름은 제주의 마을과 들판을 내려다보는 자리입니다. 데이터에 실린 오름과 봉우리를 차례로 오릅니다."},
 eco:{name:"숲·습지·철새",color:"#0f9d8a",lede:"고산습지와 비자림, 철새 도래지와 반딧불이 보호구역. 사람보다 오래 이 땅을 지켜온 생태 공간을 모았습니다."},
 water:{name:"물과 하천",color:"#4b6fd6",lede:"물이 귀한 섬에서 샘과 하천은 마을이 생기는 이유였습니다. 물터와 하천, 폭포와 계곡을 따라갑니다."},
 faith:{name:"신당과 절터",color:"#8e5bb5",lede:"마을을 지키는 본향당과 신당, 오래된 절터와 석탑. 제주 사람들이 기대어 온 믿음의 자리를 찾아갑니다."},
 fort:{name:"성곽과 근대의 흔적",color:"#b5543a",lede:"읍성과 진성, 일제강점기의 진지동굴, 근대의 관청과 서원까지. 섬을 지키고 다스리던 기록을 따라갑니다."},
 life:{name:"고분과 삶의 터",color:"#c78a1b",lede:"고인돌과 옹관묘, 패총과 동굴 유적에서 시장과 음식 문화까지. 제주 사람들이 살아온 오랜 시간을 짚어봅니다."}
};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byId=id=>DATA.find(r=>r.id===id);
DATA.forEach(r=>{r.city=r.addr.split(" ")[1]||"";r.area=r.addr.split(" ").slice(1,3).join(" ")});
function snip(r,n){let t=(r.abs&&r.abs.length>=40?r.abs:r.body)||"";t=t.replace(/\s+/g," ").trim();return t.length>n?t.slice(0,n)+"…":t}
function hav(a,b){const R=6371,t=x=>x*Math.PI/180,h=Math.sin(t(b.lat-a.lat)/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(t(b.lng-a.lng)/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function legs(l){return l.slice(1).map((r,i)=>hav(l[i],r))}
const sum=a=>a.reduce((x,y)=>x+y,0);
function route(list){ // 서쪽 끝에서 시작해 가까운 곳부터
  const left=[...list].sort((a,b)=>a.lng-b.lng),out=[left.shift()];
  while(left.length){const c=out[out.length-1];let bi=0,bd=1e9;left.forEach((r,i)=>{const d=hav(c,r);if(d<bd){bd=d;bi=i}});out.push(left.splice(bi,1)[0])}
  return out;
}
const ROUTES={};KEYS.forEach(k=>ROUTES[k]=route(DATA.filter(r=>r.theme===k)));
/* 찜 (자료 조회 화면과 같은 저장 키 공유) */
let favs=[];try{favs=JSON.parse(localStorage.getItem("jejuFavs")||"[]").filter(i=>byId(i))}catch(e){}
const saveFavs=()=>{try{localStorage.setItem("jejuFavs",JSON.stringify(favs))}catch(e){}};
const favLabel=id=>favs.includes(id)?"★ 수첩에 담김":"☆ 수첩에 담기";
const favBtn=id=>`<button class="favbtn${favs.includes(id)?" on":""}" data-fav="${id}" onclick="toggleFav(${id})">${favLabel(id)}</button>`;
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function updateFavUI(){
  document.querySelectorAll("[data-fav]").forEach(b=>{const id=+b.dataset.fav;b.textContent=favLabel(id);b.classList.toggle("on",favs.includes(id))});
  const bd=$("#badge");bd.hidden=!favs.length;bd.textContent=favs.length;
}
function toggleFav(id){
  const i=favs.indexOf(id);if(i>=0)favs.splice(i,1);else favs.push(id);
  saveFavs();updateFavUI();if(isMine())viewMine();
}
const isMine=()=>location.hash.startsWith("#/mine");
/* 지도 */
let cur=null;
function destroyMap(){if(cur){cur.remove();cur=null}}
function pin(color,num){return L.divIcon({className:"",html:`<div class="pin${num===""?" dot":""}" style="background:${color}"><span>${num}</span></div>`,iconSize:[26,26],iconAnchor:[7,26],popupAnchor:[6,-26]})}
function popup(r){return `<div class="pop"><b>${esc(r.name)}</b><div class="m">${esc(THEMES[r.theme].name)} · ${esc(r.area)}</div><p>${esc(snip(r,90))}</p><button class="sbtn" onclick="openPlace(${r.id})">이야기 읽기</button>${favBtn(r.id)}</div>`}
function mkMap(el,list,o){
  if(typeof L==="undefined"){el.innerHTML='<div class="nomap">지도를 불러오지 못했습니다.<br>인터넷 연결을 확인해 주세요.</div>';return null}
  const map=L.map(el,{scrollWheelZoom:false}).setView([33.38,126.55],9),markers={};
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{maxZoom:19,subdomains:"abcd",attribution:"&copy; OpenStreetMap contributors &copy; CARTO"}).addTo(map);
  list.forEach((r,i)=>{const m=L.marker([r.lat,r.lng],{icon:pin(o.color(r),o.numbered?i+1:""),title:r.name}).addTo(map).bindPopup(()=>popup(r),{autoPanPadding:[30,30]});
    m.on("click",()=>o.onPick&&o.onPick(r.id));markers[r.id]=m});
  const ll=list.map(r=>[r.lat,r.lng]);
  if(o.line&&ll.length>1)L.polyline(ll,{color:o.line,weight:4,opacity:.9,dashArray:"9 8"}).addTo(map);
  if(ll.length)map.fitBounds(L.latLngBounds(ll),{padding:[34,34],maxZoom:13});
  cur=map;return {map,markers};
}
/* 상세 모달 */
function openPlace(id){
  const r=byId(id),t=THEMES[r.theme],row=(k,v)=>v&&v!=="해당없음"?`<dt>${k}</dt><dd>${v}</dd>`:"";
  $("#modal").innerHTML=`<div class="sheet"><button class="x" onclick="closePlace()" aria-label="닫기">×</button>
   <span class="chip" style="background:${t.color}">${esc(t.name)}</span>
   <h2>${esc(r.name)}</h2><div style="color:var(--muted);font-size:14px">${esc(r.addr)}</div>
   <div style="margin:12px 0">${favBtn(r.id)} ${r.link?`<a class="sbtn" style="text-decoration:none;display:inline-block" href="${esc(r.link)}" target="_blank" rel="noopener">원문 보기 ↗</a>`:""}</div>
   <dl>${row("자료 제목",esc(r.title))}${row("부제",esc(r.sub))}${row("저작자",esc(r.author))}${row("발행자",esc(r.pub))}${row("발행일",esc(r.date))}${row("분류",esc(r.cat+" · "+r.d1))}${row("좌표",r.lat+", "+r.lng)}</dl>
   ${r.abs&&r.abs!=="해당없음"?`<h4>초록</h4><div class="txt">${esc(r.abs)}</div>`:""}
   ${r.body?`<h4>내용</h4><div class="txt">${esc(r.body)}</div>`:""}
   ${r.ref&&r.ref!=="해당없음"?`<h4>참고문헌</h4><div class="txt" style="font-size:13px;color:var(--muted)">${esc(r.ref)}</div>`:""}</div>`;
  $("#modal").classList.add("on");document.body.style.overflow="hidden";$("#modal").scrollTop=0;
}
function closePlace(){$("#modal").classList.remove("on");document.body.style.overflow=""}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closePlace()});
addEventListener("keydown",e=>{if(e.key==="Escape")closePlace()});
/* 화면: 홈 */
function viewHome(){
  const tot=sum(KEYS.map(k=>sum(legs(ROUTES[k])))),jj=DATA.filter(r=>r.city==="제주시").length,sg=DATA.length-jj;
  const td=DATA[Math.floor(Date.now()/864e5)%DATA.length],tt=THEMES[td.theme];
  $("#app").innerHTML=`
  <header class="hero"><div class="wrap">
    <div class="eyebrow">JEJU HISTORY &amp; CULTURE TRAIL</div>
    <h1>돌담 너머,<br>제주의 시간을 걷다</h1>
    <p>제주특별자치도가 공개한 ${DATA.length}곳의 역사문화 자료를 일곱 갈래의 탐방 코스로 엮었습니다. 코스를 따라 걷고, 마음에 드는 곳은 수첩에 담아 나만의 답사 길을 만들어 보세요.</p>
    <div class="stats"><div><b>${DATA.length}</b><span>역사문화 장소</span></div><div><b>${KEYS.length}</b><span>테마 코스</span></div><div><b>${jj} / ${sg}</b><span>제주시 / 서귀포시</span></div></div>
    <a class="btn" href="#course-list" onclick="document.getElementById('course-list').scrollIntoView();return false">코스 둘러보기</a><a class="btn ghost" href="#/mine">내 답사수첩 열기</a>
  </div></header>
  <div class="wrap">
  <section class="blk"><h2 class="sec serif">오늘의 장소</h2><p class="sec-sub">매일 한 곳씩, 데이터 속 이야기를 소개합니다.</p>
    <div class="today"><span class="chip" style="background:${tt.color};justify-self:start">${esc(tt.name)}</span><h3>${esc(td.name)}</h3>
    <div style="color:var(--muted);font-size:14px">${esc(td.addr)}</div><p>${esc(snip(td,200))}</p>
    <div class="acts" style="margin:0"><button class="sbtn" onclick="openPlace(${td.id})">이야기 읽기</button>${favBtn(td.id)}<a class="sbtn" style="text-decoration:none" href="#/course/${td.theme}">이 장소가 있는 코스</a></div></div></section>
  <section class="blk" id="course-list"><h2 class="sec serif">테마 코스</h2><p class="sec-sub">장소의 성격에 따라 묶고, 서쪽에서 동쪽으로 가까운 곳부터 이었습니다.</p>
    <div class="grid">${KEYS.map(k=>{const l=ROUTES[k],t=THEMES[k],c1=l.filter(r=>r.city==="제주시").length;
      return `<a class="ccard" href="#/course/${k}"><div class="top" style="background:${t.color}"></div><div class="in"><h3>${t.name}</h3>
      <div class="m">${l.length}곳 · 직선 약 ${sum(legs(l)).toFixed(0)}km · 제주시 ${c1} / 서귀포시 ${l.length-c1}</div>
      <p>${esc(t.lede.split(".")[0])}.</p><div class="via"><b style="color:${t.color}">${esc(l[0].name)}</b> → … → <b style="color:${t.color}">${esc(l[l.length-1].name)}</b></div></div></a>`}).join("")}</div></section>
  <section class="blk"><h2 class="sec serif">한눈에 보기</h2><p class="sec-sub">색깔은 테마 코스입니다. 범례를 눌러 보고 싶은 테마만 골라 볼 수 있습니다.</p>
    <div class="legend" id="legend">${KEYS.map(k=>`<button style="--c:${THEMES[k].color}" data-k="${k}">${THEMES[k].name} ${ROUTES[k].length}</button>`).join("")}</div>
    <div class="map" id="map"></div></section>
  <section class="blk"><h2 class="sec serif">두 고장의 분포</h2><p class="sec-sub">자료에 실린 장소를 행정 구역별로 나눠 봤습니다.</p>
    <div class="bar"><div style="width:${jj/DATA.length*100}%;background:#2c5b57">제주시 ${jj}곳</div><div style="width:${sg/DATA.length*100}%;background:#c26e00">서귀포시 ${sg}곳</div></div></section>
  </div>`;
  const mm=mkMap($("#map"),DATA,{color:r=>THEMES[r.theme].color});
  if(mm)$("#legend").onclick=e=>{const b=e.target.closest("button");if(!b)return;b.classList.toggle("off");const on=b.classList.contains("off")?false:true;
    DATA.filter(r=>r.theme===b.dataset.k).forEach(r=>{const m=mm.markers[r.id];if(on)m.addTo(mm.map);else m.remove()})};
}
/* 화면: 카드 */
function stopCard(r,i,l,k,mine){
  const col=mine?"#e8590c":THEMES[r.theme].color,leg=i>0?`이전 장소에서 약 ${l[i-1].toFixed(1)}km`:"출발";
  return `<article class="stop" id="s${r.id}" data-id="${r.id}"><div class="num" style="background:${col}">${i+1}</div><div><h3>${esc(r.name)}</h3>
   <div class="meta">${esc(r.area)} · ${mine?esc(THEMES[r.theme].name)+" · ":""}${leg}</div><p>${esc(snip(r,mine?110:170))}</p>
   <div class="btns"><button class="sbtn" onclick="openPlace(${r.id})">이야기 읽기</button><button class="sbtn" onclick="focusPin(${r.id})">지도에서 보기</button>
   ${mine?`<button class="sbtn" onclick="moveFav(${r.id},-1)" ${i?"":"disabled"}>▲</button><button class="sbtn" onclick="moveFav(${r.id},1)" ${i<favs.length-1?"":"disabled"}>▼</button><button class="sbtn" onclick="toggleFav(${r.id})">✕ 빼기</button>`:favBtn(r.id)}</div></div></article>`;
}
function focusPin(id){
  if(!cur||!window.__mk)return;const m=window.__mk[id],r=byId(id);
  cur.setView([r.lat,r.lng],Math.max(cur.getZoom(),13));m.openPopup();
  if(innerWidth<=900)$("#map").scrollIntoView({block:"center"});
  setActive(id);
}
function setActive(id,scroll){document.querySelectorAll(".stop").forEach(e=>e.classList.toggle("active",+e.dataset.id===id));if(scroll){const e=$("#s"+id);if(e)e.scrollIntoView({block:"center",behavior:"smooth"})}}
/* 화면: 코스 */
function viewCourse(k){
  const t=THEMES[k],l=ROUTES[k],lg=legs(l),c1=l.filter(r=>r.city==="제주시").length,i=KEYS.indexOf(k),p=THEMES[KEYS[(i+KEYS.length-1)%KEYS.length]],n=THEMES[KEYS[(i+1)%KEYS.length]];
  $("#app").innerHTML=`<header class="chead" style="background:${t.color}"><div class="wrap"><a href="#/">← 홈</a><h1>${t.name}</h1><p>${esc(t.lede)}</p>
   <div class="facts"><span>📍 ${l.length}곳</span><span>직선거리 합계 약 ${sum(lg).toFixed(1)}km</span><span>제주시 ${c1} · 서귀포시 ${l.length-c1}</span><span>${esc(l[0].name)} → ${esc(l[l.length-1].name)}</span></div></div></header>
  <div class="wrap"><div class="cols"><div>${l.map((r,j)=>stopCard(r,j,lg,k)).join("")}</div><div class="mapcol"><div class="map" id="map"></div></div></div>
  <div class="pager"><a href="#/course/${KEYS[(i+KEYS.length-1)%KEYS.length]}"><small>← 이전 코스</small>${p.name}</a><a class="r" href="#/course/${KEYS[(i+1)%KEYS.length]}"><small>다음 코스 →</small>${n.name}</a></div></div>`;
  const mm=mkMap($("#map"),l,{numbered:true,color:()=>t.color,line:t.color,onPick:id=>setActive(id,true)});window.__mk=mm&&mm.markers;
}
/* 화면: 내 답사수첩 */
function moveFav(id,d){const i=favs.indexOf(id),j=i+d;if(j<0||j>=favs.length)return;[favs[i],favs[j]]=[favs[j],favs[i]];saveFavs();viewMine()}
function copyCourse(){
  const l=favs.map(byId),lg=legs(l);
  const txt="나만의 제주 역사문화 답사 코스\n"+l.map((r,i)=>`${i+1}. ${r.name} (${r.addr})${i?` - 이전에서 약 ${lg[i-1].toFixed(1)}km`:""}`).join("\n")+`\n직선거리 합계 약 ${sum(lg).toFixed(1)}km`;
  const done=()=>toast("코스를 클립보드에 복사했습니다");
  const fb=()=>{const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){toast("복사에 실패했습니다")}a.remove()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(done,fb);else fb();
}
function viewMine(){
  destroyMap();const l=favs.map(byId),lg=legs(l);
  $("#app").innerHTML=`<header class="chead" style="background:#e8590c"><div class="wrap"><a href="#/">← 홈</a><h1>내 답사수첩</h1><p>찜한 순서대로 이어진 나만의 답사 코스입니다. 순서를 바꾸면 지도의 선도 함께 바뀝니다.</p>
   <div class="facts"><span>📍 ${l.length}곳</span><span>직선거리 합계 약 ${sum(lg).toFixed(1)}km</span></div></div></header>
  <div class="wrap">`+(l.length?`<div class="cols" style="padding-bottom:20px"><div><div class="acts"><button class="sbtn" onclick="copyCourse()">코스를 글로 복사</button><button class="sbtn" onclick="if(confirm('수첩을 모두 비울까요?')){favs=[];saveFavs();updateFavUI();viewMine()}">전체 비우기</button></div>${l.map((r,j)=>stopCard(r,j,lg,null,true)).join("")}</div>
   <div class="mapcol"><div class="map" id="map"></div></div></div>`:
   `<div class="empty" style="margin:30px 0"><p style="font-size:18px;margin:0 0 6px">아직 담은 장소가 없습니다.</p>코스의 ☆ 수첩에 담기 버튼을 누르면 담은 순서대로 이곳에 코스가 만들어집니다.<br><br><a class="btn" href="#/">코스 둘러보기</a></div>`)+`</div>`;
  if(l.length){const mm=mkMap($("#map"),l,{numbered:true,color:()=>"#e8590c",line:"#e8590c",onPick:id=>setActive(id,true)});window.__mk=mm&&mm.markers}
  updateFavUI();
}
/* 라우터 */
function go(){
  closePlace();destroyMap();const h=location.hash.replace(/^#\/?/,"").split("/");
  if(h[0]==="course"&&THEMES[h[1]])viewCourse(h[1]);else if(h[0]==="mine")viewMine();else viewHome();
  const cur2=h[0]==="course"?"course":h[0]==="mine"?"mine":"home";
  document.querySelectorAll("nav a[data-nav]").forEach(a=>a.classList.toggle("on",a.dataset.nav===cur2));
  if(h[0]==="course")document.querySelector('nav a[data-nav="course"]').href="#/course/"+h[1];
  updateFavUI();scrollTo(0,0);
}
addEventListener("hashchange",go);
go();
</script>
</body>
</html>
